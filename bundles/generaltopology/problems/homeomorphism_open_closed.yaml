preamble: |
  universe u v w
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.IsClosed {X : Type u} (T : TopologicalSpace X) (C : Set X) : Prop
      := T.IsOpen Cᶜ

  def TopologicalSpace.Continuous {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      (f : X → Y) : Prop :=
    ∀ U, T'.IsOpen U → T.IsOpen (f ⁻¹' U)

  structure Homeomorph {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y) where
    toFun : X → Y
    invFun : Y → X
    left_inv : ∀ x, invFun (toFun x) = x
    right_inv : ∀ y, toFun (invFun y) = y
    continuous_toFun : T.Continuous T' toFun
    continuous_invFun : T'.Continuous T invFun

  def TopologicalSpace.IsOpenMap {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      (f : X → Y) : Prop :=
    ∀ U, T.IsOpen U → T'.IsOpen (f '' U)

  def TopologicalSpace.IsClosedMap {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      (f : X → Y) : Prop :=
    ∀ C, T.IsClosed C → T'.IsClosed (f '' C)

  theorem image_eq_preimage_of_inverse {X : Type u} {Y : Type v} {f : X → Y} {g : Y → X}
      (hgf : ∀ x, g (f x) = x) (hfg : ∀ y, f (g y) = y) (U : Set X) : f '' U = g ⁻¹' U := by
    apply Set.ext
    intro y
    constructor
    · rintro ⟨x, hx, rfl⟩
      show g (f x) ∈ U
      rw [hgf]
      exact hx
    · intro hy
      exact ⟨g y, hy, hfg y⟩

  theorem Homeomorph.image_eq_preimage {X : Type u} {Y : Type v} {T : TopologicalSpace X}
      {T' : TopologicalSpace Y} (h : Homeomorph T T') (U : Set X) : h.toFun '' U = h.invFun ⁻¹' U :=
    image_eq_preimage_of_inverse h.left_inv h.right_inv U

  end GeneralTopology
  open GeneralTopology
description: Show that the forward map of a homeomorphism is an open map and a closed map. Rewrite the image as a preimage and apply the continuity of the inverse. For the closed case, `show T'.IsOpen _` names the goal, and `Set.preimage_compl` moves the complement inside the preimage where the hypothesis has it.
