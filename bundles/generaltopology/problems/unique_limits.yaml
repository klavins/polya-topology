preamble: |
  universe u v
  namespace GeneralTopology
  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def Topology.IsNbhd {X : Type u} (T : Topology X) (x : X) (N : Set X) : Prop :=
    ∃ U, T.IsOpen U ∧ x ∈ U ∧ U ⊆ N

  theorem Topology.nbhd_of_isOpen {X : Type u} (T : Topology X) {U : Set X}
      (hU : T.IsOpen U) {x : X} (hx : x ∈ U) : T.IsNbhd x U :=
    ⟨U, hU, hx, subset_rfl⟩

  def Topology.IsT1 {X : Type u} (T : Topology X) : Prop :=
    ∀ x y : X, x ≠ y → ∃ U, T.IsOpen U ∧ x ∈ U ∧ y ∉ U

  def Topology.IsHausdorff {X : Type u} (T : Topology X) : Prop :=
    ∀ x y : X, x ≠ y → ∃ U V, T.IsOpen U ∧ T.IsOpen V ∧ x ∈ U ∧ y ∈ V ∧ U ∩ V = ∅

  def Topology.ConvergesTo {X : Type u} (T : Topology X) (x : ℕ → X) (a : X) : Prop :=
    ∀ N, T.IsNbhd a N → ∃ k : ℕ, ∀ n ≥ k, x n ∈ N

  theorem Topology.convergesTo_const {X : Type u} (T : Topology X) (a : X) :
      T.ConvergesTo (fun _ => a) a := by
    rintro N ⟨U, _, haU, hUN⟩
    exact ⟨0, fun _ _ => hUN haU⟩

  end GeneralTopology
  open GeneralTopology
description: Prove `Topology.convergesTo_unique` and `Topology.isT1_of_convergesTo_unique`. The first takes `max k l` as an index past both and rewrites along the emptiness of the intersection. In the second, `by_contra` and `push Not` turn the goal into the hypothesis that every open set around `x` holds `y`.
