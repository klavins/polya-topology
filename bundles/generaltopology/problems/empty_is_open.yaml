slug: empty_is_open
kind: theorem
title: The Empty Set is Open
statement: 'The empty set was not asked for, and does not need to be: it is the union of no sets at all. Uniting the members of the empty collection leaves nothing, so `⋃₀ ∅ = ∅`, and the union condition applies to the empty collection as to any other — its hypothesis, that every member is open, is satisfied because it has no members.'
concepts:
- topological_space
stub: 'theorem Topology.empty {X : Type u} (T : Topology X) : T.IsOpen (∅ : Set X) := sorry'
reference: |-
  theorem Topology.empty {X : Type u} (T : Topology X) : T.IsOpen (∅ : Set X) := by
    have h : T.IsOpen (⋃₀ (∅ : Set (Set X))) := T.sUnion (fun _ hU => hU.elim)
    rwa [Set.sUnion_empty] at h
spec: 'example : ∀ {X : Type u} (T : Topology X), T.IsOpen (∅ : Set X) := _root_.GeneralTopology.Topology.empty'
preamble: |
  universe u
  namespace GeneralTopology
  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  end GeneralTopology
  open GeneralTopology
description: Show that `∅` is open in any topology. Apply `T.sUnion` to the empty collection, whose hypothesis holds because a membership in `∅` is absurd — `fun _ hU => hU.elim` — and then rewrite with `Set.sUnion_empty`.
