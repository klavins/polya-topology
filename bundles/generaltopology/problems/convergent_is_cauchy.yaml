reference: |-
  theorem MetricSpace.cauchySeq_of_convergesTo {X : Type u} (M : MetricSpace X) {x : ℕ → X} {a : X}
      (h : M.ConvergesTo x a) : M.CauchySeq x := by
    intro ε hε
    obtain ⟨k, hk⟩ := h (ε / 2) (by linarith)
    refine ⟨k, fun m hm n hn => ?_⟩
    have h1 : M.dist a (x m) < ε / 2 := hk m hm
    have h2 : M.dist a (x n) < ε / 2 := hk n hn
    have h3 : M.dist (x m) a = M.dist a (x m) := M.dist_comm
    have h4 := M.dist_triangle (x m) a (x n)
    linarith
spec: |-
  example : ∀ {X : Type u} (M : MetricSpace X) {x : ℕ → X} {a : X}
      (h : M.ConvergesTo x a), M.CauchySeq x := _root_.GeneralTopology.MetricSpace.cauchySeq_of_convergesTo
preamble: |
  universe u v
  namespace GeneralTopology
  structure MetricSpace (X : Type u) where
    dist : X → X → ℝ
    dist_comm : ∀ {x y}, dist x y = dist y x
    dist_triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    dist_eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  def MetricSpace.ConvergesTo {X : Type u} (M : MetricSpace X) (x : ℕ → X) (a : X) : Prop :=
    ∀ ε > 0, ∃ k : ℕ, ∀ n ≥ k, M.dist a (x n) < ε

  def MetricSpace.CauchySeq {X : Type u} (M : MetricSpace X) (x : ℕ → X) : Prop :=
    ∀ ε > 0, ∃ k : ℕ, ∀ m ≥ k, ∀ n ≥ k, M.dist (x m) (x n) < ε

  end GeneralTopology
  open GeneralTopology
description: Prove `MetricSpace.cauchySeq_of_convergesTo`. Apply the convergence at `ε / 2` and offer the index it returns; `M.dist_comm` turns one of the two distances around before `M.dist_triangle (x m) a (x n)` and `linarith` finish.
