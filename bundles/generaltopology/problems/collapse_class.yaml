reference: |-
  theorem collapse_preimage_class {X : Type u} {A : Set X} {a : X} (ha : a ∈ A) :
      Quotient.mk (collapse A) ⁻¹' {Quotient.mk (collapse A) a} = A := by
    apply Set.Subset.antisymm
    · intro x hx
      rcases Quotient.exact hx with rfl | ⟨hxA, _⟩
      · exact ha
      · exact hxA
    · intro x hx
      exact Quotient.sound (Or.inr ⟨hx, ha⟩)
spec: 'example : ∀ {X : Type u} {A : Set X} {a : X} (ha : a ∈ A), Quotient.mk (collapse A) ⁻¹'' {Quotient.mk (collapse A) a} = A := _root_.GeneralTopology.collapse_preimage_class'
preamble: |
  universe u v w
  namespace GeneralTopology
  def collapse {X : Type u} (A : Set X) : Setoid X where
    r := fun x y => x = y ∨ (x ∈ A ∧ y ∈ A)
    iseqv := ⟨fun _ => Or.inl rfl, by
        rintro x y (rfl | ⟨hx, hy⟩)
        · exact Or.inl rfl
        · exact Or.inr ⟨hy, hx⟩, by
        rintro x y z (rfl | ⟨hx, hy⟩) (rfl | ⟨hy', hz⟩)
        · exact Or.inl rfl
        · exact Or.inr ⟨hy', hz⟩
        · exact Or.inr ⟨hx, hy⟩
        · exact Or.inr ⟨hx, hz⟩⟩

  end GeneralTopology
  open GeneralTopology
description: Prove that `Quotient.mk (collapse A) ⁻¹' {Quotient.mk (collapse A) a} = A` when `a ∈ A`. `Set.Subset.antisymm` splits it. A membership in a singleton is an equation of classes, which `Quotient.exact` turns into the relation and `Quotient.sound` turns back.
