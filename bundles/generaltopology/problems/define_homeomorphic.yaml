reference: |-
  def Homeomorphic {X : Type u} {Y : Type v} (T : TopologicalSpace X) (T' : TopologicalSpace Y) : Prop
      :=
    Nonempty (Homeomorph T T')

  theorem Homeomorphic.refl {X : Type u} (T : TopologicalSpace X) : Homeomorphic T T :=
    ⟨Homeomorph.refl T⟩

  theorem Homeomorphic.symm {X : Type u} {Y : Type v} {T : TopologicalSpace X}
      {T' : TopologicalSpace Y}
      (h : Homeomorphic T T') : Homeomorphic T' T := by
    obtain ⟨e⟩ := h
    exact ⟨e.symm⟩

  theorem Homeomorphic.trans {X : Type u} {Y : Type v} {Z : Type w} {T : TopologicalSpace X}
      {T' : TopologicalSpace Y} {T'' : TopologicalSpace Z} (h : Homeomorphic T T')
        (h' : Homeomorphic T' T'') :
      Homeomorphic T T'' := by
    obtain ⟨e⟩ := h
    obtain ⟨e'⟩ := h'
    exact ⟨e.trans e'⟩
spec: |-
  example : ∀ {X : Type u} (T : TopologicalSpace X), _root_.GeneralTopology.Homeomorphic T T := _root_.GeneralTopology.Homeomorphic.refl
  example : ∀ {X : Type u} {Y : Type v} {T : TopologicalSpace X}
      {T' : TopologicalSpace Y}
      (h : _root_.GeneralTopology.Homeomorphic T T'), _root_.GeneralTopology.Homeomorphic T' T := _root_.GeneralTopology.Homeomorphic.symm
  example : ∀ {X : Type u} {Y : Type v} {Z : Type w} {T : TopologicalSpace X}
      {T' : TopologicalSpace Y} {T'' : TopologicalSpace Z} (h : _root_.GeneralTopology.Homeomorphic T T')
        (h' : _root_.GeneralTopology.Homeomorphic T' T''), _root_.GeneralTopology.Homeomorphic T T'' := _root_.GeneralTopology.Homeomorphic.trans
  example (X Y : Type) (T : TopologicalSpace X) (T' : TopologicalSpace Y) :
      _root_.GeneralTopology.Homeomorphic T T' ↔ Nonempty (Homeomorph T T') := Iff.rfl
preamble: |
  universe u v w
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.Continuous {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      (f : X → Y) : Prop :=
    ∀ U, T'.IsOpen U → T.IsOpen (f ⁻¹' U)

  theorem TopologicalSpace.continuous_id {X : Type u} (T : TopologicalSpace X) : T.Continuous T id
      := by
    intro U hU
    rw [Set.preimage_id]
    exact hU

  theorem TopologicalSpace.continuous_comp {X : Type u} {Y : Type v} {Z : Type w}
      (T : TopologicalSpace X)
      {T' : TopologicalSpace Y} {T'' : TopologicalSpace Z} {f : X → Y} {g : Y → Z}
      (hf : T.Continuous T' f) (hg : T'.Continuous T'' g) : T.Continuous T'' (g ∘ f) := by
    intro U hU
    rw [Set.preimage_comp]
    exact hf _ (hg U hU)

  structure Homeomorph {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y) where
    toFun : X → Y
    invFun : Y → X
    left_inv : ∀ x, invFun (toFun x) = x
    right_inv : ∀ y, toFun (invFun y) = y
    continuous_toFun : T.Continuous T' toFun
    continuous_invFun : T'.Continuous T invFun

  def Homeomorph.refl {X : Type u} (T : TopologicalSpace X) : Homeomorph T T where
    toFun := id
    invFun := id
    left_inv := fun _ => rfl
    right_inv := fun _ => rfl
    continuous_toFun := TopologicalSpace.continuous_id T
    continuous_invFun := TopologicalSpace.continuous_id T

  def Homeomorph.symm {X : Type u} {Y : Type v} {T : TopologicalSpace X} {T' : TopologicalSpace Y}
      (h : Homeomorph T T') : Homeomorph T' T where
    toFun := h.invFun
    invFun := h.toFun
    left_inv := h.right_inv
    right_inv := h.left_inv
    continuous_toFun := h.continuous_invFun
    continuous_invFun := h.continuous_toFun

  def Homeomorph.trans {X : Type u} {Y : Type v} {Z : Type w} {T : TopologicalSpace X}
      {T' : TopologicalSpace Y} {T'' : TopologicalSpace Z} (h : Homeomorph T T')
        (h' : Homeomorph T' T'') :
      Homeomorph T T'' where
    toFun := h'.toFun ∘ h.toFun
    invFun := h.invFun ∘ h'.invFun
    left_inv := fun x => by
      show h.invFun (h'.invFun (h'.toFun (h.toFun x))) = x
      rw [h'.left_inv, h.left_inv]
    right_inv := fun z => by
      show h'.toFun (h.toFun (h.invFun (h'.invFun z))) = z
      rw [h.right_inv, h'.right_inv]
    continuous_toFun := TopologicalSpace.continuous_comp T h.continuous_toFun h'.continuous_toFun
    continuous_invFun := TopologicalSpace.continuous_comp T'' h'.continuous_invFun h.continuous_invFun

  end GeneralTopology
  open GeneralTopology
description: 'Define `Homeomorphic T T''` as `Nonempty (Homeomorph T T'')`, and prove the three properties. Each is one line: take the homeomorphisms out of the hypotheses with `obtain`, build the new one with `Homeomorph.refl`, `.symm` or `.trans`, and wrap it in `⟨_⟩`.'
