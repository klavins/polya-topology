reference: |-
  theorem image_eq_preimage_of_inverse {X : Type u} {Y : Type v} {f : X → Y} {g : Y → X}
      (hgf : ∀ x, g (f x) = x) (hfg : ∀ y, f (g y) = y) (U : Set X) : f '' U = g ⁻¹' U := by
    apply Set.ext
    intro y
    constructor
    · rintro ⟨x, hx, rfl⟩
      show g (f x) ∈ U
      rw [hgf]
      exact hx
    · intro hy
      exact ⟨g y, hy, hfg y⟩

  theorem Homeomorph.image_eq_preimage {X : Type u} {Y : Type v} {T : TopologicalSpace X}
      {T' : TopologicalSpace Y} (h : Homeomorph T T') (U : Set X) : h.toFun '' U = h.invFun ⁻¹' U :=
    image_eq_preimage_of_inverse h.left_inv h.right_inv U
spec: |-
  example : ∀ {X : Type u} {Y : Type v} {f : X → Y} {g : Y → X}
      (hgf : ∀ x, g (f x) = x) (hfg : ∀ y, f (g y) = y) (U : Set X), f '' U = g ⁻¹' U := _root_.GeneralTopology.image_eq_preimage_of_inverse
  example : ∀ {X : Type u} {Y : Type v} {T : TopologicalSpace X}
      {T' : TopologicalSpace Y} (h : Homeomorph T T') (U : Set X), h.toFun '' U = h.invFun ⁻¹' U := _root_.GeneralTopology.Homeomorph.image_eq_preimage
preamble: |
  universe u v w
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.Continuous {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      (f : X → Y) : Prop :=
    ∀ U, T'.IsOpen U → T.IsOpen (f ⁻¹' U)

  structure Homeomorph {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y) where
    toFun : X → Y
    invFun : Y → X
    left_inv : ∀ x, invFun (toFun x) = x
    right_inv : ∀ y, toFun (invFun y) = y
    continuous_toFun : T.Continuous T' toFun
    continuous_invFun : T'.Continuous T invFun

  end GeneralTopology
  open GeneralTopology
description: Prove `image_eq_preimage_of_inverse`, for maps `f` and `g` whose composites in both orders are the identity, and then read off `Homeomorph.image_eq_preimage`. In the first, `Set.ext` reduces to a membership at each point; `show` restates each side as what it abbreviates before rewriting.
