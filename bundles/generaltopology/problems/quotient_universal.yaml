preamble: |
  universe u v w
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.Continuous {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      (f : X → Y) : Prop :=
    ∀ U, T'.IsOpen U → T.IsOpen (f ⁻¹' U)

  theorem TopologicalSpace.continuous_comp {X : Type u} {Y : Type v} {Z : Type w}
      (T : TopologicalSpace X)
      {T' : TopologicalSpace Y} {T'' : TopologicalSpace Z} {f : X → Y} {g : Y → Z}
      (hf : T.Continuous T' f) (hg : T'.Continuous T'' g) : T.Continuous T'' (g ∘ f) := by
    intro U hU
    rw [Set.preimage_comp]
    exact hf _ (hg U hU)

  theorem preimage_sUnion_image {X : Type u} {Y : Type v} (f : X → Y) (F : Set (Set Y)) :
      f ⁻¹' (⋃₀ F) = ⋃₀ (Set.preimage f '' F) := by
    apply Set.Subset.antisymm
    · rintro x ⟨V, hVF, hxV⟩
      exact ⟨f ⁻¹' V, ⟨V, hVF, rfl⟩, hxV⟩
    · rintro x ⟨W, ⟨V, hVF, rfl⟩, hxW⟩
      exact ⟨V, hVF, hxW⟩

  def TopologicalSpace.coinduced {X : Type u} {Y : Type v} (T : TopologicalSpace X) (f : X → Y)
      : TopologicalSpace Y where
    IsOpen := fun V => T.IsOpen (f ⁻¹' V)
    isOpen_univ := by
      rw [Set.preimage_univ]
      exact T.isOpen_univ
    isOpen_inter := by
      intro V W hV hW
      rw [Set.preimage_inter]
      exact T.isOpen_inter hV hW
    isOpen_sUnion := by
      intro F h
      rw [preimage_sUnion_image]
      refine T.isOpen_sUnion ?_
      rintro W ⟨V, hVF, rfl⟩
      exact h V hVF

  theorem TopologicalSpace.continuous_coinduced {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (f : X → Y) :
      T.Continuous (T.coinduced f) f :=
    fun _ hV => hV

  theorem TopologicalSpace.continuous_out_of_coinduced {X : Type u} {Y : Type v} {Z : Type w}
      (T : TopologicalSpace X) (f : X → Y) (S : TopologicalSpace Z) (g : Y → Z) :
      (T.coinduced f).Continuous S g ↔ T.Continuous S (g ∘ f) := by
    constructor
    · intro hg
      exact TopologicalSpace.continuous_comp T (TopologicalSpace.continuous_coinduced T f) hg
    · intro hg W hW
      show T.IsOpen (f ⁻¹' (g ⁻¹' W))
      rw [← Set.preimage_comp]
      exact hg W hW

  def TopologicalSpace.quotient {X : Type u} (T : TopologicalSpace X) (s : Setoid X)
      : TopologicalSpace (Quotient s) :=
    T.coinduced (Quotient.mk s)

  end GeneralTopology
  open GeneralTopology
description: Show that `Quotient.lift f h` is continuous from `T.quotient s` whenever `f` is. Apply the `.mpr` of the coinduced universal property, at the map `Quotient.mk s` and the map `Quotient.lift f h`; the composite is `f` by definition, so the hypothesis closes it.
