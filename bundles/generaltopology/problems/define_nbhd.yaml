slug: define_nbhd
kind: example
title: The Definition of a Neighbourhood
statement: A set `N` is a *neighbourhood* of a point `x` when some open set `U` has `x ∈ U ⊆ N`. A neighbourhood need not itself be open — it must only contain an open set around the point — and an open set is a neighbourhood of each of its own points, itself being the `U` required. Mathlib gathers the neighbourhoods of `x` into a filter `𝓝 x` and writes this `N ∈ 𝓝 x`; filters are outside this fence, so we carry the predicate instead.
concepts:
- neighbourhoods
stub: |-
  def TopologicalSpace.IsNbhd {X : Type u} (T : TopologicalSpace X) (x : X) (N : Set X) : Prop := sorry

  theorem TopologicalSpace.nbhd_of_isOpen {X : Type u} (T : TopologicalSpace X) {U : Set X}
      (hU : T.IsOpen U) {x : X} (hx : x ∈ U) : T.IsNbhd x U := sorry
reference: |-
  def TopologicalSpace.IsNbhd {X : Type u} (T : TopologicalSpace X) (x : X) (N : Set X) : Prop :=
    ∃ U, T.IsOpen U ∧ x ∈ U ∧ U ⊆ N

  theorem TopologicalSpace.nbhd_of_isOpen {X : Type u} (T : TopologicalSpace X) {U : Set X}
      (hU : T.IsOpen U) {x : X} (hx : x ∈ U) : T.IsNbhd x U :=
    ⟨U, hU, hx, subset_rfl⟩
spec: |-
  example {X : Type u} (T : TopologicalSpace X) (x : X) (N : Set X) : _root_.GeneralTopology.TopologicalSpace.IsNbhd T x N ↔ (∃ U, T.IsOpen U ∧ x ∈ U ∧ U ⊆ N) := by unfold _root_.GeneralTopology.TopologicalSpace.IsNbhd; first | exact Iff.rfl | grind
  example : ∀ {X : Type u} (T : TopologicalSpace X) {U : Set X}
      (hU : T.IsOpen U) {x : X} (hx : x ∈ U), T.IsNbhd x U := _root_.GeneralTopology.TopologicalSpace.nbhd_of_isOpen
  example (X : Type) (T : TopologicalSpace X) (x : X) (N : Set X) :
      T.IsNbhd x N ↔ ∃ U, T.IsOpen U ∧ x ∈ U ∧ U ⊆ N := Iff.rfl
preamble: |
  universe u
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  end GeneralTopology
  open GeneralTopology
description: Define `TopologicalSpace.IsNbhd`, and then show that an open set is a neighbourhood of any of its points. The witness for the second is the set itself, with `subset_rfl` for the containment.
