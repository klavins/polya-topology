description: Define `IsSaturated f S` as the equation above, in that order, and prove that `f ⁻¹' V` is saturated for every `V`. `Set.Subset.antisymm` splits the equality; the first containment offers the point itself, and the second rewrites backwards along the equation of images the membership carries.
