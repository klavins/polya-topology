reference: |-
  def IsSaturated {X : Type u} {Y : Type v} (f : X → Y) (S : Set X) : Prop :=
    S = f ⁻¹' (f '' S)

  theorem isSaturated_preimage {X : Type u} {Y : Type v} (f : X → Y) (V : Set Y) :
      IsSaturated f (f ⁻¹' V) := by
    apply Set.Subset.antisymm
    · intro x hx
      exact ⟨x, hx, rfl⟩
    · rintro x ⟨y, hy, hxy⟩
      show f x ∈ V
      rw [← hxy]
      exact hy
spec: |-
  example {X : Type u} {Y : Type v} (f : X → Y) (S : Set X) : _root_.GeneralTopology.IsSaturated f S ↔ (S = f ⁻¹' (f '' S)) := by unfold _root_.GeneralTopology.IsSaturated; first | exact Iff.rfl | grind
  example : ∀ {X : Type u} {Y : Type v} (f : X → Y) (V : Set Y), _root_.GeneralTopology.IsSaturated f (f ⁻¹' V) := _root_.GeneralTopology.isSaturated_preimage
preamble: |
