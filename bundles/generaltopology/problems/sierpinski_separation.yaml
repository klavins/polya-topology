stub: |-
  theorem sierpinski_isT0 : sierpinski.IsT0 := sorry

  theorem sierpinski_not_isT1 : ¬ sierpinski.IsT1 := sorry
reference: |-
  theorem sierpinski_isT0 : sierpinski.IsT0 := by
    intro x y hxy
    cases x <;> cases y
    · exact absurd rfl hxy
    · exact Or.inr ⟨{true}, fun _ => rfl, rfl, by simp⟩
    · exact Or.inl ⟨{true}, fun _ => rfl, rfl, by simp⟩
    · exact absurd rfl hxy

  theorem sierpinski_not_isT1 : ¬ sierpinski.IsT1 := by
    intro h
    obtain ⟨U, hU, hfU, htU⟩ := h false true (by simp)
    exact htU (hU hfU)
spec: |-
  example : sierpinski.IsT0 := _root_.GeneralTopology.sierpinski_isT0
  example : ¬ sierpinski.IsT1 := _root_.GeneralTopology.sierpinski_not_isT1
preamble: |
  universe u v
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def sierpinski : TopologicalSpace Bool where
    IsOpen := fun U => false ∈ U → true ∈ U
    isOpen_univ := fun _ => trivial
    isOpen_inter := fun hU hV h => ⟨hU h.1, hV h.2⟩
    isOpen_sUnion := by
      intro F h hf
      obtain ⟨U, hUF, hU⟩ := hf
      exact ⟨U, hUF, h U hUF hU⟩

  def TopologicalSpace.IsT0 {X : Type u} (T : TopologicalSpace X) : Prop :=
    ∀ x y : X, x ≠ y →
      (∃ U, T.IsOpen U ∧ x ∈ U ∧ y ∉ U) ∨ (∃ V, T.IsOpen V ∧ y ∈ V ∧ x ∉ V)

  def TopologicalSpace.IsT1 {X : Type u} (T : TopologicalSpace X) : Prop :=
    ∀ x y : X, x ≠ y → ∃ U, T.IsOpen U ∧ x ∈ U ∧ y ∉ U

  end GeneralTopology
  open GeneralTopology
description: Prove `sierpinski_isT0` and `sierpinski_not_isT1`. For the first, `cases x <;> cases y` leaves four goals, two of which `x ≠ y` refutes; the openness of `{true}` is an implication whose hypothesis is not needed. For the second, apply the assumption at `false` and `true` and then apply the openness of the set it returns.
