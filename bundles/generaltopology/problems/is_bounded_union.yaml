reference: |-
  theorem MetricSpace.isBounded_union {X : Type u} (M : MetricSpace X) (S T : Set X)
      (hS : M.IsBounded S) (hT : M.IsBounded T) : M.IsBounded (S ∪ T) := by
    obtain ⟨x, ε, hx⟩ := hS
    obtain ⟨y, δ, hy⟩ := hT
    refine ⟨x, max ε (M.dist x y + δ), ?_⟩
    rintro z (hz | hz)
    · exact M.ball_mono (le_max_left _ _) (hx hz)
    · exact M.ball_mono (le_max_right _ _) (M.ball_subset_ball x y δ (hy hz))
spec: |-
  example : ∀ {X : Type u} (M : MetricSpace X) (S T : Set X)
      (hS : M.IsBounded S) (hT : M.IsBounded T), M.IsBounded (S ∪ T) := _root_.GeneralTopology.MetricSpace.isBounded_union
preamble: |
  universe u
  namespace GeneralTopology
  structure MetricSpace (X : Type u) where
    dist : X → X → ℝ
    dist_comm : ∀ {x y}, dist x y = dist y x
    dist_triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    dist_eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  def MetricSpace.ball {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) : Set X :=
    {y | M.dist x y < ε}

  theorem MetricSpace.mem_ball {X : Type u} (M : MetricSpace X) {x y : X} {ε : ℝ} :
      y ∈ M.ball x ε ↔ M.dist x y < ε := Iff.rfl

  theorem MetricSpace.ball_mono {X : Type u} (M : MetricSpace X) {x : X} {ε δ : ℝ} (h : ε ≤ δ) :
      M.ball x ε ⊆ M.ball x δ :=
    fun _ hy => lt_of_lt_of_le hy h

  theorem MetricSpace.ball_subset_ball {X : Type u} (M : MetricSpace X) (x y : X) (ε : ℝ) :
      M.ball y ε ⊆ M.ball x (M.dist x y + ε) := by
    intro z hz
    rw [M.mem_ball] at hz ⊢
    have h := M.dist_triangle x y z
    linarith

  def MetricSpace.IsBounded {X : Type u} (M : MetricSpace X) (S : Set X) : Prop :=
    ∃ (x : X) (ε : ℝ), S ⊆ M.ball x ε

  end GeneralTopology
  open GeneralTopology
description: Show that `M.IsBounded (S ∪ T)`. Take both hypotheses apart, offer `x` as the centre and `max ε (M.dist x y + δ)` as the radius, and use `rintro z (hz | hz)` to split on which of the two sets a point of the union came from. `MetricSpace.ball_mono` with `le_max_left` handles the first case, and the same with `le_max_right` handles the second once `MetricSpace.ball_subset_ball` has moved the centre.
