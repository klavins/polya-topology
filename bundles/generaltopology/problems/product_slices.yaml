slug: product_slices
kind: example
title: The Slices of a Product
statement: 'Fixing one coordinate lays a factor along the product: `fun x => (x, y)` puts `X` at the level `y`. Such a map is continuous, and the universal property proves it without the definition of the product topology being touched at all — the two components are the identity and a constant, and both were shown continuous in an earlier section.'
