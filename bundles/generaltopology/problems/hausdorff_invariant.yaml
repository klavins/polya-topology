reference: |-
  theorem Homeomorphic.isT2 {X : Type u} {Y : Type v} {T : TopologicalSpace X}
      {T' : TopologicalSpace Y}
      (h : Homeomorphic T T') (hT : T.IsT2) : T'.IsT2 := by
    obtain ⟨e⟩ := h
    intro x y hxy
    obtain ⟨U, V, hU, hV, hxU, hyV, hUV⟩ := hT (e.invFun x) (e.invFun y)
      (fun he => hxy (by rw [← e.right_inv x, ← e.right_inv y, he]))
    refine ⟨e.invFun ⁻¹' U, e.invFun ⁻¹' V, e.continuous_invFun U hU, e.continuous_invFun V hV,
      hxU, hyV, ?_⟩
    rw [← Set.preimage_inter, hUV, Set.preimage_empty]
spec: |-
  example : ∀ {X : Type u} {Y : Type v} {T : TopologicalSpace X}
      {T' : TopologicalSpace Y}
      (h : Homeomorphic T T') (hT : T.IsT2), T'.IsT2 := _root_.GeneralTopology.Homeomorphic.isT2
preamble: |
  universe u v w
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.Continuous {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      (f : X → Y) : Prop :=
    ∀ U, T'.IsOpen U → T.IsOpen (f ⁻¹' U)

  structure Homeomorph {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y) where
    toFun : X → Y
    invFun : Y → X
    left_inv : ∀ x, invFun (toFun x) = x
    right_inv : ∀ y, toFun (invFun y) = y
    continuous_toFun : T.Continuous T' toFun
    continuous_invFun : T'.Continuous T invFun

  def Homeomorphic {X : Type u} {Y : Type v} (T : TopologicalSpace X) (T' : TopologicalSpace Y) : Prop
      :=
    Nonempty (Homeomorph T T')

  def TopologicalSpace.IsT2 {X : Type u} (T : TopologicalSpace X) : Prop :=
    ∀ x y : X, x ≠ y → ∃ U V, T.IsOpen U ∧ T.IsOpen V ∧ x ∈ U ∧ y ∈ V ∧ U ∩ V = ∅

  end GeneralTopology
  open GeneralTopology
description: Show that `T'.IsT2` when `Homeomorphic T T'` and `T.IsT2`. Take the homeomorphism out of the hypothesis with `obtain ⟨e⟩`. The two open sets are `e.invFun ⁻¹' U` and `e.invFun ⁻¹' V`, open by `e.continuous_invFun`; `e.right_inv` is what shows the two pulled-back points distinct.
