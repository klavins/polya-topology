slug: is_open_iff_interior_eq
kind: theorem
title: A Set is Open Exactly When it is its Own Interior
statement: |-
  The mirror of the closure's equivalence, and one direction of it is already proved. The last section showed that a set which is a neighbourhood of each of its points is the union of the open sets inside it — which is to say, its own interior. An open set is such a set.

  The converse is the easier half: if `S` equals its interior then `S` is open, the interior being open whatever `S` is.
concepts:
- interior_boundary
stub: |-
  theorem TopologicalSpace.isOpen_iff_interior_eq {X : Type u} (T : TopologicalSpace X) (S : Set X) :
      T.IsOpen S ↔ T.interior S = S := sorry
reference: |-
  theorem TopologicalSpace.isOpen_iff_interior_eq {X : Type u} (T : TopologicalSpace X) (S : Set X) :
      T.IsOpen S ↔ T.interior S = S := by
    constructor
    · intro hS
      exact (T.union_of_opens_inside S ((T.isOpen_iff_nbhd S).mp hS)).symm
    · intro h
      rw [← h]
      exact T.isOpen_interior S
spec: 'example : ∀ {X : Type u} (T : TopologicalSpace X) (S : Set X), T.IsOpen S ↔ T.interior S = S := _root_.GeneralTopology.TopologicalSpace.isOpen_iff_interior_eq'
preamble: |
  universe u
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.IsNbhd {X : Type u} (T : TopologicalSpace X) (x : X) (N : Set X) : Prop :=
    ∃ U, T.IsOpen U ∧ x ∈ U ∧ U ⊆ N

  theorem TopologicalSpace.nbhd_of_isOpen {X : Type u} (T : TopologicalSpace X) {U : Set X}
      (hU : T.IsOpen U) {x : X} (hx : x ∈ U) : T.IsNbhd x U :=
    ⟨U, hU, hx, subset_rfl⟩

  theorem TopologicalSpace.union_of_opens_inside {X : Type u} (T : TopologicalSpace X) (U : Set X)
      (h : ∀ x ∈ U, T.IsNbhd x U) : U = ⋃₀ {V | T.IsOpen V ∧ V ⊆ U} := by
    apply Set.Subset.antisymm
    · intro x hx
      obtain ⟨V, hV, hxV, hVU⟩ := h x hx
      exact ⟨V, ⟨hV, hVU⟩, hxV⟩
    · rintro x ⟨V, ⟨_, hVU⟩, hxV⟩
      exact hVU hxV

  theorem TopologicalSpace.isOpen_iff_nbhd {X : Type u} (T : TopologicalSpace X) (U : Set X) :
      T.IsOpen U ↔ ∀ x ∈ U, T.IsNbhd x U := by
    constructor
    · intro hU x hx
      exact T.nbhd_of_isOpen hU hx
    · intro h
      rw [T.union_of_opens_inside U h]
      exact T.isOpen_sUnion (fun V hV => hV.1)

  def TopologicalSpace.interior {X : Type u} (T : TopologicalSpace X) (S : Set X) : Set X :=
    ⋃₀ {U | T.IsOpen U ∧ U ⊆ S}

  theorem TopologicalSpace.isOpen_interior {X : Type u} (T : TopologicalSpace X) (S : Set X) :
      T.IsOpen (T.interior S) :=
    T.isOpen_sUnion (fun _ hU => hU.1)

  end GeneralTopology
  open GeneralTopology
description: Prove that `T.IsOpen S` exactly when `T.interior S = S`. For the forward direction, `T.isOpen_iff_nbhd` turns openness into the hypothesis that `T.union_of_opens_inside` wants, and the equation it returns is this one reversed.
