reference: |-
  theorem Topology.isOpen_iff_interior_eq {X : Type u} (T : Topology X) (S : Set X) :
      T.IsOpen S ↔ T.interior S = S := by
    constructor
    · intro hS
      exact (T.union_of_opens_inside S ((T.isOpen_iff_nbhd S).mp hS)).symm
    · intro h
      rw [← h]
      exact T.isOpen_interior S
spec: 'example : ∀ {X : Type u} (T : Topology X) (S : Set X), T.IsOpen S ↔ T.interior S = S := _root_.GeneralTopology.Topology.isOpen_iff_interior_eq'
preamble: |
  universe u
  namespace GeneralTopology
  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def Topology.IsNbhd {X : Type u} (T : Topology X) (x : X) (N : Set X) : Prop :=
    ∃ U, T.IsOpen U ∧ x ∈ U ∧ U ⊆ N

  theorem Topology.nbhd_of_isOpen {X : Type u} (T : Topology X) {U : Set X}
      (hU : T.IsOpen U) {x : X} (hx : x ∈ U) : T.IsNbhd x U :=
    ⟨U, hU, hx, subset_rfl⟩

  theorem Topology.union_of_opens_inside {X : Type u} (T : Topology X) (U : Set X)
      (h : ∀ x ∈ U, T.IsNbhd x U) : U = ⋃₀ {V | T.IsOpen V ∧ V ⊆ U} := by
    apply Set.Subset.antisymm
    · intro x hx
      obtain ⟨V, hV, hxV, hVU⟩ := h x hx
      exact ⟨V, ⟨hV, hVU⟩, hxV⟩
    · rintro x ⟨V, ⟨_, hVU⟩, hxV⟩
      exact hVU hxV

  theorem Topology.isOpen_iff_nbhd {X : Type u} (T : Topology X) (U : Set X) :
      T.IsOpen U ↔ ∀ x ∈ U, T.IsNbhd x U := by
    constructor
    · intro hU x hx
      exact T.nbhd_of_isOpen hU hx
    · intro h
      rw [T.union_of_opens_inside U h]
      exact T.sUnion (fun V hV => hV.1)

  def Topology.interior {X : Type u} (T : Topology X) (S : Set X) : Set X :=
    ⋃₀ {U | T.IsOpen U ∧ U ⊆ S}

  theorem Topology.isOpen_interior {X : Type u} (T : Topology X) (S : Set X) :
      T.IsOpen (T.interior S) :=
    T.sUnion (fun _ hU => hU.1)

  end GeneralTopology
  open GeneralTopology
description: Prove that `T.IsOpen S` exactly when `T.interior S = S`. For the forward direction, `T.isOpen_iff_nbhd` turns openness into the hypothesis that `T.union_of_opens_inside` wants, and the equation it returns is this one reversed.
