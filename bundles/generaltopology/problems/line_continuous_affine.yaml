reference: |-
  theorem line_continuous_affine (a b : ℝ) (ha : a ≠ 0) :
      line.Continuous line (fun t => a * t + b) := by
    intro x ε hε
    have hpos : 0 < |a| := abs_pos.mpr ha
    refine ⟨ε / |a|, div_pos hε hpos, ?_⟩
    intro x' h
    have hx : |x - x'| < ε / |a| := h
    show |(a * x + b) - (a * x' + b)| < ε
    have e : (a * x + b) - (a * x' + b) = a * (x - x') := by ring
    rw [e, abs_mul]
    calc |a| * |x - x'| < |a| * (ε / |a|) := mul_lt_mul_of_pos_left hx hpos
      _ = ε := mul_div_cancel₀ ε (ne_of_gt hpos)
spec: 'example : ∀ (a b : ℝ) (ha : a ≠ 0), line.Continuous line (fun t => a * t + b) := _root_.GeneralTopology.line_continuous_affine'
preamble: |
  universe u v w
  namespace GeneralTopology
  structure MetricSpace (X : Type u) where
    dist : X → X → ℝ
    dist_comm : ∀ {x y}, dist x y = dist y x
    dist_triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    dist_eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  def line : MetricSpace ℝ where
    dist x y := |x - y|
    dist_comm {x y} := abs_sub_comm x y
    dist_triangle x y z := abs_sub_le x y z
    dist_eq_zero {x y} := by rw [abs_eq_zero, sub_eq_zero]

  def MetricSpace.ContinuousAt {X : Type u} {Y : Type v} (M : MetricSpace X) (N : MetricSpace Y)
      (f : X → Y)
      (x : X) : Prop :=
    ∀ ε > 0, ∃ δ > 0, ∀ x', M.dist x x' < δ → N.dist (f x) (f x') < ε

  def MetricSpace.Continuous {X : Type u} {Y : Type v} (M : MetricSpace X) (N : MetricSpace Y)
      (f : X → Y) : Prop :=
    ∀ x, M.ContinuousAt N f x

  end GeneralTopology
  open GeneralTopology
description: Show that `fun t => a * t + b` is continuous on the line when `a ≠ 0`. Offer `ε / |a|`, positive by `div_pos` and `abs_pos`; `show` restates the goal as the absolute value it is, `ring` names the difference, and `abs_mul` splits it. `mul_div_cancel₀` finishes the arithmetic.
