reference: |-
  def Metric.ball {X : Type u} (M : Metric X) (x : X) (ε : ℝ) : Set X :=
    {y | M.dist x y < ε}

  theorem Metric.mem_ball {X : Type u} (M : Metric X) {x y : X} {ε : ℝ} :
      y ∈ M.ball x ε ↔ M.dist x y < ε := Iff.rfl
spec: |-
  example {X : Type u} (M : Metric X) (x : X) (ε : ℝ) : _root_.GeneralTopology.Metric.ball M x ε = ({y | M.dist x y < ε} : Set X) := rfl
  example : ∀ {X : Type u} (M : Metric X) {x y : X} {ε : ℝ}, y ∈ M.ball x ε ↔ M.dist x y < ε := _root_.GeneralTopology.Metric.mem_ball
preamble: |
  universe u
  namespace GeneralTopology
  structure Metric (X : Type u) where
    dist : X → X → ℝ
    symm : ∀ {x y}, dist x y = dist y x
    triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  end GeneralTopology
  open GeneralTopology
description: Define `Metric.ball`, and then prove `Metric.mem_ball`, which says that `y` lies in `M.ball x ε` exactly when `M.dist x y < ε`. The two sides of that equivalence are the same proposition by definition, so `Iff.rfl` proves it.
