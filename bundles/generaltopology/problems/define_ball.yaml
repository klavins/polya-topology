reference: |-
  def MetricSpace.ball {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) : Set X :=
    {y | M.dist x y < ε}

  theorem MetricSpace.mem_ball {X : Type u} (M : MetricSpace X) {x y : X} {ε : ℝ} :
      y ∈ M.ball x ε ↔ M.dist x y < ε := Iff.rfl
spec: |-
  example {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) : _root_.GeneralTopology.MetricSpace.ball M x ε = ({y | M.dist x y < ε} : Set X) := rfl
  example : ∀ {X : Type u} (M : MetricSpace X) {x y : X} {ε : ℝ}, y ∈ M.ball x ε ↔ M.dist x y < ε := _root_.GeneralTopology.MetricSpace.mem_ball
preamble: |
  universe u
  namespace GeneralTopology
  structure MetricSpace (X : Type u) where
    dist : X → X → ℝ
    dist_comm : ∀ {x y}, dist x y = dist y x
    dist_triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    dist_eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  end GeneralTopology
  open GeneralTopology
description: Define `MetricSpace.ball`, and then prove `MetricSpace.mem_ball`, which says that `y` lies in `M.ball x ε` exactly when `M.dist x y < ε`. The two sides of that equivalence are the same proposition by definition, so `Iff.rfl` proves it.
