slug: separation_implications
kind: example
title: Each Axiom Implies the One Before
statement: |-
  The conditions grow stronger, so each implies its predecessor, and neither proof needs more than the definitions.

  T₁ gives T₀ by taking the left disjunct: the set it supplies around `x` is offered, and the other alternative is never reached.

  Hausdorff gives T₁ by forgetting `V`. The set `U` around `x` already leaves `y` out, because `y` lies in `V` and the two sets meet nowhere: a point in both would lie in `U ∩ V`, which is empty.
concepts:
- separation_axioms
stub: |-
  theorem Topology.isT0_of_isT1 {X : Type u} {T : Topology X} (h : T.IsT1) : T.IsT0 := sorry

  theorem Topology.isT1_of_isHausdorff {X : Type u} {T : Topology X} (h : T.IsHausdorff) :
      T.IsT1 := sorry
reference: |-
  theorem Topology.isT0_of_isT1 {X : Type u} {T : Topology X} (h : T.IsT1) : T.IsT0 :=
    fun x y hxy => Or.inl (h x y hxy)

  theorem Topology.isT1_of_isHausdorff {X : Type u} {T : Topology X} (h : T.IsHausdorff) :
      T.IsT1 := by
    intro x y hxy
    obtain ⟨U, V, hU, hV, hxU, hyV, hUV⟩ := h x y hxy
    refine ⟨U, hU, hxU, ?_⟩
    intro hyU
    have hy : y ∈ U ∩ V := ⟨hyU, hyV⟩
    rw [hUV] at hy
    exact hy
spec: |-
  example : ∀ {X : Type u} {T : Topology X} (h : T.IsT1), T.IsT0 := _root_.GeneralTopology.Topology.isT0_of_isT1
  example : ∀ {X : Type u} {T : Topology X} (h : T.IsHausdorff), T.IsT1 := _root_.GeneralTopology.Topology.isT1_of_isHausdorff
preamble: |
  universe u v
  namespace GeneralTopology
  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def Topology.IsT0 {X : Type u} (T : Topology X) : Prop :=
    ∀ x y : X, x ≠ y →
      (∃ U, T.IsOpen U ∧ x ∈ U ∧ y ∉ U) ∨ (∃ V, T.IsOpen V ∧ y ∈ V ∧ x ∉ V)

  def Topology.IsT1 {X : Type u} (T : Topology X) : Prop :=
    ∀ x y : X, x ≠ y → ∃ U, T.IsOpen U ∧ x ∈ U ∧ y ∉ U

  def Topology.IsHausdorff {X : Type u} (T : Topology X) : Prop :=
    ∀ x y : X, x ≠ y → ∃ U V, T.IsOpen U ∧ T.IsOpen V ∧ x ∈ U ∧ y ∈ V ∧ U ∩ V = ∅

  end GeneralTopology
  open GeneralTopology
description: Prove `Topology.isT0_of_isT1` and `Topology.isT1_of_isHausdorff`. For the second, assume `y ∈ U`, put `y` into `U ∩ V` with an anonymous constructor, rewrite by the hypothesis that this set is empty, and a membership in `∅` is absurd.
