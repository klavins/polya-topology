reference: |-
  def Homeomorph.ofOpenMap {X : Type u} {Y : Type v} {T : TopologicalSpace X}
      {T' : TopologicalSpace Y}
      {f : X → Y} {g : Y → X} (hf : T.Continuous T' f) (hopen : T.IsOpenMap T' f)
      (hgf : ∀ x, g (f x) = x) (hfg : ∀ y, f (g y) = y) : Homeomorph T T' where
    toFun := f
    invFun := g
    left_inv := hgf
    right_inv := hfg
    continuous_toFun := hf
    continuous_invFun := by
      intro U hU
      rw [← image_eq_preimage_of_inverse hgf hfg U]
      exact hopen U hU
spec: |-
  example (X Y : Type) (T : TopologicalSpace X) (T' : TopologicalSpace Y) (f : X → Y) (g : Y → X)
      (hf : T.Continuous T' f) (hopen : T.IsOpenMap T' f)
      (hgf : ∀ x, g (f x) = x) (hfg : ∀ y, f (g y) = y) (x : X) (y : Y) :
      (_root_.GeneralTopology.Homeomorph.ofOpenMap hf hopen hgf hfg).toFun x = f x
        ∧ (_root_.GeneralTopology.Homeomorph.ofOpenMap hf hopen hgf hfg).invFun y = g y := ⟨rfl, rfl⟩
preamble: |
  universe u v w
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.Continuous {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      (f : X → Y) : Prop :=
    ∀ U, T'.IsOpen U → T.IsOpen (f ⁻¹' U)

  structure Homeomorph {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y) where
    toFun : X → Y
    invFun : Y → X
    left_inv : ∀ x, invFun (toFun x) = x
    right_inv : ∀ y, toFun (invFun y) = y
    continuous_toFun : T.Continuous T' toFun
    continuous_invFun : T'.Continuous T invFun

  def TopologicalSpace.IsOpenMap {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      (f : X → Y) : Prop :=
    ∀ U, T.IsOpen U → T'.IsOpen (f '' U)

  theorem image_eq_preimage_of_inverse {X : Type u} {Y : Type v} {f : X → Y} {g : Y → X}
      (hgf : ∀ x, g (f x) = x) (hfg : ∀ y, f (g y) = y) (U : Set X) : f '' U = g ⁻¹' U := by
    apply Set.ext
    intro y
    constructor
    · rintro ⟨x, hx, rfl⟩
      show g (f x) ∈ U
      rw [hgf]
      exact hx
    · intro hy
      exact ⟨g y, hy, hfg y⟩

  end GeneralTopology
  open GeneralTopology
description: Define `Homeomorph.ofOpenMap`, building a homeomorphism from a continuous open map `f` and a two-sided inverse `g`. Four of the six fields are hypotheses already; for the last, rewrite the preimage backwards with `image_eq_preimage_of_inverse` and apply the open-map hypothesis.
