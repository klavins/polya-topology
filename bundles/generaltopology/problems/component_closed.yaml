preamble: |
  universe u v
  namespace GeneralTopology
  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def Topology.IsClosed {X : Type u} (T : Topology X) (C : Set X) : Prop := T.IsOpen Cᶜ

  theorem Topology.isClosed_sInter {X : Type u} (T : Topology X) {F : Set (Set X)}
      (h : ∀ C ∈ F, T.IsClosed C) : T.IsClosed (⋂₀ F) := by
    show T.IsOpen _
    rw [Set.compl_sInter]
    apply T.sUnion
    rintro U ⟨C, hCF, rfl⟩
    exact h C hCF

  def Topology.closure {X : Type u} (T : Topology X) (S : Set X) : Set X :=
    ⋂₀ {C | T.IsClosed C ∧ S ⊆ C}

  theorem Topology.subset_closure {X : Type u} (T : Topology X) (S : Set X) : S ⊆ T.closure S := by
    intro x hx C hC
    exact hC.2 hx

  theorem Topology.isClosed_closure {X : Type u} (T : Topology X) (S : Set X) :
      T.IsClosed (T.closure S) :=
    T.isClosed_sInter (fun _ hC => hC.1)

  theorem Topology.closure_min {X : Type u} (T : Topology X) {S C : Set X}
      (hC : T.IsClosed C) (hSC : S ⊆ C) : T.closure S ⊆ C := by
    intro x hx
    exact hx C ⟨hC, hSC⟩

  theorem Topology.isClosed_iff_closure_eq {X : Type u} (T : Topology X) (S : Set X) :
      T.IsClosed S ↔ T.closure S = S := by
    constructor
    · intro hS
      exact Set.Subset.antisymm (T.closure_min hS subset_rfl) (T.subset_closure S)
    · intro h
      rw [← h]
      exact T.isClosed_closure S

  def Topology.IsConnectedSet {X : Type u} (T : Topology X) (S : Set X) : Prop :=
    ∀ U V, T.IsOpen U → T.IsOpen V → (∀ x ∈ S, x ∈ U → x ∉ V) → S ⊆ U ∪ V → S ⊆ U ∨ S ⊆ V

  theorem Topology.isConnectedSet_singleton {X : Type u} (T : Topology X) (x : X) :
      T.IsConnectedSet {x} := by
    intro U V _ _ _ hcov
    have hx : x ∈ ({x} : Set X) := rfl
    rcases hcov hx with h | h
    · refine Or.inl fun y hy => ?_
      have e : y = x := hy
      rw [e]
      exact h
    · refine Or.inr fun y hy => ?_
      have e : y = x := hy
      rw [e]
      exact h

  theorem Topology.isConnectedSet_sUnion {X : Type u} (T : Topology X) {F : Set (Set X)} {p : X}
      (hp : ∀ S ∈ F, p ∈ S) (h : ∀ S ∈ F, T.IsConnectedSet S) : T.IsConnectedSet (⋃₀ F) := by
    intro U V hU hV hno hcov
    have key : ∀ S ∈ F, S ⊆ U ∨ S ⊆ V := fun S hSF => h S hSF U V hU hV
      (fun x hx => hno x ⟨S, hSF, hx⟩) (fun x hx => hcov ⟨S, hSF, hx⟩)
    by_cases hpU : p ∈ U
    · left
      rintro x ⟨S, hSF, hxS⟩
      rcases key S hSF with hs | hs
      · exact hs hxS
      · exact (hno p ⟨S, hSF, hp S hSF⟩ hpU (hs (hp S hSF))).elim
    · right
      rintro x ⟨S, hSF, hxS⟩
      rcases key S hSF with hs | hs
      · exact absurd (hs (hp S hSF)) hpU
      · exact hs hxS

  def Topology.component {X : Type u} (T : Topology X) (x : X) : Set X :=
    ⋃₀ {S | T.IsConnectedSet S ∧ x ∈ S}

  theorem Topology.mem_component {X : Type u} (T : Topology X) (x : X) : x ∈ T.component x :=
    ⟨{x}, ⟨Topology.isConnectedSet_singleton T x, rfl⟩, rfl⟩

  theorem Topology.isConnectedSet_component {X : Type u} (T : Topology X) (x : X) :
      T.IsConnectedSet (T.component x) :=
    Topology.isConnectedSet_sUnion T (fun _ hS => hS.2) (fun _ hS => hS.1)

  theorem Topology.subset_component {X : Type u} (T : Topology X) {S : Set X} {x : X}
      (hS : T.IsConnectedSet S) (hx : x ∈ S) : S ⊆ T.component x :=
    fun _ hy => ⟨S, ⟨hS, hx⟩, hy⟩

  end GeneralTopology
  open GeneralTopology
description: Prove `Topology.isConnectedSet_closure` and `Topology.isClosed_component`. `T.closure_min` wants the complement's closedness, which is `show T.IsOpen _` and then `rwa [compl_compl]`; `Or.resolve_right` turns the cover into a membership, and `T.isClosed_iff_closure_eq` reduces the second claim to two containments.
