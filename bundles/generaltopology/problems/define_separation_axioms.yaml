          (∃ U, T.IsOpen U ∧ x ∈ U ∧ y ∉ U) ∨ (∃ V, T.IsOpen V ∧ y ∈ V ∧ x ∉ V))
        ∧ (T.IsT1 ↔ ∀ x y : X, x ≠ y → ∃ U, T.IsOpen U ∧ x ∈ U ∧ y ∉ U)
        ∧ (T.IsHausdorff ↔ ∀ x y : X, x ≠ y →
          ∃ U V, T.IsOpen U ∧ T.IsOpen V ∧ x ∈ U ∧ y ∈ V ∧ U ∩ V = ∅) :=
    ⟨Iff.rfl, Iff.rfl, Iff.rfl⟩
preamble: |
  universe u v
  namespace GeneralTopology
  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  end GeneralTopology
  open GeneralTopology
description: 'Define `Topology.IsT0`, `Topology.IsT1` and `Topology.IsHausdorff`, each quantified over `x y : X` with `x ≠ y`. Write T₁ as `∃ U, T.IsOpen U ∧ x ∈ U ∧ y ∉ U`; T₀ as that disjunct or the same with the two points exchanged; and Hausdorff as `∃ U V` with the five conditions `T.IsOpen U`, `T.IsOpen V`, `x ∈ U`, `y ∈ V`, `U ∩ V = ∅`, in that order.'
