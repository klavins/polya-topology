  example {X : Type u} (T : Topology X) : _root_.GeneralTopology.Topology.IsT1 T ↔ (∀ x y : X, x ≠ y → ∃ U, T.IsOpen U ∧ x ∈ U ∧ y ∉ U) := by unfold _root_.GeneralTopology.Topology.IsT1; first | exact Iff.rfl | grind
  example {X : Type u} (T : Topology X) : _root_.GeneralTopology.Topology.IsHausdorff T ↔ (∀ x y : X, x ≠ y → ∃ U V, T.IsOpen U ∧ T.IsOpen V ∧ x ∈ U ∧ y ∈ V ∧ U ∩ V = ∅) := by unfold _root_.GeneralTopology.Topology.IsHausdorff; first | exact Iff.rfl | grind
  example (X : Type) (T : Topology X) :
