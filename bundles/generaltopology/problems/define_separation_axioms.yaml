  example {X : Type u} (T : TopologicalSpace X) : _root_.GeneralTopology.TopologicalSpace.IsT2 T ↔ (∀ x y : X, x ≠ y → ∃ U V, T.IsOpen U ∧ T.IsOpen V ∧ x ∈ U ∧ y ∈ V ∧ U ∩ V = ∅) := by unfold _root_.GeneralTopology.TopologicalSpace.IsT2; first | exact Iff.rfl | grind
