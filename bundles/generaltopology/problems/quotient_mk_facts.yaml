description: 'Prove that every `q : Quotient s` is `Quotient.mk s x` for some `x`, and that `Quotient.mk s x = Quotient.mk s y` exactly when `s.r x y`. For the first, apply `Quotient.inductionOn` to `q` and offer the point with `rfl`; the second is the two named theorems as the halves of an anonymous constructor.'
