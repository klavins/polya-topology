  example : ∀ {X : Type u} (s : Setoid X) (q : Quotient s), ∃ x, Quotient.mk s x = q := _root_.GeneralTopology.quotient_mk_surjective
  example : ∀ {X : Type u} (s : Setoid X) (x y : X), Quotient.mk s x = Quotient.mk s y ↔ s.r x y := _root_.GeneralTopology.quotient_mk_eq_iff
