reference: |-
  def Topology.component {X : Type u} (T : Topology X) (x : X) : Set X :=
    ⋃₀ {S | T.IsConnectedSet S ∧ x ∈ S}

  theorem Topology.mem_component {X : Type u} (T : Topology X) (x : X) : x ∈ T.component x :=
    ⟨{x}, ⟨Topology.isConnectedSet_singleton T x, rfl⟩, rfl⟩
spec: |-
  example {X : Type u} (T : Topology X) (x : X) : _root_.GeneralTopology.Topology.component T x = (⋃₀ {S | T.IsConnectedSet S ∧ x ∈ S} : Set X) := rfl
  example : ∀ {X : Type u} (T : Topology X) (x : X), x ∈ T.component x := _root_.GeneralTopology.Topology.mem_component
  example (X : Type) (T : Topology X) (x y : X) :
      y ∈ T.component x ↔ ∃ S, (T.IsConnectedSet S ∧ x ∈ S) ∧ y ∈ S := Iff.rfl
preamble: |
  universe u v
  namespace GeneralTopology
  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def Topology.IsConnectedSet {X : Type u} (T : Topology X) (S : Set X) : Prop :=
    ∀ U V, T.IsOpen U → T.IsOpen V → (∀ x ∈ S, x ∈ U → x ∉ V) → S ⊆ U ∪ V → S ⊆ U ∨ S ⊆ V

  theorem Topology.isConnectedSet_singleton {X : Type u} (T : Topology X) (x : X) :
      T.IsConnectedSet {x} := by
    intro U V _ _ _ hcov
    have hx : x ∈ ({x} : Set X) := rfl
    rcases hcov hx with h | h
    · refine Or.inl fun y hy => ?_
      have e : y = x := hy
      rw [e]
      exact h
    · refine Or.inr fun y hy => ?_
      have e : y = x := hy
      rw [e]
      exact h

  end GeneralTopology
  open GeneralTopology
description: Define `Topology.component`, the union `⋃₀ {S | T.IsConnectedSet S ∧ x ∈ S}`, and prove `Topology.mem_component`. The witness for the second is the singleton, whose connectedness is the previous problem and whose two memberships are `rfl`.
