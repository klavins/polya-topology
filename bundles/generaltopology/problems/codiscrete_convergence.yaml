reference: |-
  theorem indiscrete_convergesTo {X : Type u} (x : ℕ → X) (a : X) :
      (indiscrete X).ConvergesTo x a := by
    rintro N ⟨U, hU, haU, hUN⟩
    refine ⟨0, fun n _ => hUN ?_⟩
    rcases hU with h | h
    · rw [h] at haU
      exact absurd haU (Set.notMem_empty a)
    · rw [h]
      trivial
spec: 'example : ∀ {X : Type u} (x : ℕ → X) (a : X), (indiscrete X).ConvergesTo x a := _root_.GeneralTopology.indiscrete_convergesTo'
preamble: |
  universe u v
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.IsNbhd {X : Type u} (T : TopologicalSpace X) (x : X) (N : Set X) : Prop :=
    ∃ U, T.IsOpen U ∧ x ∈ U ∧ U ⊆ N

  theorem trivial_inter {X : Type u} {U V : Set X} (hU : U = ∅ ∨ U = Set.univ)
      (hV : V = ∅ ∨ V = Set.univ) : U ∩ V = ∅ ∨ U ∩ V = Set.univ := by
    rcases hU with rfl | rfl
    · left; exact Set.empty_inter V
    · rcases hV with rfl | rfl
      · left; exact Set.inter_empty _
      · right; exact Set.inter_self _

  theorem trivial_sUnion {X : Type u} {F : Set (Set X)}
      (h : ∀ U ∈ F, U = ∅ ∨ U = Set.univ) : ⋃₀ F = ∅ ∨ ⋃₀ F = Set.univ := by
    by_cases hu : (Set.univ : Set X) ∈ F
    · exact Or.inr (Set.Subset.antisymm (Set.subset_univ _) (Set.subset_sUnion_of_mem hu))
    · refine Or.inl (Set.sUnion_eq_empty.mpr ?_)
      intro U hUF
      rcases h U hUF with rfl | rfl
      · rfl
      · exact absurd hUF hu

  def indiscrete (X : Type u) : TopologicalSpace X where
    IsOpen := fun U => U = ∅ ∨ U = Set.univ
    isOpen_univ := Or.inr rfl
    isOpen_inter := trivial_inter
    isOpen_sUnion := trivial_sUnion

  def TopologicalSpace.ConvergesTo {X : Type u} (T : TopologicalSpace X) (x : ℕ → X) (a : X) : Prop :=
    ∀ N, T.IsNbhd a N → ∃ k : ℕ, ∀ n ≥ k, x n ∈ N

  end GeneralTopology
  open GeneralTopology
description: 'Prove `indiscrete_convergesTo`: every sequence in `indiscrete X` converges to every point of `X`. `rintro` opens the neighbourhood, and `rcases` on the openness of the set inside it gives the two cases, of which the empty one is refuted by `Set.notMem_empty`.'
