reference: |-
  theorem Topology.isRegular_of_isNormal {X : Type u} {T : Topology X} (h : T.IsNormal) :
      T.IsRegular := by
    refine ⟨h.1, fun x C hC hx => ?_⟩
    have hd : ({x} : Set X) ∩ C = ∅ := by
      apply Set.eq_empty_of_forall_notMem
      rintro z ⟨hz1, hz2⟩
      rw [show z = x from hz1] at hz2
      exact hx hz2
    obtain ⟨U, V, hU, hV, hxU, hCV, hUV⟩ :=
      h.2 {x} C ((Topology.isT1_iff_isClosed_singleton T).mp h.1 x) hC hd
    exact ⟨U, V, hU, hV, hxU rfl, hCV, hUV⟩

  theorem Topology.isHausdorff_of_isRegular {X : Type u} {T : Topology X} (h : T.IsRegular) :
      T.IsHausdorff := by
    intro x y hxy
    obtain ⟨U, V, hU, hV, hxU, hyV, hUV⟩ :=
      h.2 x {y} ((Topology.isT1_iff_isClosed_singleton T).mp h.1 y) hxy
    exact ⟨U, V, hU, hV, hxU, hyV rfl, hUV⟩
spec: |-
  example : ∀ {X : Type u} {T : Topology X} (h : T.IsNormal), T.IsRegular := _root_.GeneralTopology.Topology.isRegular_of_isNormal
  example : ∀ {X : Type u} {T : Topology X} (h : T.IsRegular), T.IsHausdorff := _root_.GeneralTopology.Topology.isHausdorff_of_isRegular
preamble: |
  universe u v
  namespace GeneralTopology
  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def Topology.IsClosed {X : Type u} (T : Topology X) (C : Set X) : Prop := T.IsOpen Cᶜ

  def Topology.IsNbhd {X : Type u} (T : Topology X) (x : X) (N : Set X) : Prop :=
    ∃ U, T.IsOpen U ∧ x ∈ U ∧ U ⊆ N

  theorem Topology.nbhd_of_isOpen {X : Type u} (T : Topology X) {U : Set X}
      (hU : T.IsOpen U) {x : X} (hx : x ∈ U) : T.IsNbhd x U :=
    ⟨U, hU, hx, subset_rfl⟩

  theorem Topology.union_of_opens_inside {X : Type u} (T : Topology X) (U : Set X)
      (h : ∀ x ∈ U, T.IsNbhd x U) : U = ⋃₀ {V | T.IsOpen V ∧ V ⊆ U} := by
    apply Set.Subset.antisymm
    · intro x hx
      obtain ⟨V, hV, hxV, hVU⟩ := h x hx
      exact ⟨V, ⟨hV, hVU⟩, hxV⟩
    · rintro x ⟨V, ⟨_, hVU⟩, hxV⟩
      exact hVU hxV

  theorem Topology.isOpen_iff_nbhd {X : Type u} (T : Topology X) (U : Set X) :
      T.IsOpen U ↔ ∀ x ∈ U, T.IsNbhd x U := by
    constructor
    · intro hU x hx
      exact T.nbhd_of_isOpen hU hx
    · intro h
      rw [T.union_of_opens_inside U h]
      exact T.sUnion (fun V hV => hV.1)

  def Topology.IsT1 {X : Type u} (T : Topology X) : Prop :=
    ∀ x y : X, x ≠ y → ∃ U, T.IsOpen U ∧ x ∈ U ∧ y ∉ U

  def Topology.IsHausdorff {X : Type u} (T : Topology X) : Prop :=
    ∀ x y : X, x ≠ y → ∃ U V, T.IsOpen U ∧ T.IsOpen V ∧ x ∈ U ∧ y ∈ V ∧ U ∩ V = ∅

  theorem Topology.isT1_iff_isClosed_singleton {X : Type u} (T : Topology X) :
      T.IsT1 ↔ ∀ x : X, T.IsClosed {x} := by
    constructor
    · intro h x
      show T.IsOpen _
      rw [Topology.isOpen_iff_nbhd]
      intro y hy
      obtain ⟨U, hU, hyU, hxU⟩ := h y x hy
      exact ⟨U, hU, hyU, fun z hz he => hxU (by rw [← show z = x from he]; exact hz)⟩
    · intro h x y hxy
      exact ⟨{y}ᶜ, h y, hxy, fun hn => hn rfl⟩

  def Topology.IsRegular {X : Type u} (T : Topology X) : Prop :=
    T.IsT1 ∧ ∀ (x : X) (C : Set X), T.IsClosed C → x ∉ C →
      ∃ U V, T.IsOpen U ∧ T.IsOpen V ∧ x ∈ U ∧ C ⊆ V ∧ U ∩ V = ∅

  def Topology.IsNormal {X : Type u} (T : Topology X) : Prop :=
    T.IsT1 ∧ ∀ C D : Set X, T.IsClosed C → T.IsClosed D → C ∩ D = ∅ →
      ∃ U V, T.IsOpen U ∧ T.IsOpen V ∧ C ⊆ U ∧ D ⊆ V ∧ U ∩ V = ∅

  end GeneralTopology
  open GeneralTopology
description: Prove `Topology.isRegular_of_isNormal` and `Topology.isHausdorff_of_isRegular`. Both apply `Topology.isT1_iff_isClosed_singleton` to the first half of the hypothesis. For the first, `Set.eq_empty_of_forall_notMem` proves `{x} ∩ C = ∅`; in both, a containment `{x} ⊆ U` applied to `rfl` is the membership `x ∈ U`.
