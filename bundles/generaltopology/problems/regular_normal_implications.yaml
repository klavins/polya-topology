  example : ∀ {X : Type u} {T : TopologicalSpace X} (h : T.IsT3), T.IsT2 := _root_.GeneralTopology.TopologicalSpace.isT2_of_isT3
preamble: |
  universe u v
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.IsClosed {X : Type u} (T : TopologicalSpace X) (C : Set X) : Prop
      := T.IsOpen Cᶜ

  def TopologicalSpace.IsNbhd {X : Type u} (T : TopologicalSpace X) (x : X) (N : Set X) : Prop :=
    ∃ U, T.IsOpen U ∧ x ∈ U ∧ U ⊆ N

  theorem TopologicalSpace.nbhd_of_isOpen {X : Type u} (T : TopologicalSpace X) {U : Set X}
      (hU : T.IsOpen U) {x : X} (hx : x ∈ U) : T.IsNbhd x U :=
    ⟨U, hU, hx, subset_rfl⟩

  theorem TopologicalSpace.union_of_opens_inside {X : Type u} (T : TopologicalSpace X) (U : Set X)
      (h : ∀ x ∈ U, T.IsNbhd x U) : U = ⋃₀ {V | T.IsOpen V ∧ V ⊆ U} := by
    apply Set.Subset.antisymm
    · intro x hx
      obtain ⟨V, hV, hxV, hVU⟩ := h x hx
      exact ⟨V, ⟨hV, hVU⟩, hxV⟩
    · rintro x ⟨V, ⟨_, hVU⟩, hxV⟩
      exact hVU hxV

  theorem TopologicalSpace.isOpen_iff_nbhd {X : Type u} (T : TopologicalSpace X) (U : Set X) :
      T.IsOpen U ↔ ∀ x ∈ U, T.IsNbhd x U := by
    constructor
    · intro hU x hx
      exact T.nbhd_of_isOpen hU hx
    · intro h
      rw [T.union_of_opens_inside U h]
      exact T.isOpen_sUnion (fun V hV => hV.1)

  def TopologicalSpace.IsT1 {X : Type u} (T : TopologicalSpace X) : Prop :=
    ∀ x y : X, x ≠ y → ∃ U, T.IsOpen U ∧ x ∈ U ∧ y ∉ U

  def TopologicalSpace.IsT2 {X : Type u} (T : TopologicalSpace X) : Prop :=
    ∀ x y : X, x ≠ y → ∃ U V, T.IsOpen U ∧ T.IsOpen V ∧ x ∈ U ∧ y ∈ V ∧ U ∩ V = ∅

  theorem TopologicalSpace.isT1_iff_isClosed_singleton {X : Type u} (T : TopologicalSpace X) :
      T.IsT1 ↔ ∀ x : X, T.IsClosed {x} := by
    constructor
    · intro h x
      show T.IsOpen _
      rw [TopologicalSpace.isOpen_iff_nbhd]
      intro y hy
      obtain ⟨U, hU, hyU, hxU⟩ := h y x hy
      exact ⟨U, hU, hyU, fun z hz he => hxU (by rw [← show z = x from he]; exact hz)⟩
    · intro h x y hxy
      exact ⟨{y}ᶜ, h y, hxy, fun hn => hn rfl⟩

  def TopologicalSpace.IsT3 {X : Type u} (T : TopologicalSpace X) : Prop :=
    T.IsT1 ∧ ∀ (x : X) (C : Set X), T.IsClosed C → x ∉ C →
      ∃ U V, T.IsOpen U ∧ T.IsOpen V ∧ x ∈ U ∧ C ⊆ V ∧ U ∩ V = ∅

  def TopologicalSpace.IsT4 {X : Type u} (T : TopologicalSpace X) : Prop :=
    T.IsT1 ∧ ∀ C D : Set X, T.IsClosed C → T.IsClosed D → C ∩ D = ∅ →
      ∃ U V, T.IsOpen U ∧ T.IsOpen V ∧ C ⊆ U ∧ D ⊆ V ∧ U ∩ V = ∅

  end GeneralTopology
  open GeneralTopology
description: Prove `TopologicalSpace.isT3_of_isT4` and `TopologicalSpace.isT2_of_isT3`. Both apply `TopologicalSpace.isT1_iff_isClosed_singleton` to the first half of the hypothesis. For the first, `Set.eq_empty_of_forall_notMem` proves `{x} ∩ C = ∅`; in both, a containment `{x} ⊆ U` applied to `rfl` is the membership `x ∈ U`.
