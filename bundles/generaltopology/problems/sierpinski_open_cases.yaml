reference: |-
  theorem sierpinski_open_cases {U : Set Bool} (hU : sierpinski.IsOpen U) :
      U = ∅ ∨ U = {true} ∨ U = Set.univ := by
    by_cases hf : false ∈ U
    · exact Or.inr (Or.inr (Set.eq_univ_of_forall (fun b => by cases b; exacts [hf, hU hf])))
    · by_cases ht : true ∈ U
      · exact Or.inr (Or.inl (Set.ext (fun b => by cases b <;> simp [hf, ht])))
      · exact Or.inl (Set.eq_empty_of_forall_notMem (fun b => by cases b <;> assumption))
spec: 'example : ∀ {U : Set Bool} (hU : sierpinski.IsOpen U), U = ∅ ∨ U = {true} ∨ U = Set.univ := _root_.GeneralTopology.sierpinski_open_cases'
preamble: |
  universe u v w
  namespace GeneralTopology
  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def sierpinski : Topology Bool where
    IsOpen := fun U => false ∈ U → true ∈ U
    univ := fun _ => trivial
    inter := fun hU hV h => ⟨hU h.1, hV h.2⟩
    sUnion := by
      intro F h hf
      obtain ⟨U, hUF, hU⟩ := hf
      exact ⟨U, hUF, h U hUF hU⟩

  end GeneralTopology
  open GeneralTopology
description: Show that an open set of `sierpinski` is `∅`, `{true}`, or `Set.univ`. Split twice with `by_cases`, and build each equality with `Set.eq_univ_of_forall`, `Set.ext` or `Set.eq_empty_of_forall_notMem`; inside each, `cases b` leaves two goals that the hypotheses in hand close.
