reference: |-
  theorem trace_eq_univ_iff {X : Type u} {A U : Set X} :
      (Subtype.val ⁻¹' U : Set A) = Set.univ ↔ A ⊆ U := by
    constructor
    · intro h x hx
      have hp : (⟨x, hx⟩ : A) ∈ (Subtype.val ⁻¹' U : Set A) := by rw [h]; trivial
      exact hp
    · intro h
      apply Set.eq_univ_of_forall
      intro p
      exact h p.2

  theorem trace_split {X : Type u} {A U V : Set X}
      (h : (Subtype.val ⁻¹' U : Set A)ᶜ = Subtype.val ⁻¹' V) :
      (∀ x ∈ A, x ∈ U → x ∉ V) ∧ A ⊆ U ∪ V := by
    constructor
    · intro x hxA hxU hxV
      have hp : (⟨x, hxA⟩ : A) ∈ (Subtype.val ⁻¹' V : Set A) := hxV
      rw [← h] at hp
      exact hp hxU
    · intro x hxA
      by_cases hxU : x ∈ U
      · exact Or.inl hxU
      · have hp : (⟨x, hxA⟩ : A) ∈ (Subtype.val ⁻¹' U : Set A)ᶜ := hxU
        rw [h] at hp
        exact Or.inr hp
spec: |-
  example : ∀ {X : Type u} {A U : Set X}, (Subtype.val ⁻¹' U : Set A) = Set.univ ↔ A ⊆ U := _root_.GeneralTopology.trace_eq_univ_iff
  example : ∀ {X : Type u} {A U V : Set X}
      (h : (Subtype.val ⁻¹' U : Set A)ᶜ = Subtype.val ⁻¹' V), (∀ x ∈ A, x ∈ U → x ∉ V) ∧ A ⊆ U ∪ V := _root_.GeneralTopology.trace_split
