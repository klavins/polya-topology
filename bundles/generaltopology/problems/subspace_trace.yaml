description: 'Prove `trace_eq_univ_iff` and `trace_split`. Each direction turns a point `x` of `A` into the point `(⟨x, hx⟩ : A)` of the subspace and rewrites its membership along the equation given; `Set.eq_univ_of_forall` proves a set is everything one point at a time.'
