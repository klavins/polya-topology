slug: trivial_connected
kind: example
title: The Two Extremes
statement: |-
  The codiscrete topology has two open sets and no others, so a set both open and closed is already one of the two the definition allows. Nothing is left to check: the hypothesis is the conclusion.

  The discrete topology is the other extreme. On the two-point set `Bool` the set `{true}` is open, and so is its complement, so `{true}` is both open and closed while being neither empty nor everything. A discrete space with two distinct points is never connected, and this is the smallest witness.
concepts:
- connected_examples
stub: |-
  theorem codiscrete_isConnected (X : Type u) : (codiscrete X).IsConnected := sorry

  theorem discrete_bool_not_isConnected : ¬ (discrete Bool).IsConnected := sorry
reference: |-
  theorem codiscrete_isConnected (X : Type u) : (codiscrete X).IsConnected :=
    fun _ hS _ => hS

  theorem discrete_bool_not_isConnected : ¬ (discrete Bool).IsConnected := fun h =>
    singleton_true_not_trivial (h {true} trivial trivial)
spec: |-
  example : ∀ (X : Type u), (codiscrete X).IsConnected := _root_.GeneralTopology.codiscrete_isConnected
  example : ¬ (discrete Bool).IsConnected := _root_.GeneralTopology.discrete_bool_not_isConnected
preamble: |
  universe u v w
  namespace GeneralTopology
  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def Topology.IsClosed {X : Type u} (T : Topology X) (C : Set X) : Prop := T.IsOpen Cᶜ

  def discrete (X : Type u) : Topology X where
    IsOpen := fun _ => True
    univ := trivial
    inter := fun _ _ => trivial
    sUnion := fun _ => trivial

  theorem trivial_inter {X : Type u} {U V : Set X} (hU : U = ∅ ∨ U = Set.univ)
      (hV : V = ∅ ∨ V = Set.univ) : U ∩ V = ∅ ∨ U ∩ V = Set.univ := by
    rcases hU with rfl | rfl
    · left; exact Set.empty_inter V
    · rcases hV with rfl | rfl
      · left; exact Set.inter_empty _
      · right; exact Set.inter_self _

  theorem trivial_sUnion {X : Type u} {F : Set (Set X)}
      (h : ∀ U ∈ F, U = ∅ ∨ U = Set.univ) : ⋃₀ F = ∅ ∨ ⋃₀ F = Set.univ := by
    by_cases hu : (Set.univ : Set X) ∈ F
    · exact Or.inr (Set.Subset.antisymm (Set.subset_univ _) (Set.subset_sUnion_of_mem hu))
    · refine Or.inl (Set.sUnion_eq_empty.mpr ?_)
      intro U hUF
      rcases h U hUF with rfl | rfl
      · rfl
      · exact absurd hUF hu

  def codiscrete (X : Type u) : Topology X where
    IsOpen := fun U => U = ∅ ∨ U = Set.univ
    univ := Or.inr rfl
    inter := trivial_inter
    sUnion := trivial_sUnion

  theorem singleton_true_not_trivial :
      ¬ (({true} : Set Bool) = ∅ ∨ ({true} : Set Bool) = Set.univ) := by
    rintro (he | he)
    · have h : (true : Bool) ∈ ({true} : Set Bool) := rfl
      rw [he] at h
      exact h
    · have h : (false : Bool) ∈ ({true} : Set Bool) := by rw [he]; trivial
      exact Bool.noConfusion h

  def Topology.IsConnected {X : Type u} (T : Topology X) : Prop :=
    ∀ S, T.IsOpen S → T.IsClosed S → S = ∅ ∨ S = Set.univ

  end GeneralTopology
  open GeneralTopology
description: Show `codiscrete_isConnected` and `discrete_bool_not_isConnected`. The first is one of its own hypotheses. For the second, `singleton_true_not_trivial` from the section on homeomorphisms is the fact that `{true}` is neither `∅` nor `Set.univ`, and `trivial` proves whatever the discrete topology asks.
