preamble: |
  universe u v w
  namespace GeneralTopology
  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def Topology.Continuous {X : Type u} {Y : Type v} (T : Topology X) (T' : Topology Y)
      (f : X → Y) : Prop :=
    ∀ U, T'.IsOpen U → T.IsOpen (f ⁻¹' U)

  theorem preimage_sUnion_image {X : Type u} {Y : Type v} (f : X → Y) (F : Set (Set Y)) :
      f ⁻¹' (⋃₀ F) = ⋃₀ (Set.preimage f '' F) := by
    apply Set.Subset.antisymm
    · rintro x ⟨V, hVF, hxV⟩
      exact ⟨f ⁻¹' V, ⟨V, hVF, rfl⟩, hxV⟩
    · rintro x ⟨W, ⟨V, hVF, rfl⟩, hxW⟩
      exact ⟨V, hVF, hxW⟩

  def Topology.sum {X : Type u} {Y : Type v} (T : Topology X) (T' : Topology Y) :
      Topology (X ⊕ Y) where
    IsOpen := fun W => T.IsOpen (Sum.inl ⁻¹' W) ∧ T'.IsOpen (Sum.inr ⁻¹' W)
    univ := by
      rw [Set.preimage_univ, Set.preimage_univ]
      exact ⟨T.univ, T'.univ⟩
    inter := by
      intro V W hV hW
      rw [Set.preimage_inter, Set.preimage_inter]
      exact ⟨T.inter hV.1 hW.1, T'.inter hV.2 hW.2⟩
    sUnion := by
      intro F h
      rw [preimage_sUnion_image, preimage_sUnion_image]
      constructor
      · exact T.sUnion (by rintro W ⟨V, hVF, rfl⟩; exact (h V hVF).1)
      · exact T'.sUnion (by rintro W ⟨V, hVF, rfl⟩; exact (h V hVF).2)

  end GeneralTopology
  open GeneralTopology
description: Show that `Sum.inl` and `Sum.inr` are continuous into `T.sum T'`. Each is one half of the hypothesis, taken with `.1` or `.2`.
