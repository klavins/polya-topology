slug: sum_injections_continuous
kind: example
title: The Two Injections Are Continuous
statement: '`Sum.inl` puts `X` into the sum and `Sum.inr` puts `Y` in. Each is continuous, and the definition was written so that there is nothing left to say: the preimage of an open `W` under `Sum.inl` is the first of the two things being open asks of `W`, and the preimage under `Sum.inr` is the second.'
