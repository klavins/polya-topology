reference: |-
  theorem MetricSpace.ball_mono {X : Type u} (M : MetricSpace X) {x : X} {ε δ : ℝ} (h : ε ≤ δ) :
      M.ball x ε ⊆ M.ball x δ :=
    fun _ hy => lt_of_lt_of_le hy h
spec: 'example : ∀ {X : Type u} (M : MetricSpace X) {x : X} {ε δ : ℝ} (h : ε ≤ δ), M.ball x ε ⊆ M.ball x δ := _root_.GeneralTopology.MetricSpace.ball_mono'
preamble: |
  universe u
  namespace GeneralTopology
  structure MetricSpace (X : Type u) where
    dist : X → X → ℝ
    dist_comm : ∀ {x y}, dist x y = dist y x
    dist_triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    dist_eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  def MetricSpace.ball {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) : Set X :=
    {y | M.dist x y < ε}

  end GeneralTopology
  open GeneralTopology
description: Show that `M.ball x ε ⊆ M.ball x δ` when `ε ≤ δ`. A containment is a function taking a point and a proof of membership to a proof of membership, so the whole proof can be written as `fun _ hy => ...`; `lt_of_lt_of_le` chains a strict inequality with a weak one.
