slug: ball_mono
kind: theorem
title: Balls Grow With Their Radius
statement: 'Two balls about the same centre are nested, the one of smaller radius inside the one of larger: a point nearer to `x` than `ε` is nearer to `x` than any `δ` at least as large. So the balls about a fixed point form a family increasing with the radius, and to say that something holds "for all small enough radii" is to say that it holds for one.'
