  theorem TopologicalSpace.continuous_toSubspace {X : Type u} {Y : Type v} {T : TopologicalSpace X}
      {T' : TopologicalSpace Y} {f : X → Y} (hf : T.Continuous T' f) (A : Set Y) (h : ∀ x, f x ∈ A) :
      T.Continuous (T'.subspace A) (fun x => (⟨f x, h x⟩ : A)) := by
    intro V hV
    obtain ⟨U, hU, rfl⟩ := hV
    exact hf U hU
spec: |-
  example : ∀ {X : Type u} {Y : Type v} {T : TopologicalSpace X}
      {T' : TopologicalSpace Y} {f : X → Y} (hf : T.Continuous T' f) (A : Set Y) (h : ∀ x, f x ∈ A), T.Continuous (T'.subspace A) (fun x => (⟨f x, h x⟩ : A)) := _root_.GeneralTopology.TopologicalSpace.continuous_toSubspace
preamble: |
  universe u v w
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.subspace {X : Type u} (T : TopologicalSpace X) (A : Set X)
      : TopologicalSpace A where
    IsOpen := fun V => ∃ U, T.IsOpen U ∧ V = Subtype.val ⁻¹' U
    isOpen_univ := ⟨Set.univ, T.isOpen_univ, rfl⟩
    isOpen_inter := by
      rintro V W ⟨U, hU, rfl⟩ ⟨U', hU', rfl⟩
      exact ⟨U ∩ U', T.isOpen_inter hU hU', rfl⟩
    isOpen_sUnion := by
      intro F h
      refine ⟨⋃₀ {U | T.IsOpen U ∧ (Subtype.val ⁻¹' U : Set A) ∈ F},
        T.isOpen_sUnion (fun U hU => hU.1), ?_⟩
      apply Set.Subset.antisymm
      · rintro x ⟨V, hVF, hxV⟩
        obtain ⟨U, hU, rfl⟩ := h V hVF
        exact ⟨U, ⟨hU, hVF⟩, hxV⟩
      · rintro x ⟨U, ⟨hU, hUF⟩, hxU⟩
        exact ⟨_, hUF, hxU⟩

  def TopologicalSpace.Continuous {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      (f : X → Y) : Prop :=
    ∀ U, T'.IsOpen U → T.IsOpen (f ⁻¹' U)

  end GeneralTopology
  open GeneralTopology
description: 'Show that `fun x => (⟨f x, h x⟩ : A)` is continuous into `T''.subspace A` when `f` is continuous and every `f x` lies in `A`. Take the open set apart with `obtain ⟨U, hU, rfl⟩`; what is left is the hypothesis at `U`, with no rewriting needed.'
