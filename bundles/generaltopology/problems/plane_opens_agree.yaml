reference: |-
  theorem isOpen_prod_of_isOpenSet_supNorm {W : Set (ℝ × ℝ)} (h : supNorm.toMetricSpace.IsOpenSet W) :
      (line.toTopologicalSpace.prod line.toTopologicalSpace).IsOpen W := by
    intro p hp
    obtain ⟨ε, hε, hsub⟩ := h p hp
    refine ⟨line.ball p.1 ε, line.ball p.2 ε, MetricSpace.isOpenSet_ball line p.1 ε,
      MetricSpace.isOpenSet_ball line p.2 ε,
      ⟨MetricSpace.mem_ball_self line p.1 ε hε, MetricSpace.mem_ball_self line p.2 ε hε⟩, ?_⟩
    rw [← ball_supNorm_eq_box]
    exact hsub

  theorem isOpenSet_supNorm_of_isOpen_prod {W : Set (ℝ × ℝ)}
      (h : (line.toTopologicalSpace.prod line.toTopologicalSpace).IsOpen W) :
      supNorm.toMetricSpace.IsOpenSet W := by
    intro p hp
    obtain ⟨U, V, hU, hV, hpUV, hsub⟩ := h p hp
    obtain ⟨a, ha, hau⟩ := hU p.1 hpUV.1
    obtain ⟨b, hb, hbv⟩ := hV p.2 hpUV.2
    refine ⟨min a b, lt_min ha hb, ?_⟩
    rw [ball_supNorm_eq_box]
    rintro q ⟨hq1, hq2⟩
    exact hsub ⟨hau (MetricSpace.ball_mono line (min_le_left a b) hq1),
      hbv (MetricSpace.ball_mono line (min_le_right a b) hq2)⟩
spec: |-
  example : ∀ {W : Set (ℝ × ℝ)} (h : supNorm.toMetricSpace.IsOpenSet W), (line.toTopologicalSpace.prod line.toTopologicalSpace).IsOpen W := _root_.GeneralTopology.isOpen_prod_of_isOpenSet_supNorm
  example : ∀ {W : Set (ℝ × ℝ)}
      (h : (line.toTopologicalSpace.prod line.toTopologicalSpace).IsOpen W), supNorm.toMetricSpace.IsOpenSet W := _root_.GeneralTopology.isOpenSet_supNorm_of_isOpen_prod
preamble: |
  universe u v w
  namespace GeneralTopology
  structure MetricSpace (X : Type u) where
    dist : X → X → ℝ
    dist_comm : ∀ {x y}, dist x y = dist y x
    dist_triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    dist_eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  theorem MetricSpace.dist_self {X : Type u} (M : MetricSpace X) {x : X} : M.dist x x = 0 :=
    M.dist_eq_zero.mpr rfl

  def line : MetricSpace ℝ where
    dist x y := |x - y|
    dist_comm {x y} := abs_sub_comm x y
    dist_triangle x y z := abs_sub_le x y z
    dist_eq_zero {x y} := by rw [abs_eq_zero, sub_eq_zero]

  def MetricSpace.ball {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) : Set X :=
    {y | M.dist x y < ε}

  theorem MetricSpace.mem_ball {X : Type u} (M : MetricSpace X) {x y : X} {ε : ℝ} :
      y ∈ M.ball x ε ↔ M.dist x y < ε := Iff.rfl

  theorem MetricSpace.mem_ball_self {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) (h : 0 < ε) :
      x ∈ M.ball x ε := by
    rw [M.mem_ball, M.dist_self]
    exact h

  theorem MetricSpace.ball_mono {X : Type u} (M : MetricSpace X) {x : X} {ε δ : ℝ} (h : ε ≤ δ) :
      M.ball x ε ⊆ M.ball x δ :=
    fun _ hy => lt_of_lt_of_le hy h

  structure Norm (V : Type u) [AddCommGroup V] [Module ℝ V] where
    norm : V → ℝ
    norm_eq_zero : ∀ {v}, norm v = 0 ↔ v = 0
    norm_smul : ∀ (c : ℝ) (v : V), norm (c • v) = |c| * norm v
    norm_add_le : ∀ v w, norm (v + w) ≤ norm v + norm w

  theorem Norm.neg {V : Type u} [AddCommGroup V] [Module ℝ V] (N : Norm V) (v : V) :
      N.norm (-v) = N.norm v := by
    have h := N.norm_smul (-1) v
    rw [neg_one_smul] at h
    rw [h, abs_neg, abs_one, one_mul]

  theorem Norm.sub_comm {V : Type u} [AddCommGroup V] [Module ℝ V] (N : Norm V) (v w : V) :
      N.norm (v - w) = N.norm (w - v) := by
    rw [← N.neg (v - w), neg_sub]

  def Norm.toMetricSpace {V : Type u} [AddCommGroup V] [Module ℝ V] (N : Norm V) : MetricSpace V where
    dist v w := N.norm (v - w)
    dist_comm {v w} := N.sub_comm v w
    dist_triangle u v w := by
      have h := N.norm_add_le (u - v) (v - w)
      rw [sub_add_sub_cancel] at h
      exact h
    dist_eq_zero {v w} := by rw [N.norm_eq_zero, sub_eq_zero]

  theorem eq_zero_of_abs_le_zero {a : ℝ} (h : |a| ≤ 0) : a = 0 := by
    rw [← abs_eq_zero]
    have h0 := abs_nonneg a
    linarith

  theorem prod_eq_zero {v : ℝ × ℝ} : v = 0 ↔ v.1 = 0 ∧ v.2 = 0 := by
    constructor
    · intro h
      rw [h]
      exact ⟨rfl, rfl⟩
    · rintro ⟨h1, h2⟩
      exact Prod.ext h1 h2

  theorem max_abs_eq_zero {a b : ℝ} : max |a| |b| = 0 ↔ a = 0 ∧ b = 0 := by
    constructor
    · intro h
      have ha := le_max_left |a| |b|
      have hb := le_max_right |a| |b|
      rw [h] at ha hb
      exact ⟨eq_zero_of_abs_le_zero ha, eq_zero_of_abs_le_zero hb⟩
    · rintro ⟨ha, hb⟩
      rw [ha, hb, abs_zero, max_self]

  theorem max_add_max (a b c d : ℝ) : max (a + c) (b + d) ≤ max a b + max c d := by
    rw [max_le_iff]
    have a1 := le_max_left a b
    have a2 := le_max_right a b
    have b1 := le_max_left c d
    have b2 := le_max_right c d
    constructor <;> linarith

  def supNorm : Norm (ℝ × ℝ) where
    norm v := max |v.1| |v.2|
    norm_eq_zero {v} := by rw [max_abs_eq_zero, prod_eq_zero]
    norm_smul c v := by
      show max |c * v.1| |c * v.2| = |c| * max |v.1| |v.2|
      rw [abs_mul, abs_mul, mul_max_of_nonneg _ _ (abs_nonneg c)]
    norm_add_le v w := by
      show max |v.1 + w.1| |v.2 + w.2| ≤ max |v.1| |v.2| + max |w.1| |w.2|
      have h1 := max_le_max (abs_add_le v.1 w.1) (abs_add_le v.2 w.2)
      have h2 := max_add_max |v.1| |v.2| |w.1| |w.2|
      linarith

  def MetricSpace.IsOpenSet {X : Type u} (M : MetricSpace X) (U : Set X) : Prop :=
    ∀ x ∈ U, ∃ ε > 0, M.ball x ε ⊆ U

  theorem MetricSpace.isOpenSet_ball {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) :
      M.IsOpenSet (M.ball x ε) := by
    intro y hy
    rw [M.mem_ball] at hy
    refine ⟨ε - M.dist x y, by linarith, ?_⟩
    intro z hz
    rw [M.mem_ball] at hz ⊢
    have h := M.dist_triangle x y z
    linarith

  theorem MetricSpace.isOpenSet_univ {X : Type u} (M : MetricSpace X) : M.IsOpenSet (Set.univ : Set X)
      :=
    fun _ _ => ⟨1, one_pos, fun _ _ => trivial⟩

  theorem MetricSpace.isOpenSet_inter {X : Type u} (M : MetricSpace X) {U V : Set X}
      (hU : M.IsOpenSet U) (hV : M.IsOpenSet V) : M.IsOpenSet (U ∩ V) := by
    intro x hx
    obtain ⟨a, ha, hau⟩ := hU x hx.1
    obtain ⟨b, hb, hbv⟩ := hV x hx.2
    refine ⟨min a b, lt_min ha hb, ?_⟩
    intro y hy
    rw [M.mem_ball] at hy
    exact ⟨hau (lt_of_lt_of_le hy (min_le_left a b)), hbv (lt_of_lt_of_le hy (min_le_right a b))⟩

  theorem MetricSpace.isOpenSet_sUnion {X : Type u} (M : MetricSpace X) {F : Set (Set X)}
      (h : ∀ U ∈ F, M.IsOpenSet U) : M.IsOpenSet (⋃₀ F) := by
    intro x hx
    obtain ⟨U, hUF, hxU⟩ := hx
    obtain ⟨ε, hε, hsub⟩ := h U hUF x hxU
    exact ⟨ε, hε, fun y hy => ⟨U, hUF, hsub hy⟩⟩

  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def MetricSpace.toTopologicalSpace {X : Type u} (M : MetricSpace X) : TopologicalSpace X where
    IsOpen := M.IsOpenSet
    isOpen_univ := M.isOpenSet_univ
    isOpen_inter := M.isOpenSet_inter
    isOpen_sUnion := M.isOpenSet_sUnion

  def TopologicalSpace.prod {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y) :
      TopologicalSpace (X × Y) where
    IsOpen := fun W => ∀ p ∈ W, ∃ U V, T.IsOpen U ∧ T'.IsOpen V ∧ p ∈ U ×ˢ V ∧ U ×ˢ V ⊆ W
    isOpen_univ := fun _ _ =>
      ⟨Set.univ, Set.univ, T.isOpen_univ, T'.isOpen_univ, ⟨trivial, trivial⟩, fun _ _ => trivial⟩
    isOpen_inter := by
      rintro W W' hW hW' p hp
      obtain ⟨U, V, hU, hV, hpUV, hsub⟩ := hW p hp.1
      obtain ⟨U', V', hU', hV', hpUV', hsub'⟩ := hW' p hp.2
      refine ⟨U ∩ U', V ∩ V', T.isOpen_inter hU hU', T'.isOpen_inter hV hV',
        ⟨⟨hpUV.1, hpUV'.1⟩, ⟨hpUV.2, hpUV'.2⟩⟩, ?_⟩
      rintro q ⟨hq1, hq2⟩
      exact ⟨hsub ⟨hq1.1, hq2.1⟩, hsub' ⟨hq1.2, hq2.2⟩⟩
    isOpen_sUnion := by
      rintro F h p ⟨W, hWF, hpW⟩
      obtain ⟨U, V, hU, hV, hpUV, hsub⟩ := h W hWF p hpW
      exact ⟨U, V, hU, hV, hpUV, fun q hq => ⟨W, hWF, hsub hq⟩⟩

  theorem ball_supNorm_eq_box (x : ℝ × ℝ) (ε : ℝ) :
      supNorm.toMetricSpace.ball x ε = line.ball x.1 ε ×ˢ line.ball x.2 ε := by
    ext y
    show max |x.1 - y.1| |x.2 - y.2| < ε ↔ |x.1 - y.1| < ε ∧ |x.2 - y.2| < ε
    exact max_lt_iff

  end GeneralTopology
  open GeneralTopology
description: Prove both directions between `supNorm.toMetricSpace.IsOpenSet W` and `(line.toTopologicalSpace.prod line.toTopologicalSpace).IsOpen W`. The previous problem rewrites a ball as a box in each. For the second, `min a b` is the radius, and `MetricSpace.ball_mono` carries a point of the smaller ball into each of the two.
