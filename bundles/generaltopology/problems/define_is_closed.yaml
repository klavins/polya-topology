reference: |-
  def Topology.IsClosed {X : Type u} (T : Topology X) (C : Set X) : Prop := T.IsOpen Cᶜ

  theorem Topology.isClosed_univ {X : Type u} (T : Topology X) : T.IsClosed (Set.univ : Set X) := by
    show T.IsOpen _
    rw [Set.compl_univ]
    exact T.empty
spec: |-
  example {X : Type u} (T : Topology X) (C : Set X) : _root_.GeneralTopology.Topology.IsClosed T C ↔ (T.IsOpen Cᶜ) := by unfold _root_.GeneralTopology.Topology.IsClosed; first | exact Iff.rfl | grind
  example : ∀ {X : Type u} (T : Topology X), T.IsClosed (Set.univ : Set X) := _root_.GeneralTopology.Topology.isClosed_univ
  example (X : Type) (T : Topology X) (C : Set X) : T.IsClosed C ↔ T.IsOpen Cᶜ := Iff.rfl
preamble: |
  universe u
  namespace GeneralTopology
  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  theorem Topology.empty {X : Type u} (T : Topology X) : T.IsOpen (∅ : Set X) := by
    have h : T.IsOpen (⋃₀ (∅ : Set (Set X))) := T.sUnion (fun _ hU => hU.elim)
    rwa [Set.sUnion_empty] at h

  end GeneralTopology
  open GeneralTopology
description: Define `Topology.IsClosed`, and then show that `Set.univ` is closed. For the second, `show T.IsOpen _` names the goal for what it is, `Set.compl_univ` rewrites the complement, and the empty set is open.
