reference: |-
  structure Metric (X : Type u) where
    dist : X → X → ℝ
    symm : ∀ {x y}, dist x y = dist y x
    triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y
spec: |-
  example (X : Type) (M : _root_.GeneralTopology.Metric X) (x y z : X) :
      M.dist x y = M.dist y x
        ∧ M.dist x z ≤ M.dist x y + M.dist y z
        ∧ (M.dist x y = 0 ↔ x = y) :=
    ⟨by apply M.symm, by apply M.triangle, by simp [M.eq_zero]⟩
preamble: |
  universe u
description: 'Define the structure `Metric X` for a type `X`, with four fields in this order: `dist`, of type `X → X → ℝ`; then `symm`, `triangle` and `eq_zero`, carrying the three conditions above. Bind the points implicitly in `symm` and `eq_zero`, explicitly in `triangle`, whose middle point is never fixed by the goal.'
