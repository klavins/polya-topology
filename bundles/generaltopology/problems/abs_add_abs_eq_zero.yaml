description: Show that `|a| + |b| = 0` exactly when `a = 0` and `b = 0`. In one direction, `abs_nonneg` applied to each of `a` and `b` puts each magnitude within reach of the previous problem; in the other, rewrite by the two hypotheses and clear the result with `abs_zero` and `add_zero`.
