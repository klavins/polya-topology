slug: abs_add_abs_eq_zero
kind: theorem
title: When a Sum of Magnitudes Vanishes
statement: Two non-negative numbers add up to zero only if both are zero, since neither can be made up for by the other. So `|a| + |b| = 0` holds exactly when `a` and `b` are both zero. This is the non-degeneracy of the first norm on the plane, written out in coordinates before the norm itself is defined.
concepts:
- plane_norms
