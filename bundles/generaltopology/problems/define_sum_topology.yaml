reference: |-
  def TopologicalSpace.sum {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y) :
      TopologicalSpace (X ⊕ Y) where
    IsOpen := fun W => T.IsOpen (Sum.inl ⁻¹' W) ∧ T'.IsOpen (Sum.inr ⁻¹' W)
    isOpen_univ := by
      rw [Set.preimage_univ, Set.preimage_univ]
      exact ⟨T.isOpen_univ, T'.isOpen_univ⟩
    isOpen_inter := by
      intro V W hV hW
      rw [Set.preimage_inter, Set.preimage_inter]
      exact ⟨T.isOpen_inter hV.1 hW.1, T'.isOpen_inter hV.2 hW.2⟩
    isOpen_sUnion := by
      intro F h
      rw [preimage_sUnion_image, preimage_sUnion_image]
      constructor
      · exact T.isOpen_sUnion (by rintro W ⟨V, hVF, rfl⟩; exact (h V hVF).1)
      · exact T'.isOpen_sUnion (by rintro W ⟨V, hVF, rfl⟩; exact (h V hVF).2)
spec: |-
  example (X Y : Type) (T : TopologicalSpace X) (T' : TopologicalSpace Y) (W : Set (X ⊕ Y)) :
      (T.sum T').IsOpen W ↔ T.IsOpen (Sum.inl ⁻¹' W) ∧ T'.IsOpen (Sum.inr ⁻¹' W) := Iff.rfl
preamble: |
  universe u v w
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  theorem preimage_sUnion_image {X : Type u} {Y : Type v} (f : X → Y) (F : Set (Set Y)) :
      f ⁻¹' (⋃₀ F) = ⋃₀ (Set.preimage f '' F) := by
    apply Set.Subset.antisymm
    · rintro x ⟨V, hVF, hxV⟩
      exact ⟨f ⁻¹' V, ⟨V, hVF, rfl⟩, hxV⟩
    · rintro x ⟨W, ⟨V, hVF, rfl⟩, hxW⟩
      exact ⟨V, hVF, hxW⟩

  end GeneralTopology
  open GeneralTopology
description: Define `TopologicalSpace.sum`, whose `IsOpen W` is the conjunction of `T.IsOpen (Sum.inl ⁻¹' W)` and `T'.IsOpen (Sum.inr ⁻¹' W)`, in that order. Each field rewrites both preimages — the third by the first problem of the section — and then offers the pair of conditions from `T` and `T'`.
