slug: metric_regular
kind: theorem
title: Every Metric Space is Regular
statement: |-
  Let `C` be closed and let `x` lie outside it. Then `x` belongs to the open set `Cᶜ`, so some ball `M.ball x ε` misses `C` altogether.

  Halve that radius. Around `x` put `M.ball x (ε / 2)`; around `C` put the union of the balls `M.ball c (ε / 2)` taken over the points `c` of `C`. The second is open, being a union of balls, and it covers `C`, each point of `C` being the centre of one of them.

  The two do not meet. A point `z` in both is within `ε / 2` of `x` and within `ε / 2` of some `c` of `C`, so `x` is within `ε` of `c` — and no point of `C` is that close to `x`.
concepts:
- regular_normal
stub: 'theorem MetricSpace.isT3 {X : Type u} (M : MetricSpace X) : M.toTopologicalSpace.IsT3 := sorry'
reference: |-
  theorem MetricSpace.isT3 {X : Type u} (M : MetricSpace X) : M.toTopologicalSpace.IsT3 := by
    refine ⟨TopologicalSpace.isT1_of_isT2 (MetricSpace.isT2 M), fun x C hC hx => ?_⟩
    obtain ⟨ε, hε, hball⟩ := hC x hx
    have hopen : M.IsOpenSet (⋃₀ {B | ∃ c ∈ C, B = M.ball c (ε / 2)}) :=
      MetricSpace.isOpenSet_sUnion M (by rintro B ⟨c, _, rfl⟩; exact MetricSpace.isOpenSet_ball M c _)
    have hCV : C ⊆ ⋃₀ {B | ∃ c ∈ C, B = M.ball c (ε / 2)} :=
      fun c hc => ⟨M.ball c (ε / 2), ⟨c, hc, rfl⟩, MetricSpace.mem_ball_self M c _ (by linarith)⟩
    refine ⟨M.ball x (ε / 2), _, MetricSpace.isOpenSet_ball M x _, hopen,
      MetricSpace.mem_ball_self M x _ (by linarith), hCV, ?_⟩
    apply Set.eq_empty_of_forall_notMem
    rintro z ⟨hz1, B, ⟨c, hc, rfl⟩, hz2⟩
    rw [MetricSpace.mem_ball M] at hz1 hz2
    have e : M.dist c z = M.dist z c := M.dist_comm
    have ht := M.dist_triangle x z c
    exact hball ((MetricSpace.mem_ball M).mpr (by linarith)) hc
spec: 'example : ∀ {X : Type u} (M : MetricSpace X), M.toTopologicalSpace.IsT3 := _root_.GeneralTopology.MetricSpace.isT3'
preamble: |
  universe u v
  namespace GeneralTopology
  structure MetricSpace (X : Type u) where
    dist : X → X → ℝ
    dist_comm : ∀ {x y}, dist x y = dist y x
    dist_triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    dist_eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  theorem MetricSpace.dist_self {X : Type u} (M : MetricSpace X) {x : X} : M.dist x x = 0 :=
    M.dist_eq_zero.mpr rfl

  theorem MetricSpace.nonneg {X : Type u} (M : MetricSpace X) (x y : X) : 0 ≤ M.dist x y := by
    have h := M.dist_triangle x y x
    rw [M.dist_self] at h
    have e : M.dist y x = M.dist x y := M.dist_comm
    rw [e] at h
    linarith

  def MetricSpace.ball {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) : Set X :=
    {y | M.dist x y < ε}

  theorem MetricSpace.mem_ball {X : Type u} (M : MetricSpace X) {x y : X} {ε : ℝ} :
      y ∈ M.ball x ε ↔ M.dist x y < ε := Iff.rfl

  theorem MetricSpace.mem_ball_self {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) (h : 0 < ε) :
      x ∈ M.ball x ε := by
    rw [M.mem_ball, M.dist_self]
    exact h

  def MetricSpace.IsOpenSet {X : Type u} (M : MetricSpace X) (U : Set X) : Prop :=
    ∀ x ∈ U, ∃ ε > 0, M.ball x ε ⊆ U

  theorem MetricSpace.isOpenSet_ball {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) :
      M.IsOpenSet (M.ball x ε) := by
    intro y hy
    rw [M.mem_ball] at hy
    refine ⟨ε - M.dist x y, by linarith, ?_⟩
    intro z hz
    rw [M.mem_ball] at hz ⊢
    have h := M.dist_triangle x y z
    linarith

  theorem MetricSpace.isOpenSet_univ {X : Type u} (M : MetricSpace X) : M.IsOpenSet (Set.univ : Set X)
      :=
    fun _ _ => ⟨1, one_pos, fun _ _ => trivial⟩

  theorem MetricSpace.isOpenSet_inter {X : Type u} (M : MetricSpace X) {U V : Set X}
      (hU : M.IsOpenSet U) (hV : M.IsOpenSet V) : M.IsOpenSet (U ∩ V) := by
    intro x hx
    obtain ⟨a, ha, hau⟩ := hU x hx.1
    obtain ⟨b, hb, hbv⟩ := hV x hx.2
    refine ⟨min a b, lt_min ha hb, ?_⟩
    intro y hy
    rw [M.mem_ball] at hy
    exact ⟨hau (lt_of_lt_of_le hy (min_le_left a b)), hbv (lt_of_lt_of_le hy (min_le_right a b))⟩

  theorem MetricSpace.isOpenSet_sUnion {X : Type u} (M : MetricSpace X) {F : Set (Set X)}
      (h : ∀ U ∈ F, M.IsOpenSet U) : M.IsOpenSet (⋃₀ F) := by
    intro x hx
    obtain ⟨U, hUF, hxU⟩ := hx
    obtain ⟨ε, hε, hsub⟩ := h U hUF x hxU
    exact ⟨ε, hε, fun y hy => ⟨U, hUF, hsub hy⟩⟩

  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def MetricSpace.toTopologicalSpace {X : Type u} (M : MetricSpace X) : TopologicalSpace X where
    IsOpen := M.IsOpenSet
    isOpen_univ := M.isOpenSet_univ
    isOpen_inter := M.isOpenSet_inter
    isOpen_sUnion := M.isOpenSet_sUnion

  def TopologicalSpace.IsClosed {X : Type u} (T : TopologicalSpace X) (C : Set X) : Prop
      := T.IsOpen Cᶜ

  def TopologicalSpace.IsT1 {X : Type u} (T : TopologicalSpace X) : Prop :=
    ∀ x y : X, x ≠ y → ∃ U, T.IsOpen U ∧ x ∈ U ∧ y ∉ U

  def TopologicalSpace.IsT2 {X : Type u} (T : TopologicalSpace X) : Prop :=
    ∀ x y : X, x ≠ y → ∃ U V, T.IsOpen U ∧ T.IsOpen V ∧ x ∈ U ∧ y ∈ V ∧ U ∩ V = ∅

  theorem TopologicalSpace.isT1_of_isT2 {X : Type u} {T : TopologicalSpace X} (h : T.IsT2) :
      T.IsT1 := by
    intro x y hxy
    obtain ⟨U, V, hU, hV, hxU, hyV, hUV⟩ := h x y hxy
    refine ⟨U, hU, hxU, ?_⟩
    intro hyU
    have hy : y ∈ U ∩ V := ⟨hyU, hyV⟩
    rw [hUV] at hy
    exact hy

  theorem MetricSpace.dist_pos {X : Type u} (M : MetricSpace X) {x y : X} (h : x ≠ y) : 0 < M.dist x y
      := by
    rcases lt_or_eq_of_le (MetricSpace.nonneg M x y) with hlt | heq
    · exact hlt
    · exact absurd (M.dist_eq_zero.mp heq.symm) h

  theorem MetricSpace.isT2 {X : Type u} (M : MetricSpace X) : M.toTopologicalSpace.IsT2 := by
    intro x y hxy
    have h0 : 0 < M.dist x y := MetricSpace.dist_pos M hxy
    refine ⟨M.ball x (M.dist x y / 2), M.ball y (M.dist x y / 2), MetricSpace.isOpenSet_ball M x _,
      MetricSpace.isOpenSet_ball M y _, MetricSpace.mem_ball_self M x _ (by linarith),
      MetricSpace.mem_ball_self M y _ (by linarith), ?_⟩
    apply Set.eq_empty_of_forall_notMem
    rintro z ⟨hz1, hz2⟩
    rw [MetricSpace.mem_ball M] at hz1 hz2
    have e : M.dist y z = M.dist z y := M.dist_comm
    have ht := M.dist_triangle x z y
    linarith

  def TopologicalSpace.IsT3 {X : Type u} (T : TopologicalSpace X) : Prop :=
    T.IsT1 ∧ ∀ (x : X) (C : Set X), T.IsClosed C → x ∉ C →
      ∃ U V, T.IsOpen U ∧ T.IsOpen V ∧ x ∈ U ∧ C ⊆ V ∧ U ∩ V = ∅

  end GeneralTopology
  open GeneralTopology
description: Show that `M.toTopologicalSpace.IsT3`. The T₁ half is the Hausdorff problem read through the implications. Write the union as `⋃₀ {B | ∃ c ∈ C, B = M.ball c (ε / 2)}`, whose openness is `MetricSpace.isOpenSet_sUnion` once a member is taken apart by `rintro B ⟨c, _, rfl⟩`; `M.dist_triangle x z c` and `M.dist_comm` then feed `linarith`.
