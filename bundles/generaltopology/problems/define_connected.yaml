reference: |-
  def TopologicalSpace.IsPreconnectedSpace {X : Type u} (T : TopologicalSpace X) : Prop :=
    ∀ S, T.IsOpen S → T.IsClosed S → S = ∅ ∨ S = Set.univ

  def TopologicalSpace.IsPreconnected {X : Type u} (T : TopologicalSpace X) (S : Set X) : Prop :=
    ∀ U V, T.IsOpen U → T.IsOpen V → (∀ x ∈ S, x ∈ U → x ∉ V) → S ⊆ U ∪ V → S ⊆ U ∨ S ⊆ V
spec: |-
  example {X : Type u} (T : TopologicalSpace X) : _root_.GeneralTopology.TopologicalSpace.IsPreconnectedSpace T ↔ (∀ S, T.IsOpen S → T.IsClosed S → S = ∅ ∨ S = Set.univ) := by unfold _root_.GeneralTopology.TopologicalSpace.IsPreconnectedSpace; first | exact Iff.rfl | grind
  example {X : Type u} (T : TopologicalSpace X) (S : Set X) : _root_.GeneralTopology.TopologicalSpace.IsPreconnected T S ↔ (∀ U V, T.IsOpen U → T.IsOpen V → (∀ x ∈ S, x ∈ U → x ∉ V) → S ⊆ U ∪ V → S ⊆ U ∨ S ⊆ V) := by unfold _root_.GeneralTopology.TopologicalSpace.IsPreconnected; first | exact Iff.rfl | grind
  example (X : Type) (T : TopologicalSpace X) (S : Set X) :
      (T.IsPreconnectedSpace ↔ ∀ C, T.IsOpen C → T.IsClosed C → C = ∅ ∨ C = Set.univ)
        ∧ (T.IsPreconnected S ↔ ∀ U V, T.IsOpen U → T.IsOpen V → (∀ x ∈ S, x ∈ U → x ∉ V) →
            S ⊆ U ∪ V → S ⊆ U ∨ S ⊆ V) :=
    ⟨Iff.rfl, Iff.rfl⟩
preamble: |
  universe u v
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.IsClosed {X : Type u} (T : TopologicalSpace X) (C : Set X) : Prop
      := T.IsOpen Cᶜ

  end GeneralTopology
  open GeneralTopology
description: 'Define `TopologicalSpace.IsPreconnectedSpace`, which says of a set that is open and closed — the two taken as separate hypotheses — that it is `∅` or `Set.univ`, the two disjuncts in that order. Then define `TopologicalSpace.IsPreconnected T S`: for all `U` and `V` with `T.IsOpen U`, `T.IsOpen V`, no point of `S` in both (written `∀ x ∈ S, x ∈ U → x ∉ V`) and `S ⊆ U ∪ V`, either `S ⊆ U` or `S ⊆ V`. Mathlib spells both of these the same way, keeping `IsConnected` for a preconnected set that is also nonempty.'
