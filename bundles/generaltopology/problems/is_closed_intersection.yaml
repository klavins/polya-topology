slug: is_closed_intersection
kind: theorem
title: An Intersection of Closed Sets, However Many
statement: |-
  The union condition on open sets says that a union of any number of them is open. Its mirror says that an intersection of any number of closed sets is closed, and the proof is the union condition read through a complement.

  Complementing an intersection gives the union of the complements. Mathlib writes the collection of complements as `compl '' F`, the image of `F` under complementation, and `Set.compl_sInter` is the equation `(⋂₀ F)ᶜ = ⋃₀ (compl '' F)`. A member of an image arrives with the member it came from.
concepts:
- closed_families
stub: |-
  theorem TopologicalSpace.isClosed_sInter {X : Type u} (T : TopologicalSpace X) {F : Set (Set X)}
      (h : ∀ C ∈ F, T.IsClosed C) : T.IsClosed (⋂₀ F) := sorry
reference: |-
  theorem TopologicalSpace.isClosed_sInter {X : Type u} (T : TopologicalSpace X) {F : Set (Set X)}
      (h : ∀ C ∈ F, T.IsClosed C) : T.IsClosed (⋂₀ F) := by
    show T.IsOpen _
    rw [Set.compl_sInter]
    apply T.isOpen_sUnion
    rintro U ⟨C, hCF, rfl⟩
    exact h C hCF
spec: |-
  example : ∀ {X : Type u} (T : TopologicalSpace X) {F : Set (Set X)}
      (h : ∀ C ∈ F, T.IsClosed C), T.IsClosed (⋂₀ F) := _root_.GeneralTopology.TopologicalSpace.isClosed_sInter
preamble: |
  universe u
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.IsClosed {X : Type u} (T : TopologicalSpace X) (C : Set X) : Prop
      := T.IsOpen Cᶜ

  end GeneralTopology
  open GeneralTopology
description: Show that `⋂₀ F` is closed when every member of `F` is. `show T.IsOpen _`, rewrite with `Set.compl_sInter`, and apply the union condition; its hypothesis takes a member of the image, which `rintro U ⟨C, hCF, rfl⟩` breaks into the set `C` it came from.
