reference: |-
  theorem TopologicalSpace.continuous_into_subspace {X : Type u} {Z : Type v} (T : TopologicalSpace X)
      (A : Set X)
      (S : TopologicalSpace Z) (g : Z → A) :
      S.Continuous (T.subspace A) g ↔ S.Continuous T (Subtype.val ∘ g) := by
    constructor
    · intro hg
      exact TopologicalSpace.continuous_comp S hg (TopologicalSpace.continuous_subspace_val T A)
    · intro hg U hU
      obtain ⟨V, hV, rfl⟩ := hU
      rw [← Set.preimage_comp]
      exact hg V hV
spec: |-
  example : ∀ {X : Type u} {Z : Type v} (T : TopologicalSpace X)
      (A : Set X)
      (S : TopologicalSpace Z) (g : Z → A), S.Continuous (T.subspace A) g ↔ S.Continuous T (Subtype.val ∘ g) := _root_.GeneralTopology.TopologicalSpace.continuous_into_subspace
preamble: |
  universe u v w
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.subspace {X : Type u} (T : TopologicalSpace X) (A : Set X)
      : TopologicalSpace A where
    IsOpen := fun V => ∃ U, T.IsOpen U ∧ V = Subtype.val ⁻¹' U
    isOpen_univ := ⟨Set.univ, T.isOpen_univ, rfl⟩
    isOpen_inter := by
      rintro V W ⟨U, hU, rfl⟩ ⟨U', hU', rfl⟩
      exact ⟨U ∩ U', T.isOpen_inter hU hU', rfl⟩
    isOpen_sUnion := by
      intro F h
      refine ⟨⋃₀ {U | T.IsOpen U ∧ (Subtype.val ⁻¹' U : Set A) ∈ F},
        T.isOpen_sUnion (fun U hU => hU.1), ?_⟩
      apply Set.Subset.antisymm
      · rintro x ⟨V, hVF, hxV⟩
        obtain ⟨U, hU, rfl⟩ := h V hVF
        exact ⟨U, ⟨hU, hVF⟩, hxV⟩
      · rintro x ⟨U, ⟨hU, hUF⟩, hxU⟩
        exact ⟨_, hUF, hxU⟩

  def TopologicalSpace.Continuous {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      (f : X → Y) : Prop :=
    ∀ U, T'.IsOpen U → T.IsOpen (f ⁻¹' U)

  theorem TopologicalSpace.continuous_comp {X : Type u} {Y : Type v} {Z : Type w}
      (T : TopologicalSpace X)
      {T' : TopologicalSpace Y} {T'' : TopologicalSpace Z} {f : X → Y} {g : Y → Z}
      (hf : T.Continuous T' f) (hg : T'.Continuous T'' g) : T.Continuous T'' (g ∘ f) := by
    intro U hU
    rw [Set.preimage_comp]
    exact hf _ (hg U hU)

  theorem TopologicalSpace.continuous_subspace_val {X : Type u} (T : TopologicalSpace X) (A : Set X) :
      (T.subspace A).Continuous T Subtype.val :=
    fun U hU => ⟨U, hU, rfl⟩

  end GeneralTopology
  open GeneralTopology
description: Prove that `S.Continuous (T.subspace A) g` exactly when `S.Continuous T (Subtype.val ∘ g)`. Forwards, compose with `TopologicalSpace.continuous_subspace_val`. Backwards, take the open set apart with `obtain ⟨U, hU, rfl⟩` and fold the two preimages into one with `Set.preimage_comp`.
