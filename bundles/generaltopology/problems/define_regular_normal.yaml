  example {X : Type u} (T : TopologicalSpace X) : _root_.GeneralTopology.TopologicalSpace.IsT4 T ↔ (T.IsT1 ∧ ∀ C D : Set X, T.IsClosed C → T.IsClosed D → C ∩ D = ∅ →
      ∃ U V, T.IsOpen U ∧ T.IsOpen V ∧ C ⊆ U ∧ D ⊆ V ∧ U ∩ V = ∅) := by unfold _root_.GeneralTopology.TopologicalSpace.IsT4; first | exact Iff.rfl | grind
  example (X : Type) (T : TopologicalSpace X) :
      (T.IsT3 ↔ T.IsT1 ∧ ∀ (x : X) (C : Set X), T.IsClosed C → x ∉ C →
          ∃ U V, T.IsOpen U ∧ T.IsOpen V ∧ x ∈ U ∧ C ⊆ V ∧ U ∩ V = ∅)
        ∧ (T.IsT4 ↔ T.IsT1 ∧ ∀ C D : Set X, T.IsClosed C → T.IsClosed D → C ∩ D = ∅ →
          ∃ U V, T.IsOpen U ∧ T.IsOpen V ∧ C ⊆ U ∧ D ⊆ V ∧ U ∩ V = ∅) :=
    ⟨Iff.rfl, Iff.rfl⟩
preamble: |
  universe u v
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.IsClosed {X : Type u} (T : TopologicalSpace X) (C : Set X) : Prop
      := T.IsOpen Cᶜ

  def TopologicalSpace.IsT1 {X : Type u} (T : TopologicalSpace X) : Prop :=
    ∀ x y : X, x ≠ y → ∃ U, T.IsOpen U ∧ x ∈ U ∧ y ∉ U

  end GeneralTopology
  open GeneralTopology
description: 'Define `TopologicalSpace.IsT3` and `TopologicalSpace.IsT4`, each a conjunction whose first half is `T.IsT1`. The second half of the first quantifies over `x : X` and `C : Set X` with `T.IsClosed C` and `x ∉ C`, and asks for `U` and `V` with `T.IsOpen U`, `T.IsOpen V`, `x ∈ U`, `C ⊆ V`, `U ∩ V = ∅`, in that order. The second quantifies over `C D : Set X`, both closed, with `C ∩ D = ∅`, and asks for `C ⊆ U` and `D ⊆ V` in the corresponding places.'
