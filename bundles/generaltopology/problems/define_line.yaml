slug: define_line
kind: definition
title: The Metric on the Real Line
statement: |-
  How far apart are two real numbers? By `|x - y|`, the absolute value of their difference. Each of the three conditions is then a standard fact about the absolute value: `abs_sub_comm` gives symmetry, `abs_sub_le` gives the triangle inequality and is where its name comes from, and `abs_eq_zero` with `sub_eq_zero` gives non-degeneracy.

  To give a term of a structure type is to give each of its fields, which Lean writes with `where`:
  ```lean
  def someMetric : Metric ℝ where
    dist x y := ...
    symm {x y} := ...
    triangle x y z := ...
    eq_zero {x y} := ...
  ```
  The first field is a definition; the other three are proofs, written as terms or opened with `by`.
concepts:
- real_line
stub: 'def line : Metric ℝ := sorry'
reference: |-
  def line : Metric ℝ where
    dist x y := |x - y|
    symm {x y} := abs_sub_comm x y
    triangle x y z := abs_sub_le x y z
    eq_zero {x y} := by rw [abs_eq_zero, sub_eq_zero]
spec: 'example (x y : ℝ) : _root_.GeneralTopology.line.dist x y = |x - y| := rfl'
preamble: |
  universe u
  namespace GeneralTopology
  structure Metric (X : Type u) where
    dist : X → X → ℝ
    symm : ∀ {x y}, dist x y = dist y x
    triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  end GeneralTopology
  open GeneralTopology
description: Define `line`, the real numbers with `dist x y = |x - y|`. Three fields are the facts named above at the right arguments; for the fourth, rewriting with `abs_eq_zero` and then `sub_eq_zero` leaves a goal that `rw` closes by itself.
