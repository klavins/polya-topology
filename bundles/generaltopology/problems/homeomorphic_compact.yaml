preamble: |
  universe u v w
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.Continuous {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      (f : X → Y) : Prop :=
    ∀ U, T'.IsOpen U → T.IsOpen (f ⁻¹' U)

  structure Homeomorph {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y) where
    toFun : X → Y
    invFun : Y → X
    left_inv : ∀ x, invFun (toFun x) = x
    right_inv : ∀ y, toFun (invFun y) = y
    continuous_toFun : T.Continuous T' toFun
    continuous_invFun : T'.Continuous T invFun

  theorem Homeomorph.surjective {X : Type u} {Y : Type v} {T : TopologicalSpace X}
      {T' : TopologicalSpace Y}
      (h : Homeomorph T T') : Function.Surjective h.toFun :=
    fun y => ⟨h.invFun y, h.right_inv y⟩

  def Homeomorphic {X : Type u} {Y : Type v} (T : TopologicalSpace X) (T' : TopologicalSpace Y) : Prop
      :=
    Nonempty (Homeomorph T T')

  def TopologicalSpace.IsCompact {X : Type u} (T : TopologicalSpace X) (S : Set X) : Prop :=
    ∀ F : Set (Set X), (∀ U ∈ F, T.IsOpen U) → S ⊆ ⋃₀ F →
      ∃ G ⊆ F, G.Finite ∧ S ⊆ ⋃₀ G

  def TopologicalSpace.IsCompactSpace {X : Type u} (T : TopologicalSpace X) : Prop
      := T.IsCompact Set.univ

  theorem TopologicalSpace.isCompact_image {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      {T' : TopologicalSpace Y}
      {f : X → Y} (hf : T.Continuous T' f) {S : Set X} (hS : T.IsCompact S) :
      T'.IsCompact (f '' S) := by
    intro F hFo hcov
    have hpre : S ⊆ ⋃₀ {V | ∃ U ∈ F, V = f ⁻¹' U} := by
      intro x hxS
      obtain ⟨U, hUF, hxU⟩ := hcov ⟨x, hxS, rfl⟩
      exact ⟨f ⁻¹' U, ⟨U, hUF, rfl⟩, hxU⟩
    obtain ⟨G, hGF, hGfin, hGcov⟩ := hS {V | ∃ U ∈ F, V = f ⁻¹' U}
      (by rintro V ⟨U, hUF, rfl⟩; exact hf U (hFo U hUF)) hpre
    refine ⟨{U | ∃ V, ∃ hV : V ∈ G, (hGF hV).choose = U}, ?_, hGfin.dependent_image _, ?_⟩
    · rintro U ⟨V, hV, rfl⟩
      exact (hGF hV).choose_spec.1
    · rintro y ⟨x, hxS, rfl⟩
      obtain ⟨V, hVG, hxV⟩ := hGcov hxS
      rw [(hGF hVG).choose_spec.2] at hxV
      exact ⟨(hGF hVG).choose, ⟨V, hVG, rfl⟩, hxV⟩

  end GeneralTopology
  open GeneralTopology
description: Show `Homeomorphic.isCompactSpace`. `obtain ⟨e⟩` opens the existence of a homeomorphism, and `Set.image_univ` with `Set.range_eq_univ` turns the image of the whole space into the whole space, which is where `Homeomorph.surjective` is wanted.
