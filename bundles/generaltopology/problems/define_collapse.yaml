description: Define `collapse A`, whose relation is `fun x y => x = y ∨ (x ∈ A ∧ y ∈ A)`, in that order. Give the three fields of `Equivalence` as an anonymous constructor; a pattern such as `rintro x y (rfl | ⟨hx, hy⟩)` splits a hypothesis, and substituting the equality leaves the other disjunct to offer.
