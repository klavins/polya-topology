reference: |-
  theorem MetricSpace.continuous_of_seq {X : Type u} {Y : Type v} (M : MetricSpace X)
      (N : MetricSpace Y)
      {f : X → Y}
      (h : ∀ (x : ℕ → X) (a : X), M.ConvergesTo x a → N.ConvergesTo (fun n => f (x n)) (f a)) :
      M.Continuous N f := by
    intro a ε hε
    by_contra hcon
    push Not at hcon
    have hpt : ∀ n : ℕ, ∃ y, M.dist a y < 1 / ((n : ℝ) + 1) ∧ ε ≤ N.dist (f a) (f y) :=
      fun n => hcon _ (one_div_succ_pos n)
    have hconv : M.ConvergesTo (fun n => (hpt n).choose) a := by
      intro δ hδ
      obtain ⟨k, hk⟩ := exists_one_div_succ_lt hδ
      exact ⟨k, fun n hn => lt_trans (hpt n).choose_spec.1 (hk n hn)⟩
    obtain ⟨k, hk⟩ := h _ a hconv ε hε
    exact absurd (hk k (le_refl k)) (not_lt.mpr (hpt k).choose_spec.2)
spec: |-
  example : ∀ {X : Type u} {Y : Type v} (M : MetricSpace X)
      (N : MetricSpace Y)
      {f : X → Y}
      (h : ∀ (x : ℕ → X) (a : X), M.ConvergesTo x a → N.ConvergesTo (fun n => f (x n)) (f a)), M.Continuous N f := _root_.GeneralTopology.MetricSpace.continuous_of_seq
preamble: |
  universe u v w
  namespace GeneralTopology
  structure MetricSpace (X : Type u) where
    dist : X → X → ℝ
    dist_comm : ∀ {x y}, dist x y = dist y x
    dist_triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    dist_eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  def MetricSpace.ContinuousAt {X : Type u} {Y : Type v} (M : MetricSpace X) (N : MetricSpace Y)
      (f : X → Y)
      (x : X) : Prop :=
    ∀ ε > 0, ∃ δ > 0, ∀ x', M.dist x x' < δ → N.dist (f x) (f x') < ε

  def MetricSpace.Continuous {X : Type u} {Y : Type v} (M : MetricSpace X) (N : MetricSpace Y)
      (f : X → Y) : Prop :=
    ∀ x, M.ContinuousAt N f x

  def MetricSpace.ConvergesTo {X : Type u} (M : MetricSpace X) (x : ℕ → X) (a : X) : Prop :=
    ∀ ε > 0, ∃ k : ℕ, ∀ n ≥ k, M.dist a (x n) < ε

  theorem one_div_succ_pos (n : ℕ) : 0 < 1 / ((n : ℝ) + 1) := by
    have h : (0 : ℝ) ≤ (n : ℝ) := Nat.cast_nonneg n
    exact div_pos one_pos (by linarith)

  theorem exists_one_div_succ_lt {ε : ℝ} (hε : 0 < ε) :
      ∃ k : ℕ, ∀ n ≥ k, 1 / ((n : ℝ) + 1) < ε := by
    obtain ⟨k, hk⟩ := exists_nat_gt (1 / ε)
    refine ⟨k, fun n hn => ?_⟩
    have h1 : (k : ℝ) ≤ (n : ℝ) := Nat.cast_le.mpr hn
    have h2 : (0 : ℝ) ≤ (n : ℝ) := Nat.cast_nonneg n
    have h3 : 1 / ε < (n : ℝ) + 1 := by linarith
    rw [div_lt_iff₀ (by linarith : (0 : ℝ) < (n : ℝ) + 1)]
    rw [div_lt_iff₀ hε] at h3
    linarith

  end GeneralTopology
  open GeneralTopology
description: Prove `MetricSpace.continuous_of_seq`. `intro a ε hε` leaves a goal about `δ`; `by_contra` and `push Not` turn its denial into the family of bad points, out of which `Exists.choose` builds the sequence, and `not_lt` closes the contradiction at the end.
