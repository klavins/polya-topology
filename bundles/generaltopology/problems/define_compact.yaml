reference: |-
  def TopologicalSpace.IsCompact {X : Type u} (T : TopologicalSpace X) (S : Set X) : Prop :=
    ∀ F : Set (Set X), (∀ U ∈ F, T.IsOpen U) → S ⊆ ⋃₀ F →
      ∃ G ⊆ F, G.Finite ∧ S ⊆ ⋃₀ G

  def TopologicalSpace.IsCompactSpace {X : Type u} (T : TopologicalSpace X) : Prop
      := T.IsCompact Set.univ
spec: |-
  example {X : Type u} (T : TopologicalSpace X) (S : Set X) : _root_.GeneralTopology.TopologicalSpace.IsCompact T S ↔ (∀ F : Set (Set X), (∀ U ∈ F, T.IsOpen U) → S ⊆ ⋃₀ F →
      ∃ G ⊆ F, G.Finite ∧ S ⊆ ⋃₀ G) := by unfold _root_.GeneralTopology.TopologicalSpace.IsCompact; first | exact Iff.rfl | grind
  example {X : Type u} (T : TopologicalSpace X) : _root_.GeneralTopology.TopologicalSpace.IsCompactSpace T ↔ (T.IsCompact Set.univ) := by unfold _root_.GeneralTopology.TopologicalSpace.IsCompactSpace; first | exact Iff.rfl | grind
  example (X : Type) (T : TopologicalSpace X) (S : Set X) :
      (T.IsCompact S ↔ ∀ F : Set (Set X), (∀ U ∈ F, T.IsOpen U) → S ⊆ ⋃₀ F →
          ∃ G ⊆ F, G.Finite ∧ S ⊆ ⋃₀ G)
        ∧ (T.IsCompactSpace ↔ T.IsCompact Set.univ) :=
    ⟨Iff.rfl, Iff.rfl⟩
preamble: |
  universe u v
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  end GeneralTopology
  open GeneralTopology
description: 'Define `TopologicalSpace.IsCompact T S`: for every `F : Set (Set X)` whose members are all open, if `S ⊆ ⋃₀ F` then some `G ⊆ F` has `G.Finite` and `S ⊆ ⋃₀ G`, those two conjuncts in that order. Then define `TopologicalSpace.IsCompactSpace` as `T.IsCompact Set.univ`. Both containments are written `⊆`, not as equations.'
