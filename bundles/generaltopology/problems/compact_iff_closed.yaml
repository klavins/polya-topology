reference: |-
  theorem Topology.isCompactSet_iff_isClosed {X : Type u} (T : Topology X) (hX : T.IsCompact)
      (hT : T.IsHausdorff) (K : Set X) : T.IsCompactSet K ↔ T.IsClosed K :=
    ⟨fun h => Topology.isClosed_of_isCompactSet T hT h,
