      (x : X) : _root_.GeneralTopology.Topology.ContinuousAt T T' f x ↔ (∀ N, T'.IsNbhd (f x) N → T.IsNbhd x (f ⁻¹' N)) := by unfold _root_.GeneralTopology.Topology.ContinuousAt; first | exact Iff.rfl | grind
  example (X Y : Type) (T : Topology X) (T' : Topology Y) (f : X → Y) (x : X) :
      T.ContinuousAt T' f x ↔ ∀ N, T'.IsNbhd (f x) N → T.IsNbhd x (f ⁻¹' N) := Iff.rfl
preamble: |
  universe u v w
  namespace GeneralTopology
  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def Topology.IsNbhd {X : Type u} (T : Topology X) (x : X) (N : Set X) : Prop :=
    ∃ U, T.IsOpen U ∧ x ∈ U ∧ U ⊆ N

  end GeneralTopology
  open GeneralTopology
