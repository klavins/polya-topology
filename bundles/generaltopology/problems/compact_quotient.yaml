reference: |-
  theorem TopologicalSpace.eq_coinduced_of_compact {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y) (hX : T.IsCompactSpace) (hY : T'.IsT2) {f : X → Y}
      (hf : T.Continuous T' f) (hsurj : Function.Surjective f) : T' = T.coinduced f := by
    apply TopologicalSpace.eq_of_isOpen_iff
    intro U
    refine ⟨fun hU => hf U hU, fun hU => ?_⟩
    have hc : T.IsClosed (f ⁻¹' Uᶜ) := by
      show T.IsOpen _
      rw [Set.preimage_compl, compl_compl]
      exact hU
    have h := TopologicalSpace.isClosedMap_of_compact T T' hX hY hf _ hc
    rw [Set.image_preimage_eq _ hsurj] at h
    have h2 : T'.IsOpen Uᶜᶜ := h
    rwa [compl_compl] at h2
spec: |-
  example : ∀ {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y) (hX : T.IsCompactSpace) (hY : T'.IsT2) {f : X → Y}
      (hf : T.Continuous T' f) (hsurj : Function.Surjective f), T' = T.coinduced f := _root_.GeneralTopology.TopologicalSpace.eq_coinduced_of_compact
preamble: |
  universe u v w
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.IsClosed {X : Type u} (T : TopologicalSpace X) (C : Set X) : Prop
      := T.IsOpen Cᶜ

  def TopologicalSpace.IsNbhd {X : Type u} (T : TopologicalSpace X) (x : X) (N : Set X) : Prop :=
    ∃ U, T.IsOpen U ∧ x ∈ U ∧ U ⊆ N

  theorem TopologicalSpace.nbhd_of_isOpen {X : Type u} (T : TopologicalSpace X) {U : Set X}
      (hU : T.IsOpen U) {x : X} (hx : x ∈ U) : T.IsNbhd x U :=
    ⟨U, hU, hx, subset_rfl⟩

  theorem TopologicalSpace.union_of_opens_inside {X : Type u} (T : TopologicalSpace X) (U : Set X)
      (h : ∀ x ∈ U, T.IsNbhd x U) : U = ⋃₀ {V | T.IsOpen V ∧ V ⊆ U} := by
    apply Set.Subset.antisymm
    · intro x hx
      obtain ⟨V, hV, hxV, hVU⟩ := h x hx
      exact ⟨V, ⟨hV, hVU⟩, hxV⟩
    · rintro x ⟨V, ⟨_, hVU⟩, hxV⟩
      exact hVU hxV

  theorem TopologicalSpace.isOpen_iff_nbhd {X : Type u} (T : TopologicalSpace X) (U : Set X) :
      T.IsOpen U ↔ ∀ x ∈ U, T.IsNbhd x U := by
    constructor
    · intro hU x hx
      exact T.nbhd_of_isOpen hU hx
    · intro h
      rw [T.union_of_opens_inside U h]
      exact T.isOpen_sUnion (fun V hV => hV.1)

  def TopologicalSpace.Continuous {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      (f : X → Y) : Prop :=
    ∀ U, T'.IsOpen U → T.IsOpen (f ⁻¹' U)

  def TopologicalSpace.IsClosedMap {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      (f : X → Y) : Prop :=
    ∀ C, T.IsClosed C → T'.IsClosed (f '' C)

  theorem TopologicalSpace.eq_of_isOpen_iff {X : Type u} {T T' : TopologicalSpace X}
      (h : ∀ U, T.IsOpen U ↔ T'.IsOpen U) : T = T' := by
    obtain ⟨o, hu, hi, hs⟩ := T
    obtain ⟨o', hu', hi', hs'⟩ := T'
    have e : o = o' := funext (fun U => propext (h U))
    subst e
    rfl

  theorem preimage_sUnion_image {X : Type u} {Y : Type v} (f : X → Y) (F : Set (Set Y)) :
      f ⁻¹' (⋃₀ F) = ⋃₀ (Set.preimage f '' F) := by
    apply Set.Subset.antisymm
    · rintro x ⟨V, hVF, hxV⟩
      exact ⟨f ⁻¹' V, ⟨V, hVF, rfl⟩, hxV⟩
    · rintro x ⟨W, ⟨V, hVF, rfl⟩, hxW⟩
      exact ⟨V, hVF, hxW⟩

  def TopologicalSpace.coinduced {X : Type u} {Y : Type v} (T : TopologicalSpace X) (f : X → Y)
      : TopologicalSpace Y where
    IsOpen := fun V => T.IsOpen (f ⁻¹' V)
    isOpen_univ := by
      rw [Set.preimage_univ]
      exact T.isOpen_univ
    isOpen_inter := by
      intro V W hV hW
      rw [Set.preimage_inter]
      exact T.isOpen_inter hV hW
    isOpen_sUnion := by
      intro F h
      rw [preimage_sUnion_image]
      refine T.isOpen_sUnion ?_
      rintro W ⟨V, hVF, rfl⟩
      exact h V hVF

  def TopologicalSpace.IsT2 {X : Type u} (T : TopologicalSpace X) : Prop :=
    ∀ x y : X, x ≠ y → ∃ U V, T.IsOpen U ∧ T.IsOpen V ∧ x ∈ U ∧ y ∈ V ∧ U ∩ V = ∅

  def TopologicalSpace.IsCompact {X : Type u} (T : TopologicalSpace X) (S : Set X) : Prop :=
    ∀ F : Set (Set X), (∀ U ∈ F, T.IsOpen U) → S ⊆ ⋃₀ F →
      ∃ G ⊆ F, G.Finite ∧ S ⊆ ⋃₀ G

  def TopologicalSpace.IsCompactSpace {X : Type u} (T : TopologicalSpace X) : Prop
      := T.IsCompact Set.univ

  theorem TopologicalSpace.isCompact_of_isClosed {X : Type u} (T : TopologicalSpace X)
      (hT : T.IsCompactSpace)
      {C : Set X} (hC : T.IsClosed C) : T.IsCompact C := by
    intro F hFo hcov
    have hopen : ∀ U ∈ insert Cᶜ F, T.IsOpen U := by
      rintro U (rfl | hU)
      exacts [hC, hFo U hU]
    have huniv : (Set.univ : Set X) ⊆ ⋃₀ insert Cᶜ F := by
      intro x _
      by_cases hxC : x ∈ C
      · obtain ⟨U, hUF, hxU⟩ := hcov hxC
        exact ⟨U, Set.mem_insert_of_mem _ hUF, hxU⟩
      · exact ⟨Cᶜ, Set.mem_insert _ _, hxC⟩
    obtain ⟨G, hGF, hGfin, hGcov⟩ := hT _ hopen huniv
    refine ⟨G ∩ F, Set.inter_subset_right, hGfin.subset Set.inter_subset_left, fun x hx => ?_⟩
    obtain ⟨U, hUG, hxU⟩ := hGcov (Set.mem_univ x)
    exact ⟨U, ⟨hUG, (hGF hUG).resolve_left (fun e => (e ▸ hxU) hx)⟩, hxU⟩

  theorem TopologicalSpace.isCompact_image {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      {T' : TopologicalSpace Y}
      {f : X → Y} (hf : T.Continuous T' f) {S : Set X} (hS : T.IsCompact S) :
      T'.IsCompact (f '' S) := by
    intro F hFo hcov
    have hpre : S ⊆ ⋃₀ {V | ∃ U ∈ F, V = f ⁻¹' U} := by
      intro x hxS
      obtain ⟨U, hUF, hxU⟩ := hcov ⟨x, hxS, rfl⟩
      exact ⟨f ⁻¹' U, ⟨U, hUF, rfl⟩, hxU⟩
    obtain ⟨G, hGF, hGfin, hGcov⟩ := hS {V | ∃ U ∈ F, V = f ⁻¹' U}
      (by rintro V ⟨U, hUF, rfl⟩; exact hf U (hFo U hUF)) hpre
    refine ⟨{U | ∃ V, ∃ hV : V ∈ G, (hGF hV).choose = U}, ?_, hGfin.dependent_image _, ?_⟩
    · rintro U ⟨V, hV, rfl⟩
      exact (hGF hV).choose_spec.1
    · rintro y ⟨x, hxS, rfl⟩
      obtain ⟨V, hVG, hxV⟩ := hGcov hxS
      rw [(hGF hVG).choose_spec.2] at hxV
      exact ⟨(hGF hVG).choose, ⟨V, hVG, rfl⟩, hxV⟩

  theorem TopologicalSpace.exists_nbhd_disjoint {X : Type u} (T : TopologicalSpace X) {A : Set X}
      {G : Set (Set X)} (hfin : G.Finite)
      (h : ∀ V ∈ G, ∃ U, T.IsOpen U ∧ A ⊆ U ∧ U ∩ V = ∅) :
      ∃ U, T.IsOpen U ∧ A ⊆ U ∧ U ∩ ⋃₀ G = ∅ := by
    induction G, hfin using Set.Finite.induction_on with
    | empty =>
      exact ⟨Set.univ, T.isOpen_univ, Set.subset_univ A, by rw [Set.sUnion_empty, Set.inter_empty]⟩
    | insert _ _ ih =>
      obtain ⟨U, hUo, hAU, hUV⟩ := h _ (Set.mem_insert _ _)
      obtain ⟨W, hWo, hAW, hWG⟩ := ih (fun V hV => h V (Set.mem_insert_of_mem _ hV))
      refine ⟨U ∩ W, T.isOpen_inter hUo hWo, Set.subset_inter hAU hAW, ?_⟩
      rw [Set.sUnion_insert]
      apply Set.eq_empty_of_forall_notMem
      rintro z ⟨⟨hzU, hzW⟩, hz⟩
      rcases hz with hz | hz
      · exact Set.eq_empty_iff_forall_notMem.mp hUV z ⟨hzU, hz⟩
      · exact Set.eq_empty_iff_forall_notMem.mp hWG z ⟨hzW, hz⟩

  theorem TopologicalSpace.separating_of_compact {X : Type u} (T : TopologicalSpace X)
      {A K : Set X} (hK : T.IsCompact K)
      (h : ∀ y ∈ K, ∃ U V, T.IsOpen U ∧ T.IsOpen V ∧ A ⊆ U ∧ y ∈ V ∧ U ∩ V = ∅) :
      ∃ U V, T.IsOpen U ∧ T.IsOpen V ∧ A ⊆ U ∧ K ⊆ V ∧ U ∩ V = ∅ := by
    obtain ⟨G, hGF, hGfin, hGcov⟩ := hK {W | T.IsOpen W ∧ ∃ U, T.IsOpen U ∧ A ⊆ U ∧ U ∩ W = ∅}
      (fun W hW => hW.1) (fun y hy => by
        obtain ⟨U, V, hU, hV, hAU, hyV, hUV⟩ := h y hy
        exact ⟨V, ⟨hV, U, hU, hAU, hUV⟩, hyV⟩)
    obtain ⟨U, hUo, hAU, hUG⟩ :=
      TopologicalSpace.exists_nbhd_disjoint T hGfin (fun W hW => (hGF hW).2)
    exact ⟨U, ⋃₀ G, hUo, T.isOpen_sUnion (fun W hW => (hGF hW).1), hAU, hGcov, hUG⟩

  theorem TopologicalSpace.exists_separating_point {X : Type u} (T : TopologicalSpace X)
      (hT : T.IsT2) {K : Set X} (hK : T.IsCompact K) {x : X} (hx : x ∉ K) :
      ∃ U V, T.IsOpen U ∧ T.IsOpen V ∧ x ∈ U ∧ K ⊆ V ∧ U ∩ V = ∅ := by
    obtain ⟨U, V, hU, hV, hxU, hKV, hUV⟩ :=
      TopologicalSpace.separating_of_compact (A := {x}) T hK (fun y hy => by
        obtain ⟨U, V, hU, hV, hxU, hyV, hUV⟩ := hT x y (fun e => hx (e ▸ hy))
        exact ⟨U, V, hU, hV, Set.singleton_subset_iff.mpr hxU, hyV, hUV⟩)
    exact ⟨U, V, hU, hV, hxU rfl, hKV, hUV⟩

  theorem TopologicalSpace.isClosed_of_isCompact {X : Type u} (T : TopologicalSpace X) (hT : T.IsT2)
      {K : Set X} (hK : T.IsCompact K) : T.IsClosed K := by
    show T.IsOpen Kᶜ
    rw [TopologicalSpace.isOpen_iff_nbhd T]
    intro x hx
    obtain ⟨U, V, hU, _, hxU, hKV, hUV⟩ :=
      TopologicalSpace.exists_separating_point T hT hK hx
    exact ⟨U, hU, hxU, fun z hzU hzK => Set.eq_empty_iff_forall_notMem.mp hUV z ⟨hzU, hKV hzK⟩⟩

  theorem TopologicalSpace.isClosedMap_of_compact {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y) (hX : T.IsCompactSpace) (hY : T'.IsT2) {f : X → Y}
      (hf : T.Continuous T' f) : T.IsClosedMap T' f := fun _ hC =>
    TopologicalSpace.isClosed_of_isCompact T' hY
      (TopologicalSpace.isCompact_image T hf (TopologicalSpace.isCompact_of_isClosed T hX hC))

  end GeneralTopology
  open GeneralTopology
description: Prove `TopologicalSpace.eq_coinduced_of_compact`. `TopologicalSpace.eq_of_isOpen_iff` reduces an equality of topologies to an equivalence at each set, and `Set.image_preimage_eq` is where the surjectivity is spent.
