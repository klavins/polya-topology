reference: |-
  def Topology.ConvergesTo {X : Type u} (T : Topology X) (x : ℕ → X) (a : X) : Prop :=
    ∀ N, T.IsNbhd a N → ∃ k : ℕ, ∀ n ≥ k, x n ∈ N

  theorem Topology.convergesTo_const {X : Type u} (T : Topology X) (a : X) :
      T.ConvergesTo (fun _ => a) a := by
    rintro N ⟨U, _, haU, hUN⟩
    exact ⟨0, fun _ _ => hUN haU⟩
spec: |-
  example {X : Type u} (T : Topology X) (x : ℕ → X) (a : X) : _root_.GeneralTopology.Topology.ConvergesTo T x a ↔ (∀ N, T.IsNbhd a N → ∃ k : ℕ, ∀ n ≥ k, x n ∈ N) := by unfold _root_.GeneralTopology.Topology.ConvergesTo; first | exact Iff.rfl | grind
  example : ∀ {X : Type u} (T : Topology X) (a : X), T.ConvergesTo (fun _ => a) a := _root_.GeneralTopology.Topology.convergesTo_const
  example (X : Type) (T : Topology X) (x : ℕ → X) (a : X) :
      T.ConvergesTo x a ↔ ∀ N, T.IsNbhd a N → ∃ k : ℕ, ∀ n ≥ k, x n ∈ N := Iff.rfl
preamble: |
  universe u v
  namespace GeneralTopology
  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def Topology.IsNbhd {X : Type u} (T : Topology X) (x : X) (N : Set X) : Prop :=
    ∃ U, T.IsOpen U ∧ x ∈ U ∧ U ⊆ N

  end GeneralTopology
  open GeneralTopology
description: 'Define `Topology.ConvergesTo`, taking a topology `T` on `X`, a sequence `x : ℕ → X` and a point `a`: for every `N` with `T.IsNbhd a N` there is a `k : ℕ` with `x n ∈ N` for every `n ≥ k`. Then prove `Topology.convergesTo_const`, for which `rintro` takes the neighbourhood apart into the open set inside it.'
