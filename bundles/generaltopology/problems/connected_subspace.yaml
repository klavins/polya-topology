reference: |-
  theorem TopologicalSpace.isPreconnected_subspace {X : Type u} (T : TopologicalSpace X) {A : Set X}
      (h : T.IsPreconnected A) : (T.subspace A).IsPreconnectedSpace := by
    rintro W ⟨U, hU, rfl⟩ ⟨V, hV, hVeq⟩
    obtain ⟨hno, hcov⟩ := trace_split hVeq
    rcases h U V hU hV hno hcov with h0 | h0
    · exact Or.inr (trace_eq_univ_iff.mpr h0)
    · left
      have hu := trace_eq_univ_iff.mpr h0
      rw [← hVeq] at hu
      exact Set.compl_univ_iff.mp hu
spec: |-
  example : ∀ {X : Type u} (T : TopologicalSpace X) {A : Set X}
      (h : T.IsPreconnected A), (T.subspace A).IsPreconnectedSpace := _root_.GeneralTopology.TopologicalSpace.isPreconnected_subspace
preamble: |
  universe u v
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.IsClosed {X : Type u} (T : TopologicalSpace X) (C : Set X) : Prop
      := T.IsOpen Cᶜ

  def TopologicalSpace.subspace {X : Type u} (T : TopologicalSpace X) (A : Set X)
      : TopologicalSpace A where
    IsOpen := fun V => ∃ U, T.IsOpen U ∧ V = Subtype.val ⁻¹' U
    isOpen_univ := ⟨Set.univ, T.isOpen_univ, rfl⟩
    isOpen_inter := by
      rintro V W ⟨U, hU, rfl⟩ ⟨U', hU', rfl⟩
      exact ⟨U ∩ U', T.isOpen_inter hU hU', rfl⟩
    isOpen_sUnion := by
      intro F h
      refine ⟨⋃₀ {U | T.IsOpen U ∧ (Subtype.val ⁻¹' U : Set A) ∈ F},
        T.isOpen_sUnion (fun U hU => hU.1), ?_⟩
      apply Set.Subset.antisymm
      · rintro x ⟨V, hVF, hxV⟩
        obtain ⟨U, hU, rfl⟩ := h V hVF
        exact ⟨U, ⟨hU, hVF⟩, hxV⟩
      · rintro x ⟨U, ⟨hU, hUF⟩, hxU⟩
        exact ⟨_, hUF, hxU⟩

  def TopologicalSpace.IsPreconnectedSpace {X : Type u} (T : TopologicalSpace X) : Prop :=
    ∀ S, T.IsOpen S → T.IsClosed S → S = ∅ ∨ S = Set.univ

  def TopologicalSpace.IsPreconnected {X : Type u} (T : TopologicalSpace X) (S : Set X) : Prop :=
    ∀ U V, T.IsOpen U → T.IsOpen V → (∀ x ∈ S, x ∈ U → x ∉ V) → S ⊆ U ∪ V → S ⊆ U ∨ S ⊆ V

  theorem trace_eq_univ_iff {X : Type u} {A U : Set X} :
      (Subtype.val ⁻¹' U : Set A) = Set.univ ↔ A ⊆ U := by
    constructor
    · intro h x hx
      have hp : (⟨x, hx⟩ : A) ∈ (Subtype.val ⁻¹' U : Set A) := by rw [h]; trivial
      exact hp
    · intro h
      apply Set.eq_univ_of_forall
      intro p
      exact h p.2

  theorem trace_split {X : Type u} {A U V : Set X}
      (h : (Subtype.val ⁻¹' U : Set A)ᶜ = Subtype.val ⁻¹' V) :
      (∀ x ∈ A, x ∈ U → x ∉ V) ∧ A ⊆ U ∪ V := by
    constructor
    · intro x hxA hxU hxV
      have hp : (⟨x, hxA⟩ : A) ∈ (Subtype.val ⁻¹' V : Set A) := hxV
      rw [← h] at hp
      exact hp hxU
    · intro x hxA
      by_cases hxU : x ∈ U
      · exact Or.inl hxU
      · have hp : (⟨x, hxA⟩ : A) ∈ (Subtype.val ⁻¹' U : Set A)ᶜ := hxU
        rw [h] at hp
        exact Or.inr hp

  end GeneralTopology
  open GeneralTopology
description: Show that `T.IsPreconnected A` makes the subspace `A` a connected space. `rintro W ⟨U, hU, rfl⟩ ⟨V, hV, hVeq⟩` opens both hypotheses at once, naming the equation the closedness supplies, and `Set.compl_univ_iff` turns `Wᶜ = Set.univ` into `W = ∅`.
