reference: |-
  def MetricSpace.closedBall {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) : Set X :=
    {y | M.dist x y ≤ ε}

  def MetricSpace.sphere {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) : Set X :=
    {y | M.dist x y = ε}

  theorem MetricSpace.ball_subset_closedBall {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) :
      M.ball x ε ⊆ M.closedBall x ε := by
    intro y hy
    have h : M.dist x y < ε := hy
    show M.dist x y ≤ ε
    linarith
spec: |-
  example {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) : _root_.GeneralTopology.MetricSpace.closedBall M x ε = ({y | M.dist x y ≤ ε} : Set X) := rfl
  example {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) : _root_.GeneralTopology.MetricSpace.sphere M x ε = ({y | M.dist x y = ε} : Set X) := rfl
  example : ∀ {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ), M.ball x ε ⊆ M.closedBall x ε := _root_.GeneralTopology.MetricSpace.ball_subset_closedBall
  example (X : Type) (M : MetricSpace X) (x y : X) (ε : ℝ) :
      (y ∈ M.closedBall x ε ↔ M.dist x y ≤ ε) ∧ (y ∈ M.sphere x ε ↔ M.dist x y = ε) :=
    ⟨Iff.rfl, Iff.rfl⟩
preamble: |
  universe u
  namespace GeneralTopology
  structure MetricSpace (X : Type u) where
    dist : X → X → ℝ
    dist_comm : ∀ {x y}, dist x y = dist y x
    dist_triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    dist_eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  def MetricSpace.ball {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) : Set X :=
    {y | M.dist x y < ε}

  end GeneralTopology
  open GeneralTopology
description: 'Define `MetricSpace.closedBall` and `MetricSpace.sphere`, and then show that `M.ball x ε ⊆ M.closedBall x ε`. A containment is proved by introducing a point and a proof that it lies in the first set; `have h : M.dist x y < ε := hy` restates that proof as the inequality it already is, `show` does the same for the goal, and `linarith` closes the gap between `<` and `≤`.'
