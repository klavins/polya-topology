reference: |-
  theorem TopologicalSpace.isOpen_image_of_saturated {X : Type u} {Y : Type v}
      (T : TopologicalSpace X) (f : X → Y)
      {S : Set X} (hS : T.IsOpen S) (hsat : IsSaturated f S) : (T.coinduced f).IsOpen (f '' S) := by
    show T.IsOpen (f ⁻¹' (f '' S))
    rw [← hsat]
    exact hS
spec: |-
  example : ∀ {X : Type u} {Y : Type v}
      (T : TopologicalSpace X) (f : X → Y)
      {S : Set X} (hS : T.IsOpen S) (hsat : IsSaturated f S), (T.coinduced f).IsOpen (f '' S) := _root_.GeneralTopology.TopologicalSpace.isOpen_image_of_saturated
preamble: |
  universe u v w
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  theorem preimage_sUnion_image {X : Type u} {Y : Type v} (f : X → Y) (F : Set (Set Y)) :
      f ⁻¹' (⋃₀ F) = ⋃₀ (Set.preimage f '' F) := by
    apply Set.Subset.antisymm
    · rintro x ⟨V, hVF, hxV⟩
      exact ⟨f ⁻¹' V, ⟨V, hVF, rfl⟩, hxV⟩
    · rintro x ⟨W, ⟨V, hVF, rfl⟩, hxW⟩
      exact ⟨V, hVF, hxW⟩

  def TopologicalSpace.coinduced {X : Type u} {Y : Type v} (T : TopologicalSpace X) (f : X → Y)
      : TopologicalSpace Y where
    IsOpen := fun V => T.IsOpen (f ⁻¹' V)
    isOpen_univ := by
      rw [Set.preimage_univ]
      exact T.isOpen_univ
    isOpen_inter := by
      intro V W hV hW
      rw [Set.preimage_inter]
      exact T.isOpen_inter hV hW
    isOpen_sUnion := by
      intro F h
      rw [preimage_sUnion_image]
      refine T.isOpen_sUnion ?_
      rintro W ⟨V, hVF, rfl⟩
      exact h V hVF

  def IsSaturated {X : Type u} {Y : Type v} (f : X → Y) (S : Set X) : Prop :=
    S = f ⁻¹' (f '' S)

  end GeneralTopology
  open GeneralTopology
description: Show that `f '' S` is open in `T.coinduced f` when `S` is open and saturated for `f`. Restate the goal with `show`, rewrite backwards along the saturation, and the hypothesis is what remains.
