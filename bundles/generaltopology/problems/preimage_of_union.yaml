reference: |-
  theorem preimage_sUnion_image {X : Type u} {Y : Type v} (f : X → Y) (F : Set (Set Y)) :
      f ⁻¹' (⋃₀ F) = ⋃₀ (Set.preimage f '' F) := by
    apply Set.Subset.antisymm
    · rintro x ⟨V, hVF, hxV⟩
      exact ⟨f ⁻¹' V, ⟨V, hVF, rfl⟩, hxV⟩
    · rintro x ⟨W, ⟨V, hVF, rfl⟩, hxW⟩
      exact ⟨V, hVF, hxW⟩
spec: 'example : ∀ {X : Type u} {Y : Type v} (f : X → Y) (F : Set (Set Y)), f ⁻¹'' (⋃₀ F) = ⋃₀ (Set.preimage f '''' F) := _root_.GeneralTopology.preimage_sUnion_image'
preamble: |
  universe u v w
description: Prove that `f ⁻¹' (⋃₀ F) = ⋃₀ (Set.preimage f '' F)`. `Set.Subset.antisymm` splits the equality, and each direction takes a membership apart with `rintro` and offers the corresponding member of the other collection.
