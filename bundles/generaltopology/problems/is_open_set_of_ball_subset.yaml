reference: |-
  theorem MetricSpace.isOpenSet_of_ball_subset {X : Type u} {M N : MetricSpace X}
      (h : ∀ x ε, 0 < ε → ∃ δ > 0, N.ball x δ ⊆ M.ball x ε) {U : Set X}
      (hU : M.IsOpenSet U) : N.IsOpenSet U := by
    intro x hx
    obtain ⟨ε, hε, hsub⟩ := hU x hx
    obtain ⟨δ, hδ, hball⟩ := h x ε hε
    exact ⟨δ, hδ, fun y hy => hsub (hball hy)⟩
spec: |-
  example : ∀ {X : Type u} {M N : MetricSpace X}
      (h : ∀ x ε, 0 < ε → ∃ δ > 0, N.ball x δ ⊆ M.ball x ε) {U : Set X}
      (hU : M.IsOpenSet U), N.IsOpenSet U := _root_.GeneralTopology.MetricSpace.isOpenSet_of_ball_subset
preamble: |
  universe u v w
  namespace GeneralTopology
  structure MetricSpace (X : Type u) where
    dist : X → X → ℝ
    dist_comm : ∀ {x y}, dist x y = dist y x
    dist_triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    dist_eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  def MetricSpace.ball {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) : Set X :=
    {y | M.dist x y < ε}

  def MetricSpace.IsOpenSet {X : Type u} (M : MetricSpace X) (U : Set X) : Prop :=
    ∀ x ∈ U, ∃ ε > 0, M.ball x ε ⊆ U

  end GeneralTopology
  open GeneralTopology
description: Prove that `U` is open for `N` whenever it is open for `M`, given that every `M.ball x ε` with `ε > 0` contains some `N.ball x δ` with `δ > 0`. Take the radius `U`'s openness supplies, then the radius the hypothesis supplies for it, and offer the second; a point of the smaller ball travels through the larger one into `U`.
