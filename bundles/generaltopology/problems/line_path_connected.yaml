slug: line_path_connected
kind: theorem
title: The Line is Path-Connected
statement: |-
  Between two reals runs the straight path `t ↦ (y - x) t + x`, which is at `x` when `t` is `0` and at `y` when `t` is `1`. Restricted to the unit interval it is a path from the first point to the second.

  Its continuity is the affine map's, composed with the inclusion of the subspace in the line. One case has to be taken apart: the affine map's continuity was proved for a nonzero slope, so when `x` and `y` are the same point the path is a constant map and is continuous for that reason instead.
concepts:
- path_connected
stub: 'theorem line_isPathConnected : line.toTopology.IsPathConnected := sorry'
reference: |-
  theorem line_isPathConnected : line.toTopology.IsPathConnected := by
    intro x y
    refine ⟨fun p => (y - x) * p.val + x, ?_, ?_, ?_⟩
    · by_cases h : y - x = 0
      · have he : (fun p : unitInterval => (y - x) * p.val + x) = fun _ => x := by
          funext p; rw [h]; ring
        rw [he]
        exact Topology.continuous_const _ line.toTopology x
      · exact Topology.continuous_comp _
          (Topology.continuous_subspace_val line.toTopology unitInterval)
          (line_continuous_affine_top (y - x) x h)
    · show (y - x) * 0 + x = x
      ring
    · show (y - x) * 1 + x = y
      ring
spec: 'example : line.toTopology.IsPathConnected := _root_.GeneralTopology.line_isPathConnected'
preamble: |
  universe u v w
  namespace GeneralTopology
  structure Metric (X : Type u) where
    dist : X → X → ℝ
    symm : ∀ {x y}, dist x y = dist y x
    triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  theorem Metric.dist_self {X : Type u} (M : Metric X) {x : X} : M.dist x x = 0 :=
    M.eq_zero.mpr rfl

  def line : Metric ℝ where
    dist x y := |x - y|
    symm {x y} := abs_sub_comm x y
    triangle x y z := abs_sub_le x y z
    eq_zero {x y} := by rw [abs_eq_zero, sub_eq_zero]

  def Metric.ball {X : Type u} (M : Metric X) (x : X) (ε : ℝ) : Set X :=
    {y | M.dist x y < ε}

  theorem Metric.mem_ball {X : Type u} (M : Metric X) {x y : X} {ε : ℝ} :
      y ∈ M.ball x ε ↔ M.dist x y < ε := Iff.rfl

  theorem Metric.mem_ball_self {X : Type u} (M : Metric X) (x : X) (ε : ℝ) (h : 0 < ε) :
      x ∈ M.ball x ε := by
    rw [M.mem_ball, M.dist_self]
    exact h

  def Metric.IsOpenSet {X : Type u} (M : Metric X) (U : Set X) : Prop :=
    ∀ x ∈ U, ∃ ε > 0, M.ball x ε ⊆ U

  theorem Metric.isOpenSet_ball {X : Type u} (M : Metric X) (x : X) (ε : ℝ) :
      M.IsOpenSet (M.ball x ε) := by
    intro y hy
    rw [M.mem_ball] at hy
    refine ⟨ε - M.dist x y, by linarith, ?_⟩
    intro z hz
    rw [M.mem_ball] at hz ⊢
    have h := M.triangle x y z
    linarith

  theorem Metric.isOpenSet_univ {X : Type u} (M : Metric X) : M.IsOpenSet (Set.univ : Set X) :=
    fun _ _ => ⟨1, one_pos, fun _ _ => trivial⟩

  theorem Metric.isOpenSet_inter {X : Type u} (M : Metric X) {U V : Set X}
      (hU : M.IsOpenSet U) (hV : M.IsOpenSet V) : M.IsOpenSet (U ∩ V) := by
    intro x hx
    obtain ⟨a, ha, hau⟩ := hU x hx.1
    obtain ⟨b, hb, hbv⟩ := hV x hx.2
    refine ⟨min a b, lt_min ha hb, ?_⟩
    intro y hy
    rw [M.mem_ball] at hy
    exact ⟨hau (lt_of_lt_of_le hy (min_le_left a b)), hbv (lt_of_lt_of_le hy (min_le_right a b))⟩

  theorem Metric.isOpenSet_sUnion {X : Type u} (M : Metric X) {F : Set (Set X)}
      (h : ∀ U ∈ F, M.IsOpenSet U) : M.IsOpenSet (⋃₀ F) := by
    intro x hx
    obtain ⟨U, hUF, hxU⟩ := hx
    obtain ⟨ε, hε, hsub⟩ := h U hUF x hxU
    exact ⟨ε, hε, fun y hy => ⟨U, hUF, hsub hy⟩⟩

  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  theorem Topology.empty {X : Type u} (T : Topology X) : T.IsOpen (∅ : Set X) := by
    have h : T.IsOpen (⋃₀ (∅ : Set (Set X))) := T.sUnion (fun _ hU => hU.elim)
    rwa [Set.sUnion_empty] at h

  def Metric.toTopology {X : Type u} (M : Metric X) : Topology X where
    IsOpen := M.IsOpenSet
    univ := M.isOpenSet_univ
    inter := M.isOpenSet_inter
    sUnion := M.isOpenSet_sUnion

  def Topology.subspace {X : Type u} (T : Topology X) (A : Set X) : Topology A where
    IsOpen := fun V => ∃ U, T.IsOpen U ∧ V = Subtype.val ⁻¹' U
    univ := ⟨Set.univ, T.univ, rfl⟩
    inter := by
      rintro V W ⟨U, hU, rfl⟩ ⟨U', hU', rfl⟩
      exact ⟨U ∩ U', T.inter hU hU', rfl⟩
    sUnion := by
      intro F h
      refine ⟨⋃₀ {U | T.IsOpen U ∧ (Subtype.val ⁻¹' U : Set A) ∈ F}, T.sUnion (fun U hU => hU.1), ?_⟩
      apply Set.Subset.antisymm
      · rintro x ⟨V, hVF, hxV⟩
        obtain ⟨U, hU, rfl⟩ := h V hVF
        exact ⟨U, ⟨hU, hVF⟩, hxV⟩
      · rintro x ⟨U, ⟨hU, hUF⟩, hxU⟩
        exact ⟨_, hUF, hxU⟩

  def Metric.ContinuousAt {X : Type u} {Y : Type v} (M : Metric X) (N : Metric Y) (f : X → Y)
      (x : X) : Prop :=
    ∀ ε > 0, ∃ δ > 0, ∀ x', M.dist x x' < δ → N.dist (f x) (f x') < ε

  def Metric.Continuous {X : Type u} {Y : Type v} (M : Metric X) (N : Metric Y) (f : X → Y) : Prop :=
    ∀ x, M.ContinuousAt N f x

  theorem line_continuous_affine (a b : ℝ) (ha : a ≠ 0) :
      line.Continuous line (fun t => a * t + b) := by
    intro x ε hε
    have hpos : 0 < |a| := abs_pos.mpr ha
    refine ⟨ε / |a|, div_pos hε hpos, ?_⟩
    intro x' h
    have hx : |x - x'| < ε / |a| := h
    show |(a * x + b) - (a * x' + b)| < ε
    have e : (a * x + b) - (a * x' + b) = a * (x - x') := by ring
    rw [e, abs_mul]
    calc |a| * |x - x'| < |a| * (ε / |a|) := mul_lt_mul_of_pos_left hx hpos
      _ = ε := mul_div_cancel₀ ε (ne_of_gt hpos)

  def Topology.Continuous {X : Type u} {Y : Type v} (T : Topology X) (T' : Topology Y)
      (f : X → Y) : Prop :=
    ∀ U, T'.IsOpen U → T.IsOpen (f ⁻¹' U)

  theorem Topology.continuous_const {X : Type u} {Y : Type v} (T : Topology X)
      (T' : Topology Y) (y : Y) : T.Continuous T' (fun _ => y) := by
    intro U _
    by_cases hy : y ∈ U
    · rw [show (fun _ => y) ⁻¹' U = (Set.univ : Set X) from Set.eq_univ_of_forall (fun _ => hy)]
      exact T.univ
    · rw [show (fun _ => y) ⁻¹' U = (∅ : Set X) from Set.eq_empty_of_forall_notMem (fun _ => hy)]
      exact T.empty

  theorem Topology.continuous_comp {X : Type u} {Y : Type v} {Z : Type w} (T : Topology X)
      {T' : Topology Y} {T'' : Topology Z} {f : X → Y} {g : Y → Z}
      (hf : T.Continuous T' f) (hg : T'.Continuous T'' g) : T.Continuous T'' (g ∘ f) := by
    intro U hU
    rw [Set.preimage_comp]
    exact hf _ (hg U hU)

  theorem Metric.continuous_iff {X : Type u} {Y : Type v} (M : Metric X) (N : Metric Y) (f : X → Y) :
      M.Continuous N f ↔ M.toTopology.Continuous N.toTopology f := by
    constructor
    · intro hf U hU x hx
      obtain ⟨ε, hε, hball⟩ := hU (f x) hx
      obtain ⟨δ, hδ, hδ'⟩ := hf x ε hε
      exact ⟨δ, hδ, fun y hy => hball (hδ' y hy)⟩
    · intro hf x ε hε
      have hopen := hf (N.ball (f x) ε) (N.isOpenSet_ball (f x) ε)
      obtain ⟨δ, hδ, hsub⟩ := hopen x (N.mem_ball_self (f x) ε hε)
      exact ⟨δ, hδ, fun y hy => hsub hy⟩

  theorem line_continuous_affine_top (a b : ℝ) (ha : a ≠ 0) :
      line.toTopology.Continuous line.toTopology (fun t => a * t + b) :=
    (line.continuous_iff line _).mp (line_continuous_affine a b ha)

  theorem Topology.continuous_subspace_val {X : Type u} (T : Topology X) (A : Set X) :
      (T.subspace A).Continuous T Subtype.val :=
    fun U hU => ⟨U, hU, rfl⟩

  def unitInterval : Set ℝ := {x | 0 ≤ x ∧ x ≤ 1}

  def unitInterval.zero : unitInterval := ⟨0, le_refl 0, by norm_num⟩

  def unitInterval.one : unitInterval := ⟨1, by norm_num, le_refl 1⟩

  def Topology.IsPathConnected {X : Type u} (T : Topology X) : Prop :=
    ∀ x y : X, ∃ γ : unitInterval → X,
      (line.toTopology.subspace unitInterval).Continuous T γ ∧
        γ unitInterval.zero = x ∧ γ unitInterval.one = y

  end GeneralTopology
  open GeneralTopology
description: 'Prove `line_isPathConnected`. Offer `fun p => (y - x) * p.val + x`; `by_cases h : y - x = 0` splits the two cases, `funext` and `ring` identify the map with a constant in the first, and `show` restates each endpoint as the arithmetic that `ring` closes.'
