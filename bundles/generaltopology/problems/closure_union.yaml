reference: |-
  theorem Topology.closure_union {X : Type u} (T : Topology X) (S S' : Set X) :
      T.closure (S ∪ S') = T.closure S ∪ T.closure S' := by
    apply Set.Subset.antisymm
    · apply T.closure_min (T.isClosed_union (T.isClosed_closure S) (T.isClosed_closure S'))
      exact Set.union_subset_union (T.subset_closure S) (T.subset_closure S')
    · exact Set.union_subset (T.closure_mono Set.subset_union_left)
        (T.closure_mono Set.subset_union_right)
spec: 'example : ∀ {X : Type u} (T : Topology X) (S S'' : Set X), T.closure (S ∪ S'') = T.closure S ∪ T.closure S'' := _root_.GeneralTopology.Topology.closure_union'
preamble: |
  universe u
  namespace GeneralTopology
  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def Topology.IsClosed {X : Type u} (T : Topology X) (C : Set X) : Prop := T.IsOpen Cᶜ

  theorem Topology.isClosed_union {X : Type u} (T : Topology X) {C D : Set X}
      (hC : T.IsClosed C) (hD : T.IsClosed D) : T.IsClosed (C ∪ D) := by
    show T.IsOpen _
    rw [Set.compl_union]
    exact T.inter hC hD

  theorem Topology.isClosed_sInter {X : Type u} (T : Topology X) {F : Set (Set X)}
      (h : ∀ C ∈ F, T.IsClosed C) : T.IsClosed (⋂₀ F) := by
    show T.IsOpen _
    rw [Set.compl_sInter]
    apply T.sUnion
    rintro U ⟨C, hCF, rfl⟩
    exact h C hCF

  def Topology.closure {X : Type u} (T : Topology X) (S : Set X) : Set X :=
    ⋂₀ {C | T.IsClosed C ∧ S ⊆ C}

  theorem Topology.subset_closure {X : Type u} (T : Topology X) (S : Set X) : S ⊆ T.closure S := by
    intro x hx C hC
    exact hC.2 hx

  theorem Topology.isClosed_closure {X : Type u} (T : Topology X) (S : Set X) :
      T.IsClosed (T.closure S) :=
    T.isClosed_sInter (fun _ hC => hC.1)

  theorem Topology.closure_min {X : Type u} (T : Topology X) {S C : Set X}
      (hC : T.IsClosed C) (hSC : S ⊆ C) : T.closure S ⊆ C := by
    intro x hx
    exact hx C ⟨hC, hSC⟩

  theorem Topology.closure_mono {X : Type u} (T : Topology X) {S S' : Set X} (h : S ⊆ S') :
      T.closure S ⊆ T.closure S' :=
    T.closure_min (T.isClosed_closure S') (h.trans (T.subset_closure S'))

  end GeneralTopology
  open GeneralTopology
description: Prove that `T.closure (S ∪ S') = T.closure S ∪ T.closure S'`. Split with `Set.Subset.antisymm`; `Set.union_subset_union` and `Set.union_subset` combine two containments into one, and `Set.subset_union_left` and `Set.subset_union_right` put a set inside a union.
