  theorem codiscrete_not_isT0 {X : Type u} {x y : X} (h : x ≠ y) : ¬ (codiscrete X).IsT0 := by
    intro hT
    rcases hT x y h with ⟨U, hU, hxU, hyU⟩ | ⟨U, hU, hyU, hxU⟩ <;> rcases hU with rfl | rfl
    · exact hxU
    · exact hyU trivial
    · exact hyU
    · exact hxU trivial
spec: 'example : ∀ {X : Type u} {x y : X} (h : x ≠ y), ¬ (codiscrete X).IsT0 := _root_.GeneralTopology.codiscrete_not_isT0'
preamble: |
  universe u v
  namespace GeneralTopology
  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  theorem trivial_inter {X : Type u} {U V : Set X} (hU : U = ∅ ∨ U = Set.univ)
      (hV : V = ∅ ∨ V = Set.univ) : U ∩ V = ∅ ∨ U ∩ V = Set.univ := by
    rcases hU with rfl | rfl
    · left; exact Set.empty_inter V
    · rcases hV with rfl | rfl
      · left; exact Set.inter_empty _
      · right; exact Set.inter_self _

  theorem trivial_sUnion {X : Type u} {F : Set (Set X)}
      (h : ∀ U ∈ F, U = ∅ ∨ U = Set.univ) : ⋃₀ F = ∅ ∨ ⋃₀ F = Set.univ := by
    by_cases hu : (Set.univ : Set X) ∈ F
    · exact Or.inr (Set.Subset.antisymm (Set.subset_univ _) (Set.subset_sUnion_of_mem hu))
    · refine Or.inl (Set.sUnion_eq_empty.mpr ?_)
      intro U hUF
      rcases h U hUF with rfl | rfl
      · rfl
      · exact absurd hUF hu

  def codiscrete (X : Type u) : Topology X where
    IsOpen := fun U => U = ∅ ∨ U = Set.univ
    univ := Or.inr rfl
    inter := trivial_inter
    sUnion := trivial_sUnion

  def Topology.IsT0 {X : Type u} (T : Topology X) : Prop :=
    ∀ x y : X, x ≠ y →
      (∃ U, T.IsOpen U ∧ x ∈ U ∧ y ∉ U) ∨ (∃ V, T.IsOpen V ∧ y ∈ V ∧ x ∉ V)

  end GeneralTopology
  open GeneralTopology
description: Show that `(codiscrete X).IsT0` is false when `X` has two distinct points `x` and `y`. Take the disjunction apart with `rcases`, and in each branch `rcases` the openness, which says the set is `∅` or `Set.univ`; the first case contradicts a membership and the second a non-membership, which `trivial` supplies.
