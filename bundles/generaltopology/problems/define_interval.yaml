reference: |-
  def IsInterval (S : Set ℝ) : Prop :=
    ∀ x ∈ S, ∀ y ∈ S, ∀ r, x < r → r < y → r ∈ S

  theorem IsInterval.mem_of_le {S : Set ℝ} (h : IsInterval S) {a b x : ℝ} (ha : a ∈ S) (hb : b ∈ S)
      (h1 : a ≤ x) (h2 : x ≤ b) : x ∈ S := by
    rcases eq_or_lt_of_le h1 with rfl | hlt
    · exact ha
    rcases eq_or_lt_of_le h2 with rfl | hlt2
    · exact hb
    exact h a ha b hb x hlt hlt2
spec: |-
  example : ∀ {S : Set ℝ} (h : _root_.GeneralTopology.IsInterval S) {a b x : ℝ} (ha : a ∈ S) (hb : b ∈ S)
      (h1 : a ≤ x) (h2 : x ≤ b), x ∈ S := _root_.GeneralTopology.IsInterval.mem_of_le
  example (S : Set ℝ) : _root_.GeneralTopology.IsInterval S ↔ ∀ x ∈ S, ∀ y ∈ S, ∀ r, x < r → r < y → r ∈ S := Iff.rfl
