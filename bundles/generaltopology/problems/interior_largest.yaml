preamble: |
  universe u
  namespace GeneralTopology
  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def Topology.interior {X : Type u} (T : Topology X) (S : Set X) : Set X :=
    ⋃₀ {U | T.IsOpen U ∧ U ⊆ S}

  end GeneralTopology
  open GeneralTopology
description: 'Prove the three. A membership in `⋃₀` is a triple: the set it came from, the proof that set belongs to the collection, and the proof the point lies in it. `rintro x ⟨U, ⟨_, hUS⟩, hxU⟩` takes one apart, and an anonymous constructor builds one.'
