reference: |-
  structure Homeomorphism {X : Type u} {Y : Type v} (T : Topology X) (T' : Topology Y) where
    toFun : X → Y
    invFun : Y → X
    left_inv : ∀ x, invFun (toFun x) = x
    right_inv : ∀ y, toFun (invFun y) = y
    continuous_toFun : T.Continuous T' toFun
    continuous_invFun : T'.Continuous T invFun
spec: |-
  example (X Y : Type) (T : Topology X) (T' : Topology Y) (h : _root_.GeneralTopology.Homeomorphism T T') :
      (∀ x, h.invFun (h.toFun x) = x) ∧ (∀ y, h.toFun (h.invFun y) = y)
        ∧ T.Continuous T' h.toFun ∧ T'.Continuous T h.invFun := by
    refine ⟨fun x => ?_, fun y => ?_, h.continuous_toFun, h.continuous_invFun⟩
    · apply h.left_inv
    · apply h.right_inv
preamble: |
  universe u v w
  namespace GeneralTopology
  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def Topology.Continuous {X : Type u} {Y : Type v} (T : Topology X) (T' : Topology Y)
      (f : X → Y) : Prop :=
    ∀ U, T'.IsOpen U → T.IsOpen (f ⁻¹' U)

  end GeneralTopology
