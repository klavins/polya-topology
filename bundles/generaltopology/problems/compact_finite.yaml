reference: |-
  theorem Topology.isCompactSet_of_finite {X : Type u} (T : Topology X) {S : Set X}
      (hS : S.Finite) : T.IsCompactSet S := by
    induction S, hS using Set.Finite.induction_on with
    | empty => exact Topology.isCompactSet_empty T
    | insert _ _ ih =>
      rw [Set.insert_eq]
      exact Topology.isCompactSet_union T (Topology.isCompactSet_singleton T _) ih

  theorem Topology.isCompact_of_finite {X : Type u} (T : Topology X)
      (h : (Set.univ : Set X).Finite) : T.IsCompact :=
    Topology.isCompactSet_of_finite T h
spec: |-
  example : ∀ {X : Type u} (T : Topology X) {S : Set X}
      (hS : S.Finite), T.IsCompactSet S := _root_.GeneralTopology.Topology.isCompactSet_of_finite
  example : ∀ {X : Type u} (T : Topology X)
      (h : (Set.univ : Set X).Finite), T.IsCompact := _root_.GeneralTopology.Topology.isCompact_of_finite
preamble: |
  universe u v
  namespace GeneralTopology
  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def Topology.IsCompactSet {X : Type u} (T : Topology X) (S : Set X) : Prop :=
    ∀ F : Set (Set X), (∀ U ∈ F, T.IsOpen U) → S ⊆ ⋃₀ F →
      ∃ G ⊆ F, G.Finite ∧ S ⊆ ⋃₀ G

  def Topology.IsCompact {X : Type u} (T : Topology X) : Prop := T.IsCompactSet Set.univ

  theorem Topology.isCompactSet_empty {X : Type u} (T : Topology X) :
      T.IsCompactSet (∅ : Set X) :=
    fun _ _ _ => ⟨∅, Set.empty_subset _, Set.finite_empty, Set.empty_subset _⟩

  theorem Topology.isCompactSet_singleton {X : Type u} (T : Topology X) (x : X) :
      T.IsCompactSet {x} := by
    intro F _ hcov
    obtain ⟨U, hUF, hxU⟩ := hcov rfl
    refine ⟨{U}, Set.singleton_subset_iff.mpr hUF, Set.finite_singleton U, ?_⟩
    intro y hy
    have e : y = x := hy
    exact ⟨U, rfl, e ▸ hxU⟩

  theorem Topology.isCompactSet_union {X : Type u} (T : Topology X) {S S' : Set X}
      (hS : T.IsCompactSet S) (hS' : T.IsCompactSet S') : T.IsCompactSet (S ∪ S') := by
    intro F hFo hcov
    obtain ⟨G, hGF, hGfin, hGcov⟩ := hS F hFo (fun x hx => hcov (Or.inl hx))
    obtain ⟨G', hG'F, hG'fin, hG'cov⟩ := hS' F hFo (fun x hx => hcov (Or.inr hx))
    refine ⟨G ∪ G', Set.union_subset hGF hG'F, hGfin.union hG'fin, ?_⟩
    rintro x (hx | hx)
    · exact Set.sUnion_mono Set.subset_union_left (hGcov hx)
    · exact Set.sUnion_mono Set.subset_union_right (hG'cov hx)

  end GeneralTopology
  open GeneralTopology
description: Prove `Topology.isCompactSet_of_finite` and then `Topology.isCompact_of_finite`, which is the first at `Set.univ`. `induction S, hS using Set.Finite.induction_on` splits the finiteness into its two cases, named `empty` and `insert`; `Set.insert_eq` rewrites `insert x S` as `{x} ∪ S`.
