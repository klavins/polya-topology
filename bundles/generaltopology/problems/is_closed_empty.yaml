slug: is_closed_empty
kind: theorem
title: The Empty Set is Closed
statement: 'The whole space is closed because the empty set is open. The dual is as short: the empty set is closed because its complement is the whole space, which every topology calls open.'
concepts:
- closed_families
stub: |-
  theorem TopologicalSpace.isClosed_empty {X : Type u} (T : TopologicalSpace X) : T.IsClosed
      (∅ : Set X) := sorry
reference: |-
  theorem TopologicalSpace.isClosed_empty {X : Type u} (T : TopologicalSpace X) : T.IsClosed
      (∅ : Set X) := by
    show T.IsOpen _
    rw [Set.compl_empty]
    exact T.isOpen_univ
spec: |-
  example : ∀ {X : Type u} (T : TopologicalSpace X), T.IsClosed
      (∅ : Set X) := _root_.GeneralTopology.TopologicalSpace.isClosed_empty
preamble: |
  universe u
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.IsClosed {X : Type u} (T : TopologicalSpace X) (C : Set X) : Prop
      := T.IsOpen Cᶜ

  end GeneralTopology
  open GeneralTopology
description: Show that `∅` is closed in any topology. `show T.IsOpen _` names the goal for what it is, `Set.compl_empty` rewrites the complement, and the whole space is open.
