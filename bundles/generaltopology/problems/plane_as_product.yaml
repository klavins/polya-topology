preamble: |
  universe u v w
  namespace GeneralTopology
  structure Metric (X : Type u) where
    dist : X → X → ℝ
    symm : ∀ {x y}, dist x y = dist y x
    triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  theorem Metric.dist_self {X : Type u} (M : Metric X) {x : X} : M.dist x x = 0 :=
    M.eq_zero.mpr rfl

  def line : Metric ℝ where
    dist x y := |x - y|
    symm {x y} := abs_sub_comm x y
    triangle x y z := abs_sub_le x y z
    eq_zero {x y} := by rw [abs_eq_zero, sub_eq_zero]

  def Metric.ball {X : Type u} (M : Metric X) (x : X) (ε : ℝ) : Set X :=
    {y | M.dist x y < ε}

  theorem Metric.mem_ball {X : Type u} (M : Metric X) {x y : X} {ε : ℝ} :
      y ∈ M.ball x ε ↔ M.dist x y < ε := Iff.rfl

  theorem Metric.mem_ball_self {X : Type u} (M : Metric X) (x : X) (ε : ℝ) (h : 0 < ε) :
      x ∈ M.ball x ε := by
    rw [M.mem_ball, M.dist_self]
    exact h

  theorem Metric.ball_mono {X : Type u} (M : Metric X) {x : X} {ε δ : ℝ} (h : ε ≤ δ) :
      M.ball x ε ⊆ M.ball x δ :=
    fun _ hy => lt_of_lt_of_le hy h

  structure Norm (V : Type u) [AddCommGroup V] [Module ℝ V] where
    norm : V → ℝ
    eq_zero : ∀ {v}, norm v = 0 ↔ v = 0
    smul : ∀ (c : ℝ) (v : V), norm (c • v) = |c| * norm v
    triangle : ∀ v w, norm (v + w) ≤ norm v + norm w

  theorem Norm.neg {V : Type u} [AddCommGroup V] [Module ℝ V] (N : Norm V) (v : V) :
      N.norm (-v) = N.norm v := by
    have h := N.smul (-1) v
    rw [neg_one_smul] at h
    rw [h, abs_neg, abs_one, one_mul]

  theorem Norm.sub_comm {V : Type u} [AddCommGroup V] [Module ℝ V] (N : Norm V) (v w : V) :
      N.norm (v - w) = N.norm (w - v) := by
    rw [← N.neg (v - w), neg_sub]

  def Norm.toMetric {V : Type u} [AddCommGroup V] [Module ℝ V] (N : Norm V) : Metric V where
    dist v w := N.norm (v - w)
    symm {v w} := N.sub_comm v w
    triangle u v w := by
      have h := N.triangle (u - v) (v - w)
      rw [sub_add_sub_cancel] at h
      exact h
    eq_zero {v w} := by rw [N.eq_zero, sub_eq_zero]

  theorem eq_zero_of_abs_le_zero {a : ℝ} (h : |a| ≤ 0) : a = 0 := by
    rw [← abs_eq_zero]
    have h0 := abs_nonneg a
    linarith

  theorem abs_add_abs_eq_zero {a b : ℝ} : |a| + |b| = 0 ↔ a = 0 ∧ b = 0 := by
    constructor
    · intro h
      have ha := abs_nonneg a
      have hb := abs_nonneg b
      exact ⟨eq_zero_of_abs_le_zero (by linarith), eq_zero_of_abs_le_zero (by linarith)⟩
    · rintro ⟨ha, hb⟩
      rw [ha, hb, abs_zero, add_zero]

  theorem prod_eq_zero {v : ℝ × ℝ} : v = 0 ↔ v.1 = 0 ∧ v.2 = 0 := by
    constructor
    · intro h
      rw [h]
      exact ⟨rfl, rfl⟩
    · rintro ⟨h1, h2⟩
      exact Prod.ext h1 h2

  def taxicab : Norm (ℝ × ℝ) where
    norm v := |v.1| + |v.2|
    eq_zero {v} := by rw [abs_add_abs_eq_zero, prod_eq_zero]
    smul c v := by
      show |c * v.1| + |c * v.2| = |c| * (|v.1| + |v.2|)
      rw [abs_mul, abs_mul]
      ring
    triangle v w := by
      show |v.1 + w.1| + |v.2 + w.2| ≤ |v.1| + |v.2| + (|w.1| + |w.2|)
      have h1 := abs_add_le v.1 w.1
      have h2 := abs_add_le v.2 w.2
      linarith

  theorem max_abs_eq_zero {a b : ℝ} : max |a| |b| = 0 ↔ a = 0 ∧ b = 0 := by
    constructor
    · intro h
      have ha := le_max_left |a| |b|
      have hb := le_max_right |a| |b|
      rw [h] at ha hb
      exact ⟨eq_zero_of_abs_le_zero ha, eq_zero_of_abs_le_zero hb⟩
    · rintro ⟨ha, hb⟩
      rw [ha, hb, abs_zero, max_self]

  theorem max_add_max (a b c d : ℝ) : max (a + c) (b + d) ≤ max a b + max c d := by
    rw [max_le_iff]
    have a1 := le_max_left a b
    have a2 := le_max_right a b
    have b1 := le_max_left c d
    have b2 := le_max_right c d
    constructor <;> linarith

  def supNorm : Norm (ℝ × ℝ) where
    norm v := max |v.1| |v.2|
    eq_zero {v} := by rw [max_abs_eq_zero, prod_eq_zero]
    smul c v := by
      show max |c * v.1| |c * v.2| = |c| * max |v.1| |v.2|
      rw [abs_mul, abs_mul, mul_max_of_nonneg _ _ (abs_nonneg c)]
    triangle v w := by
      show max |v.1 + w.1| |v.2 + w.2| ≤ max |v.1| |v.2| + max |w.1| |w.2|
      have h1 := max_le_max (abs_add_le v.1 w.1) (abs_add_le v.2 w.2)
      have h2 := max_add_max |v.1| |v.2| |w.1| |w.2|
      linarith

  theorem supNorm_le_taxicab (v : ℝ × ℝ) : supNorm.norm v ≤ taxicab.norm v := by
    show max |v.1| |v.2| ≤ |v.1| + |v.2|
    have h1 := abs_nonneg v.1
    have h2 := abs_nonneg v.2
    rw [max_le_iff]
    constructor <;> linarith

  theorem taxicab_le_two_supNorm (v : ℝ × ℝ) : taxicab.norm v ≤ 2 * supNorm.norm v := by
    show |v.1| + |v.2| ≤ 2 * max |v.1| |v.2|
    have h1 := le_max_left |v.1| |v.2|
    have h2 := le_max_right |v.1| |v.2|
    linarith

  theorem ball_taxicab_subset_supNorm (x : ℝ × ℝ) (ε : ℝ) :
      taxicab.toMetric.ball x ε ⊆ supNorm.toMetric.ball x ε := by
    intro y hy
    have h : taxicab.norm (x - y) < ε := hy
    have h2 := supNorm_le_taxicab (x - y)
    show supNorm.norm (x - y) < ε
    linarith

  theorem ball_supNorm_subset_taxicab (x : ℝ × ℝ) (ε : ℝ) :
      supNorm.toMetric.ball x (ε / 2) ⊆ taxicab.toMetric.ball x ε := by
    intro y hy
    have h : supNorm.norm (x - y) < ε / 2 := hy
    have h2 := taxicab_le_two_supNorm (x - y)
    show taxicab.norm (x - y) < ε
    linarith

  def Metric.IsOpenSet {X : Type u} (M : Metric X) (U : Set X) : Prop :=
    ∀ x ∈ U, ∃ ε > 0, M.ball x ε ⊆ U

  theorem Metric.isOpenSet_ball {X : Type u} (M : Metric X) (x : X) (ε : ℝ) :
      M.IsOpenSet (M.ball x ε) := by
    intro y hy
    rw [M.mem_ball] at hy
    refine ⟨ε - M.dist x y, by linarith, ?_⟩
    intro z hz
    rw [M.mem_ball] at hz ⊢
    have h := M.triangle x y z
    linarith

  theorem Metric.isOpenSet_univ {X : Type u} (M : Metric X) : M.IsOpenSet (Set.univ : Set X) :=
    fun _ _ => ⟨1, one_pos, fun _ _ => trivial⟩

  theorem Metric.isOpenSet_inter {X : Type u} (M : Metric X) {U V : Set X}
      (hU : M.IsOpenSet U) (hV : M.IsOpenSet V) : M.IsOpenSet (U ∩ V) := by
    intro x hx
    obtain ⟨a, ha, hau⟩ := hU x hx.1
    obtain ⟨b, hb, hbv⟩ := hV x hx.2
    refine ⟨min a b, lt_min ha hb, ?_⟩
    intro y hy
    rw [M.mem_ball] at hy
    exact ⟨hau (lt_of_lt_of_le hy (min_le_left a b)), hbv (lt_of_lt_of_le hy (min_le_right a b))⟩

  theorem Metric.isOpenSet_sUnion {X : Type u} (M : Metric X) {F : Set (Set X)}
      (h : ∀ U ∈ F, M.IsOpenSet U) : M.IsOpenSet (⋃₀ F) := by
    intro x hx
    obtain ⟨U, hUF, hxU⟩ := hx
    obtain ⟨ε, hε, hsub⟩ := h U hUF x hxU
    exact ⟨ε, hε, fun y hy => ⟨U, hUF, hsub hy⟩⟩

  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def Metric.toTopology {X : Type u} (M : Metric X) : Topology X where
    IsOpen := M.IsOpenSet
    univ := M.isOpenSet_univ
    inter := M.isOpenSet_inter
    sUnion := M.isOpenSet_sUnion

  def Topology.Continuous {X : Type u} {Y : Type v} (T : Topology X) (T' : Topology Y)
      (f : X → Y) : Prop :=
    ∀ U, T'.IsOpen U → T.IsOpen (f ⁻¹' U)

  theorem Topology.continuous_id {X : Type u} (T : Topology X) : T.Continuous T id := by
    intro U hU
    rw [Set.preimage_id]
    exact hU

  theorem Topology.continuous_comp {X : Type u} {Y : Type v} {Z : Type w} (T : Topology X)
      {T' : Topology Y} {T'' : Topology Z} {f : X → Y} {g : Y → Z}
      (hf : T.Continuous T' f) (hg : T'.Continuous T'' g) : T.Continuous T'' (g ∘ f) := by
    intro U hU
    rw [Set.preimage_comp]
    exact hf _ (hg U hU)

  structure Homeomorphism {X : Type u} {Y : Type v} (T : Topology X) (T' : Topology Y) where
    toFun : X → Y
    invFun : Y → X
    left_inv : ∀ x, invFun (toFun x) = x
    right_inv : ∀ y, toFun (invFun y) = y
    continuous_toFun : T.Continuous T' toFun
    continuous_invFun : T'.Continuous T invFun

  def Homeomorphism.refl {X : Type u} (T : Topology X) : Homeomorphism T T where
    toFun := id
    invFun := id
    left_inv := fun _ => rfl
    right_inv := fun _ => rfl
    continuous_toFun := Topology.continuous_id T
    continuous_invFun := Topology.continuous_id T

  def Homeomorphism.trans {X : Type u} {Y : Type v} {Z : Type w} {T : Topology X}
      {T' : Topology Y} {T'' : Topology Z} (h : Homeomorphism T T') (h' : Homeomorphism T' T'') :
      Homeomorphism T T'' where
    toFun := h'.toFun ∘ h.toFun
    invFun := h.invFun ∘ h'.invFun
    left_inv := fun x => by
      show h.invFun (h'.invFun (h'.toFun (h.toFun x))) = x
      rw [h'.left_inv, h.left_inv]
    right_inv := fun z => by
      show h'.toFun (h.toFun (h.invFun (h'.invFun z))) = z
      rw [h.right_inv, h'.right_inv]
    continuous_toFun := Topology.continuous_comp T h.continuous_toFun h'.continuous_toFun
    continuous_invFun := Topology.continuous_comp T'' h'.continuous_invFun h.continuous_invFun

  def Homeomorphic {X : Type u} {Y : Type v} (T : Topology X) (T' : Topology Y) : Prop :=
    Nonempty (Homeomorphism T T')

  theorem Homeomorphic.trans {X : Type u} {Y : Type v} {Z : Type w} {T : Topology X}
      {T' : Topology Y} {T'' : Topology Z} (h : Homeomorphic T T') (h' : Homeomorphic T' T'') :
      Homeomorphic T T'' := by
    obtain ⟨e⟩ := h
    obtain ⟨e'⟩ := h'
    exact ⟨e.trans e'⟩

  def Metric.Equivalent {X : Type u} (M N : Metric X) : Prop :=
    (∀ x ε, 0 < ε → ∃ δ > 0, N.ball x δ ⊆ M.ball x ε) ∧
      (∀ x ε, 0 < ε → ∃ δ > 0, M.ball x δ ⊆ N.ball x ε)

  theorem Metric.isOpenSet_of_ball_subset {X : Type u} {M N : Metric X}
      (h : ∀ x ε, 0 < ε → ∃ δ > 0, N.ball x δ ⊆ M.ball x ε) {U : Set X}
      (hU : M.IsOpenSet U) : N.IsOpenSet U := by
    intro x hx
    obtain ⟨ε, hε, hsub⟩ := hU x hx
    obtain ⟨δ, hδ, hball⟩ := h x ε hε
    exact ⟨δ, hδ, fun y hy => hsub (hball hy)⟩

  theorem Metric.Equivalent.isOpenSet_iff {X : Type u} {M N : Metric X} (h : M.Equivalent N)
      (U : Set X) : M.IsOpenSet U ↔ N.IsOpenSet U :=
    ⟨fun hU => Metric.isOpenSet_of_ball_subset h.1 hU,
     fun hU => Metric.isOpenSet_of_ball_subset h.2 hU⟩

  def Metric.Equivalent.toHomeomorphism {X : Type u} {M N : Metric X} (h : M.Equivalent N) :
      Homeomorphism M.toTopology N.toTopology where
    toFun := id
    invFun := id
    left_inv := fun _ => rfl
    right_inv := fun _ => rfl
    continuous_toFun := fun U hU => (h.isOpenSet_iff U).mpr hU
    continuous_invFun := fun U hU => (h.isOpenSet_iff U).mp hU

  theorem taxicab_equivalent_supNorm : taxicab.toMetric.Equivalent supNorm.toMetric := by
    constructor
    · intro x ε hε
      exact ⟨ε / 2, by linarith, ball_supNorm_subset_taxicab x ε⟩
    · intro x ε hε
      exact ⟨ε, hε, ball_taxicab_subset_supNorm x ε⟩

  theorem plane_homeomorphic :
      Homeomorphic taxicab.toMetric.toTopology supNorm.toMetric.toTopology :=
    ⟨taxicab_equivalent_supNorm.toHomeomorphism⟩

  def Topology.prod {X : Type u} {Y : Type v} (T : Topology X) (T' : Topology Y) :
      Topology (X × Y) where
    IsOpen := fun W => ∀ p ∈ W, ∃ U V, T.IsOpen U ∧ T'.IsOpen V ∧ p ∈ U ×ˢ V ∧ U ×ˢ V ⊆ W
    univ := fun _ _ => ⟨Set.univ, Set.univ, T.univ, T'.univ, ⟨trivial, trivial⟩, fun _ _ => trivial⟩
    inter := by
      rintro W W' hW hW' p hp
      obtain ⟨U, V, hU, hV, hpUV, hsub⟩ := hW p hp.1
      obtain ⟨U', V', hU', hV', hpUV', hsub'⟩ := hW' p hp.2
      refine ⟨U ∩ U', V ∩ V', T.inter hU hU', T'.inter hV hV',
        ⟨⟨hpUV.1, hpUV'.1⟩, ⟨hpUV.2, hpUV'.2⟩⟩, ?_⟩
      rintro q ⟨hq1, hq2⟩
      exact ⟨hsub ⟨hq1.1, hq2.1⟩, hsub' ⟨hq1.2, hq2.2⟩⟩
    sUnion := by
      rintro F h p ⟨W, hWF, hpW⟩
      obtain ⟨U, V, hU, hV, hpUV, hsub⟩ := h W hWF p hpW
      exact ⟨U, V, hU, hV, hpUV, fun q hq => ⟨W, hWF, hsub hq⟩⟩

  theorem ball_supNorm_eq_box (x : ℝ × ℝ) (ε : ℝ) :
      supNorm.toMetric.ball x ε = line.ball x.1 ε ×ˢ line.ball x.2 ε := by
    ext y
    show max |x.1 - y.1| |x.2 - y.2| < ε ↔ |x.1 - y.1| < ε ∧ |x.2 - y.2| < ε
    exact max_lt_iff

  theorem isOpen_prod_of_isOpenSet_supNorm {W : Set (ℝ × ℝ)} (h : supNorm.toMetric.IsOpenSet W) :
      (line.toTopology.prod line.toTopology).IsOpen W := by
    intro p hp
    obtain ⟨ε, hε, hsub⟩ := h p hp
    refine ⟨line.ball p.1 ε, line.ball p.2 ε, Metric.isOpenSet_ball line p.1 ε,
      Metric.isOpenSet_ball line p.2 ε,
      ⟨Metric.mem_ball_self line p.1 ε hε, Metric.mem_ball_self line p.2 ε hε⟩, ?_⟩
    rw [← ball_supNorm_eq_box]
    exact hsub

  theorem isOpenSet_supNorm_of_isOpen_prod {W : Set (ℝ × ℝ)}
      (h : (line.toTopology.prod line.toTopology).IsOpen W) : supNorm.toMetric.IsOpenSet W := by
    intro p hp
    obtain ⟨U, V, hU, hV, hpUV, hsub⟩ := h p hp
    obtain ⟨a, ha, hau⟩ := hU p.1 hpUV.1
    obtain ⟨b, hb, hbv⟩ := hV p.2 hpUV.2
    refine ⟨min a b, lt_min ha hb, ?_⟩
    rw [ball_supNorm_eq_box]
    rintro q ⟨hq1, hq2⟩
    exact hsub ⟨hau (Metric.ball_mono line (min_le_left a b) hq1),
      hbv (Metric.ball_mono line (min_le_right a b) hq2)⟩

  end GeneralTopology
  open GeneralTopology
description: Build `supNorm_prod_homeomorphism`, the identity as a homeomorphism onto the product, and read off that the supremum plane and then the taxicab plane are homeomorphic to `line.toTopology.prod line.toTopology`. Both maps are `id` and both inverse conditions are `rfl`; the last cites `plane_homeomorphic` and `Homeomorphic.trans`.
