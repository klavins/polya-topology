preamble: |
  universe u v w
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.Continuous {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      (f : X → Y) : Prop :=
    ∀ U, T'.IsOpen U → T.IsOpen (f ⁻¹' U)

  def TopologicalSpace.induced {X : Type u} {Y : Type v} (T : TopologicalSpace Y) (f : X → Y)
      : TopologicalSpace X where
    IsOpen := fun V => ∃ U, T.IsOpen U ∧ V = f ⁻¹' U
    isOpen_univ := ⟨Set.univ, T.isOpen_univ, rfl⟩
    isOpen_inter := by
      rintro V W ⟨U, hU, rfl⟩ ⟨U', hU', rfl⟩
      exact ⟨U ∩ U', T.isOpen_inter hU hU', rfl⟩
    isOpen_sUnion := by
      intro F h
      refine ⟨⋃₀ {U | T.IsOpen U ∧ (f ⁻¹' U : Set X) ∈ F}, T.isOpen_sUnion (fun U hU => hU.1), ?_⟩
      apply Set.Subset.antisymm
      · rintro x ⟨V, hVF, hxV⟩
        obtain ⟨U, hU, rfl⟩ := h V hVF
        exact ⟨U, ⟨hU, hVF⟩, hxV⟩
      · rintro x ⟨U, ⟨hU, hUF⟩, hxU⟩
        exact ⟨_, hUF, hxU⟩

  end GeneralTopology
  open GeneralTopology
description: Show that `f` is continuous from `T.induced f` to `T`, and that any topology `S` making `f` continuous calls open every set that `T.induced f` calls open. Each is one line once the open set has been taken apart.
