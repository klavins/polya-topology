slug: define_discrete
kind: definition
title: The Discrete Topology
statement: |-
  Call every subset open. The three conditions ask nothing, since the answer is always yes, so this is a topology on any set whatever — the *discrete* topology, the finest there is.

  A field of a structure may be filled by a proof that ignores its hypotheses. `trivial` proves `True`.
concepts:
- extreme_topologies
stub: 'def discrete (X : Type u) : TopologicalSpace X := sorry'
reference: |-
  def discrete (X : Type u) : TopologicalSpace X where
    IsOpen := fun _ => True
    isOpen_univ := trivial
    isOpen_inter := fun _ _ => trivial
    isOpen_sUnion := fun _ => trivial
spec: 'example (X : Type) (U : Set X) : (_root_.GeneralTopology.discrete X).IsOpen U ↔ True := Iff.rfl'
preamble: |
  universe u
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  end GeneralTopology
  open GeneralTopology
description: Define `discrete X`, whose `IsOpen` is `fun _ => True`. Each of the three conditions is `trivial`, the last two after their hypotheses are taken and discarded.
