slug: define_sierpinski
kind: definition
title: The Sierpiński Space
statement: |-
  Take the two-element set `Bool` and declare a subset open when, if it contains `false`, it also contains `true`. Three subsets pass: the empty set, `{true}`, and the whole set. The fourth, `{false}`, fails, and that single asymmetry is the whole of the example.

  Written this way each condition is an implication, and the proofs are short. That is the advantage of describing the open sets by a property rather than by listing them.
concepts:
- sierpinski_space
stub: 'def sierpinski : TopologicalSpace Bool := sorry'
reference: |-
  def sierpinski : TopologicalSpace Bool where
    IsOpen := fun U => false ∈ U → true ∈ U
    isOpen_univ := fun _ => trivial
    isOpen_inter := fun hU hV h => ⟨hU h.1, hV h.2⟩
    isOpen_sUnion := by
      intro F h hf
      obtain ⟨U, hUF, hU⟩ := hf
      exact ⟨U, hUF, h U hUF hU⟩
spec: 'example (U : Set Bool) : _root_.GeneralTopology.sierpinski.IsOpen U ↔ (false ∈ U → true ∈ U) := Iff.rfl'
preamble: |
  universe u
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  end GeneralTopology
  open GeneralTopology
description: Define `sierpinski`, a topology on `Bool` whose `IsOpen U` is `false ∈ U → true ∈ U`. The whole set holds it trivially; an intersection holds it from both halves; and for a union, the member that supplies `false` supplies `true`.
