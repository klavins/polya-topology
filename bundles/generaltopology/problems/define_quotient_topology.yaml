      T.Continuous (T.quotient s) (Quotient.mk s) := sorry
reference: |-
  def Topology.quotient {X : Type u} (T : Topology X) (s : Setoid X) : Topology (Quotient s) :=
    T.coinduced (Quotient.mk s)

  theorem Topology.continuous_mk {X : Type u} (T : Topology X) (s : Setoid X) :
      T.Continuous (T.quotient s) (Quotient.mk s) :=
    Topology.continuous_coinduced T (Quotient.mk s)
spec: |-
  example {X : Type u} (T : Topology X) (s : Setoid X) : _root_.GeneralTopology.Topology.quotient T s = (T.coinduced (Quotient.mk s) : Topology (Quotient s)) := rfl
  example : ∀ {X : Type u} (T : Topology X) (s : Setoid X), T.Continuous (T.quotient s) (Quotient.mk s) := _root_.GeneralTopology.Topology.continuous_mk
  example (X : Type) (T : Topology X) (s : Setoid X) (V : Set (Quotient s)) :
      (T.quotient s).IsOpen V ↔ T.IsOpen (Quotient.mk s ⁻¹' V) := Iff.rfl
preamble: |
  universe u v w
  namespace GeneralTopology
  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def Topology.Continuous {X : Type u} {Y : Type v} (T : Topology X) (T' : Topology Y)
      (f : X → Y) : Prop :=
    ∀ U, T'.IsOpen U → T.IsOpen (f ⁻¹' U)

  theorem preimage_sUnion_image {X : Type u} {Y : Type v} (f : X → Y) (F : Set (Set Y)) :
      f ⁻¹' (⋃₀ F) = ⋃₀ (Set.preimage f '' F) := by
    apply Set.Subset.antisymm
    · rintro x ⟨V, hVF, hxV⟩
      exact ⟨f ⁻¹' V, ⟨V, hVF, rfl⟩, hxV⟩
    · rintro x ⟨W, ⟨V, hVF, rfl⟩, hxW⟩
      exact ⟨V, hVF, hxW⟩

  def Topology.coinduced {X : Type u} {Y : Type v} (T : Topology X) (f : X → Y) : Topology Y where
    IsOpen := fun V => T.IsOpen (f ⁻¹' V)
    univ := by
      rw [Set.preimage_univ]
      exact T.univ
    inter := by
      intro V W hV hW
      rw [Set.preimage_inter]
      exact T.inter hV hW
    sUnion := by
      intro F h
      rw [preimage_sUnion_image]
      refine T.sUnion ?_
      rintro W ⟨V, hVF, rfl⟩
      exact h V hVF

  theorem Topology.continuous_coinduced {X : Type u} {Y : Type v} (T : Topology X) (f : X → Y) :
      T.Continuous (T.coinduced f) f :=
    fun _ hV => hV

  end GeneralTopology
  open GeneralTopology
description: Define `Topology.quotient` as `T.coinduced (Quotient.mk s)`, and show that `Quotient.mk s` is continuous into it. The second is the corresponding theorem about the coinduced topology, at the map `Quotient.mk s`.
