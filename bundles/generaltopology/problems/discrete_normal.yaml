reference: |-
  theorem discrete_isT4 (X : Type u) : (discrete X).IsT4 := by
    constructor
    · intro x y hxy
      exact ⟨{y}ᶜ, trivial, hxy, fun hn => hn rfl⟩
    · intro C D _ _ hCD
      exact ⟨C, D, trivial, trivial, subset_rfl, subset_rfl, hCD⟩
spec: 'example : ∀ (X : Type u), (discrete X).IsT4 := _root_.GeneralTopology.discrete_isT4'
preamble: |
  universe u v
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.IsClosed {X : Type u} (T : TopologicalSpace X) (C : Set X) : Prop
      := T.IsOpen Cᶜ

  def discrete (X : Type u) : TopologicalSpace X where
    IsOpen := fun _ => True
    isOpen_univ := trivial
    isOpen_inter := fun _ _ => trivial
    isOpen_sUnion := fun _ => trivial

  def TopologicalSpace.IsT1 {X : Type u} (T : TopologicalSpace X) : Prop :=
    ∀ x y : X, x ≠ y → ∃ U, T.IsOpen U ∧ x ∈ U ∧ y ∉ U

  def TopologicalSpace.IsT4 {X : Type u} (T : TopologicalSpace X) : Prop :=
    T.IsT1 ∧ ∀ C D : Set X, T.IsClosed C → T.IsClosed D → C ∩ D = ∅ →
      ∃ U V, T.IsOpen U ∧ T.IsOpen V ∧ C ⊆ U ∧ D ⊆ V ∧ U ∩ V = ∅

  end GeneralTopology
  open GeneralTopology
description: Show that `(discrete X).IsT4`. For the T₁ half offer `{y}ᶜ`; for the second half offer the two closed sets unchanged, with `subset_rfl` for the two containments and the hypothesis for the disjointness. Openness in the discrete topology is `trivial`.
