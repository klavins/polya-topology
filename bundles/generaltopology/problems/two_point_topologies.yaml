preamble: |
  universe u v w
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def discrete (X : Type u) : TopologicalSpace X where
    IsOpen := fun _ => True
    isOpen_univ := trivial
    isOpen_inter := fun _ _ => trivial
    isOpen_sUnion := fun _ => trivial

  theorem trivial_inter {X : Type u} {U V : Set X} (hU : U = ∅ ∨ U = Set.univ)
      (hV : V = ∅ ∨ V = Set.univ) : U ∩ V = ∅ ∨ U ∩ V = Set.univ := by
    rcases hU with rfl | rfl
    · left; exact Set.empty_inter V
    · rcases hV with rfl | rfl
      · left; exact Set.inter_empty _
      · right; exact Set.inter_self _

  theorem trivial_sUnion {X : Type u} {F : Set (Set X)}
      (h : ∀ U ∈ F, U = ∅ ∨ U = Set.univ) : ⋃₀ F = ∅ ∨ ⋃₀ F = Set.univ := by
    by_cases hu : (Set.univ : Set X) ∈ F
    · exact Or.inr (Set.Subset.antisymm (Set.subset_univ _) (Set.subset_sUnion_of_mem hu))
    · refine Or.inl (Set.sUnion_eq_empty.mpr ?_)
      intro U hUF
      rcases h U hUF with rfl | rfl
      · rfl
      · exact absurd hUF hu

  def indiscrete (X : Type u) : TopologicalSpace X where
    IsOpen := fun U => U = ∅ ∨ U = Set.univ
    isOpen_univ := Or.inr rfl
    isOpen_inter := trivial_inter
    isOpen_sUnion := trivial_sUnion

  def sierpinski : TopologicalSpace Bool where
    IsOpen := fun U => false ∈ U → true ∈ U
    isOpen_univ := fun _ => trivial
    isOpen_inter := fun hU hV h => ⟨hU h.1, hV h.2⟩
    isOpen_sUnion := by
      intro F h hf
      obtain ⟨U, hUF, hU⟩ := hf
      exact ⟨U, hUF, h U hUF hU⟩

  theorem sierpinski_singleton_false_not_open : ¬ sierpinski.IsOpen {false} := by
    intro h
    have : (true : Bool) ∈ ({false} : Set Bool) := h rfl
    simp at this

  def TopologicalSpace.Continuous {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      (f : X → Y) : Prop :=
    ∀ U, T'.IsOpen U → T.IsOpen (f ⁻¹' U)

  structure Homeomorph {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y) where
    toFun : X → Y
    invFun : Y → X
    left_inv : ∀ x, invFun (toFun x) = x
    right_inv : ∀ y, toFun (invFun y) = y
    continuous_toFun : T.Continuous T' toFun
    continuous_invFun : T'.Continuous T invFun

  def Homeomorphic {X : Type u} {Y : Type v} (T : TopologicalSpace X) (T' : TopologicalSpace Y) : Prop
      :=
    Nonempty (Homeomorph T T')

  theorem Homeomorph.preimage_preimage {X : Type u} {Y : Type v} {T : TopologicalSpace X}
      {T' : TopologicalSpace Y} (h : Homeomorph T T') (V : Set Y) :
      h.invFun ⁻¹' (h.toFun ⁻¹' V) = V := by
    apply Set.ext
    intro y
    show h.toFun (h.invFun y) ∈ V ↔ y ∈ V
    rw [h.right_inv]

  theorem Homeomorph.isOpen_iff {X : Type u} {Y : Type v} {T : TopologicalSpace X}
      {T' : TopologicalSpace Y}
      (h : Homeomorph T T') (V : Set Y) : T'.IsOpen V ↔ T.IsOpen (h.toFun ⁻¹' V) := by
    constructor
    · intro hV
      exact h.continuous_toFun V hV
    · intro hV
      have hp := h.continuous_invFun _ hV
      rwa [h.preimage_preimage] at hp

  def TopologicalSpace.IsDiscrete {X : Type u} (T : TopologicalSpace X) : Prop := ∀ U, T.IsOpen U

  def TopologicalSpace.IsIndiscrete {X : Type u} (T : TopologicalSpace X) : Prop :=
    ∀ U, T.IsOpen U → U = ∅ ∨ U = Set.univ

  theorem discrete_isDiscrete (X : Type u) : (discrete X).IsDiscrete := fun _ => trivial

  theorem indiscrete_isIndiscrete (X : Type u) : (indiscrete X).IsIndiscrete := fun _ hU => hU

  theorem Homeomorphic.isDiscrete {X : Type u} {Y : Type v} {T : TopologicalSpace X}
      {T' : TopologicalSpace Y}
      (h : Homeomorphic T T') (hT : T.IsDiscrete) : T'.IsDiscrete := by
    obtain ⟨e⟩ := h
    intro V
    exact (e.isOpen_iff V).mpr (hT _)

  theorem Homeomorphic.isIndiscrete {X : Type u} {Y : Type v} {T : TopologicalSpace X}
      {T' : TopologicalSpace Y}
      (h : Homeomorphic T T') (hT : T.IsIndiscrete) : T'.IsIndiscrete := by
    obtain ⟨e⟩ := h
    intro V hV
    rcases hT _ ((e.isOpen_iff V).mp hV) with he | he
    · left
      rw [← e.preimage_preimage V, he, Set.preimage_empty]
    · right
      rw [← e.preimage_preimage V, he, Set.preimage_univ]

  theorem singleton_true_not_trivial :
      ¬ (({true} : Set Bool) = ∅ ∨ ({true} : Set Bool) = Set.univ) := by
    rintro (he | he)
    · have h : (true : Bool) ∈ ({true} : Set Bool) := rfl
      rw [he] at h
      exact h
    · have h : (false : Bool) ∈ ({true} : Set Bool) := by rw [he]; trivial
      exact Bool.noConfusion h

  theorem sierpinski_not_discrete : ¬ sierpinski.IsDiscrete := fun h =>
    sierpinski_singleton_false_not_open (h {false})

  theorem sierpinski_not_indiscrete : ¬ sierpinski.IsIndiscrete := fun h =>
    singleton_true_not_trivial (h {true} (fun _ => rfl))

  end GeneralTopology
  open GeneralTopology
description: Prove that no two of `discrete Bool`, `indiscrete Bool` and `sierpinski` are homeomorphic. Each proof transports one of the two invariants along the assumed homeomorphism and contradicts a fact from the previous problems.
