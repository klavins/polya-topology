  theorem codiscrete_le_le_discrete {X : Type u} (T : Topology X) {U : Set X} :
      ((codiscrete X).IsOpen U → T.IsOpen U) ∧ (T.IsOpen U → (discrete X).IsOpen U) := by
    constructor
    · rintro (rfl | rfl)
      · exact T.empty
      · exact T.univ
    · intro _
