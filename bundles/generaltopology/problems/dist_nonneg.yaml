slug: dist_nonneg
kind: theorem
title: Distances Are Never Negative
statement: |-
  A distance ought to be a non-negative number, and that was not among the conditions. It does not have to be, because the three conditions already force it.

  Take two points `x` and `y`, and consider the journey from `x` back to `x` by way of `y`. The triangle inequality bounds the distance from `x` to itself by the length of that journey, which is `d x y + d y x`; the distance from `x` to itself is zero by the problem above; and `d y x` is `d x y` by symmetry. So `0 ≤ 2 * d x y`, and a number whose double is non-negative is non-negative.

  The argument is worth a second look, because it is the standard use of the triangle inequality: take the detour that returns to where it started, and read the inequality backwards.
concepts:
- metric_space
stub: 'theorem MetricSpace.nonneg {X : Type u} (M : MetricSpace X) (x y : X) : 0 ≤ M.dist x y := sorry'
reference: |-
  theorem MetricSpace.nonneg {X : Type u} (M : MetricSpace X) (x y : X) : 0 ≤ M.dist x y := by
    have h := M.dist_triangle x y x
    rw [M.dist_self] at h
    have e : M.dist y x = M.dist x y := M.dist_comm
    rw [e] at h
    linarith
spec: 'example : ∀ {X : Type u} (M : MetricSpace X) (x y : X), 0 ≤ M.dist x y := _root_.GeneralTopology.MetricSpace.nonneg'
preamble: |
  universe u
  namespace GeneralTopology
  structure MetricSpace (X : Type u) where
    dist : X → X → ℝ
    dist_comm : ∀ {x y}, dist x y = dist y x
    dist_triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    dist_eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  theorem MetricSpace.dist_self {X : Type u} (M : MetricSpace X) {x : X} : M.dist x x = 0 :=
    M.dist_eq_zero.mpr rfl

  end GeneralTopology
  open GeneralTopology
description: 'Show that `0 ≤ M.dist x y`. Begin with `M.dist_triangle x y x` and rewrite the distance from `x` to itself with the previous problem. Then name the symmetry you need — `have e : M.dist y x = M.dist x y := M.dist_comm`, the points being implicit — rewrite with it, and let `linarith` do the arithmetic.'
