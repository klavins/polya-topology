reference: |-
  structure Norm (V : Type u) [AddCommGroup V] [Module ℝ V] where
    norm : V → ℝ
    norm_eq_zero : ∀ {v}, norm v = 0 ↔ v = 0
    norm_smul : ∀ (c : ℝ) (v : V), norm (c • v) = |c| * norm v
    norm_add_le : ∀ v w, norm (v + w) ≤ norm v + norm w
spec: |-
  example (V : Type) [AddCommGroup V] [Module ℝ V] (N : _root_.GeneralTopology.Norm V) (c : ℝ) (v w : V) :
      (N.norm v = 0 ↔ v = 0)
        ∧ N.norm (c • v) = |c| * N.norm v
        ∧ N.norm (v + w) ≤ N.norm v + N.norm w :=
    ⟨by simp [N.norm_eq_zero], by apply N.norm_smul, by apply N.norm_add_le⟩
preamble: |
  universe u
description: 'Define the structure `Norm V` for a real vector space `V`, with four fields in this order: `norm`, of type `V → ℝ`; then `eq_zero`, `smul` and `triangle`, carrying the three conditions above. Bind the vector implicitly in `eq_zero`, whose statement fixes it; `smul` and `triangle` take their scalar and vectors explicitly, since a proof using them chooses what to put there.'
