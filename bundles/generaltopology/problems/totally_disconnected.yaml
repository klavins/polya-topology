reference: |-
  def TopologicalSpace.IsTotallyDisconnected {X : Type u} (T : TopologicalSpace X) : Prop :=
    ∀ x, T.connectedComponent x = {x}

  theorem discrete_isTotallyDisconnected (X : Type u) : (discrete X).IsTotallyDisconnected := by
    intro x
    apply Set.Subset.antisymm
    · rintro y ⟨S, ⟨hS, hxS⟩, hyS⟩
      have hcov : S ⊆ {x} ∪ {x}ᶜ := by rw [Set.union_compl_self]; exact Set.subset_univ S
      rcases hS {x} {x}ᶜ trivial trivial (fun _ _ h1 h2 => h2 h1) hcov with hs | hs
      · exact hs hyS
      · exact absurd (hs hxS) (fun hc => hc rfl)
    · intro y hy
      have e : y = x := hy
      rw [e]
      exact TopologicalSpace.mem_component _ x
spec: |-
  example {X : Type u} (T : TopologicalSpace X) : _root_.GeneralTopology.TopologicalSpace.IsTotallyDisconnected T ↔ (∀ x, T.connectedComponent x = {x}) := by unfold _root_.GeneralTopology.TopologicalSpace.IsTotallyDisconnected; first | exact Iff.rfl | grind
  example : ∀ (X : Type u), (discrete X).IsTotallyDisconnected := _root_.GeneralTopology.discrete_isTotallyDisconnected
  example (X : Type) (T : TopologicalSpace X) :
      T.IsTotallyDisconnected ↔ ∀ x, T.connectedComponent x = {x} := Iff.rfl
preamble: |
  universe u v
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def discrete (X : Type u) : TopologicalSpace X where
    IsOpen := fun _ => True
    isOpen_univ := trivial
    isOpen_inter := fun _ _ => trivial
    isOpen_sUnion := fun _ => trivial

  def TopologicalSpace.IsPreconnected {X : Type u} (T : TopologicalSpace X) (S : Set X) : Prop :=
    ∀ U V, T.IsOpen U → T.IsOpen V → (∀ x ∈ S, x ∈ U → x ∉ V) → S ⊆ U ∪ V → S ⊆ U ∨ S ⊆ V

  theorem TopologicalSpace.isPreconnected_singleton {X : Type u} (T : TopologicalSpace X) (x : X) :
      T.IsPreconnected {x} := by
    intro U V _ _ _ hcov
    have hx : x ∈ ({x} : Set X) := rfl
    rcases hcov hx with h | h
    · refine Or.inl fun y hy => ?_
      have e : y = x := hy
      rw [e]
      exact h
    · refine Or.inr fun y hy => ?_
      have e : y = x := hy
      rw [e]
      exact h

  def TopologicalSpace.connectedComponent {X : Type u} (T : TopologicalSpace X) (x : X) : Set X :=
    ⋃₀ {S | T.IsPreconnected S ∧ x ∈ S}

  theorem TopologicalSpace.mem_component {X : Type u} (T : TopologicalSpace X) (x : X)
      : x ∈ T.connectedComponent x :=
    ⟨{x}, ⟨TopologicalSpace.isPreconnected_singleton T x, rfl⟩, rfl⟩

  end GeneralTopology
  open GeneralTopology
description: Define `TopologicalSpace.IsTotallyDisconnected`, which says that `T.connectedComponent x = {x}` for every `x`, and prove `discrete_isTotallyDisconnected`. `Set.Subset.antisymm` splits the equality of sets; `trivial` proves openness in a discrete space, and `Set.union_compl_self` rewrites the cover to `Set.univ`.
