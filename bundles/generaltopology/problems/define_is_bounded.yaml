reference: |-
  def MetricSpace.IsBounded {X : Type u} (M : MetricSpace X) (S : Set X) : Prop :=
    ∃ (x : X) (ε : ℝ), S ⊆ M.ball x ε

  theorem MetricSpace.isBounded_ball {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) :
      M.IsBounded (M.ball x ε) :=
    ⟨x, ε, subset_rfl⟩
spec: |-
  example {X : Type u} (M : MetricSpace X) (S : Set X) : _root_.GeneralTopology.MetricSpace.IsBounded M S ↔ (∃ (x : X) (ε : ℝ), S ⊆ M.ball x ε) := by unfold _root_.GeneralTopology.MetricSpace.IsBounded; first | exact Iff.rfl | grind
  example : ∀ {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ), M.IsBounded (M.ball x ε) := _root_.GeneralTopology.MetricSpace.isBounded_ball
  example (X : Type) (M : MetricSpace X) (S : Set X) :
      M.IsBounded S ↔ ∃ (x : X) (ε : ℝ), S ⊆ M.ball x ε := Iff.rfl
preamble: |
  universe u
  namespace GeneralTopology
  structure MetricSpace (X : Type u) where
    dist : X → X → ℝ
    dist_comm : ∀ {x y}, dist x y = dist y x
    dist_triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    dist_eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  def MetricSpace.ball {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) : Set X :=
    {y | M.dist x y < ε}

  end GeneralTopology
  open GeneralTopology
description: Define `MetricSpace.IsBounded`, and then show that a ball is a bounded set. For the second, the ball is contained in itself, which is `subset_rfl`.
