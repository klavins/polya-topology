slug: compact_small
kind: example
title: The Empty Set and a Single Point
statement: |-
  Two sets are compact because there is so little of them to cover. The empty set needs no member of the cover at all, so the empty subcollection serves, and it is finite because it has no members.

  A single point needs one. The cover reaches `x`, so some member `U` holds it; `{U}` is a subcollection of one set, and every point of `{x}` — which is to say `x` — lies in it.
concepts:
- open_cover
stub: |-
  theorem TopologicalSpace.isCompact_empty {X : Type u} (T : TopologicalSpace X) :
      T.IsCompact (∅ : Set X) := sorry

  theorem TopologicalSpace.isCompact_singleton {X : Type u} (T : TopologicalSpace X) (x : X) :
      T.IsCompact {x} := sorry
reference: |-
  theorem TopologicalSpace.isCompact_empty {X : Type u} (T : TopologicalSpace X) :
      T.IsCompact (∅ : Set X) :=
    fun _ _ _ => ⟨∅, Set.empty_subset _, Set.finite_empty, Set.empty_subset _⟩

  theorem TopologicalSpace.isCompact_singleton {X : Type u} (T : TopologicalSpace X) (x : X) :
      T.IsCompact {x} := by
    intro F _ hcov
    obtain ⟨U, hUF, hxU⟩ := hcov rfl
    refine ⟨{U}, Set.singleton_subset_iff.mpr hUF, Set.finite_singleton U, ?_⟩
    intro y hy
    have e : y = x := hy
    exact ⟨U, rfl, e ▸ hxU⟩
spec: |-
  example : ∀ {X : Type u} (T : TopologicalSpace X), T.IsCompact (∅ : Set X) := _root_.GeneralTopology.TopologicalSpace.isCompact_empty
  example : ∀ {X : Type u} (T : TopologicalSpace X) (x : X), T.IsCompact {x} := _root_.GeneralTopology.TopologicalSpace.isCompact_singleton
preamble: |
  universe u v
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.IsCompact {X : Type u} (T : TopologicalSpace X) (S : Set X) : Prop :=
    ∀ F : Set (Set X), (∀ U ∈ F, T.IsOpen U) → S ⊆ ⋃₀ F →
      ∃ G ⊆ F, G.Finite ∧ S ⊆ ⋃₀ G

  end GeneralTopology
  open GeneralTopology
description: Prove `TopologicalSpace.isCompact_empty` and `TopologicalSpace.isCompact_singleton`. `Set.empty_subset` proves both obligations of the first. For the second, a membership `y ∈ {x}` is the equation `y = x` and must be named as one before it can be rewritten; `Set.singleton_subset_iff` turns a containment of a singleton into a membership.
