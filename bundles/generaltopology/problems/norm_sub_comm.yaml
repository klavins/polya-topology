slug: norm_sub_comm
kind: theorem
title: The Length of a Difference Does Not Depend on the Order
statement: The differences `v - w` and `w - v` are negatives of one another, and a vector and its negative have the same length. So the length of a difference does not depend on the order in which the two vectors are written — which is exactly the symmetry that the distance defined from a norm will need.
