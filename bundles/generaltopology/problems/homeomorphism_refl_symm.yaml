slug: homeomorphism_refl_symm
kind: example
title: The Identity and the Inverse
statement: |-
  A space is the same space as itself, by the identity map, which is its own inverse and is continuous in both directions.

  And the relation is symmetric, for a reason worth noticing: the definition is already symmetric in its two maps. Exchanging `toFun` with `invFun` exchanges the two inverse conditions with each other and the two continuities with each other, so a homeomorphism from `T` to `T'` becomes one from `T'` to `T` with no work at all.
concepts:
- homeomorphism
stub: |-
  def Homeomorph.refl {X : Type u} (T : TopologicalSpace X) : Homeomorph T T := sorry

  def Homeomorph.symm {X : Type u} {Y : Type v} {T : TopologicalSpace X} {T' : TopologicalSpace Y}
      (h : Homeomorph T T') : Homeomorph T' T := sorry
reference: |-
  def Homeomorph.refl {X : Type u} (T : TopologicalSpace X) : Homeomorph T T where
    toFun := id
    invFun := id
    left_inv := fun _ => rfl
    right_inv := fun _ => rfl
    continuous_toFun := TopologicalSpace.continuous_id T
    continuous_invFun := TopologicalSpace.continuous_id T

  def Homeomorph.symm {X : Type u} {Y : Type v} {T : TopologicalSpace X} {T' : TopologicalSpace Y}
      (h : Homeomorph T T') : Homeomorph T' T where
    toFun := h.invFun
    invFun := h.toFun
    left_inv := h.right_inv
    right_inv := h.left_inv
    continuous_toFun := h.continuous_invFun
    continuous_invFun := h.continuous_toFun
spec: |-
  example (X Y : Type) (T : TopologicalSpace X) (T' : TopologicalSpace Y) (h : Homeomorph T T')
      (x : X) (y : Y) :
      (_root_.GeneralTopology.Homeomorph.refl T).toFun x = x ∧ (_root_.GeneralTopology.Homeomorph.refl T).invFun x = x
        ∧ h.symm.toFun y = h.invFun y ∧ h.symm.invFun x = h.toFun x :=
    ⟨rfl, rfl, rfl, rfl⟩
preamble: |
  universe u v w
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.Continuous {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      (f : X → Y) : Prop :=
    ∀ U, T'.IsOpen U → T.IsOpen (f ⁻¹' U)

  theorem TopologicalSpace.continuous_id {X : Type u} (T : TopologicalSpace X) : T.Continuous T id
      := by
    intro U hU
    rw [Set.preimage_id]
    exact hU

  structure Homeomorph {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y) where
    toFun : X → Y
    invFun : Y → X
    left_inv : ∀ x, invFun (toFun x) = x
    right_inv : ∀ y, toFun (invFun y) = y
    continuous_toFun : T.Continuous T' toFun
    continuous_invFun : T'.Continuous T invFun

  end GeneralTopology
  open GeneralTopology
description: Define `Homeomorph.refl T`, the identity homeomorphism from `T` to itself, and `Homeomorph.symm h`, the homeomorphism the other way. Every field of each is either `rfl`, `TopologicalSpace.continuous_id` at the topology in hand, or one of the fields of `h` under a different name.
