  example : ∀ {X : Type u} (T : TopologicalSpace X) {x y : X}
      (h : y ∈ T.connectedComponent x), T.connectedComponent y = T.connectedComponent x := _root_.GeneralTopology.TopologicalSpace.component_eq_of_mem
preamble: |
  universe u v
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.IsPreconnected {X : Type u} (T : TopologicalSpace X) (S : Set X) : Prop :=
    ∀ U V, T.IsOpen U → T.IsOpen V → (∀ x ∈ S, x ∈ U → x ∉ V) → S ⊆ U ∪ V → S ⊆ U ∨ S ⊆ V

  theorem TopologicalSpace.isPreconnected_singleton {X : Type u} (T : TopologicalSpace X) (x : X) :
      T.IsPreconnected {x} := by
    intro U V _ _ _ hcov
    have hx : x ∈ ({x} : Set X) := rfl
    rcases hcov hx with h | h
    · refine Or.inl fun y hy => ?_
      have e : y = x := hy
      rw [e]
      exact h
    · refine Or.inr fun y hy => ?_
      have e : y = x := hy
      rw [e]
      exact h

  theorem TopologicalSpace.isPreconnected_sUnion {X : Type u} (T : TopologicalSpace X)
      {F : Set (Set X)} {p : X}
      (hp : ∀ S ∈ F, p ∈ S) (h : ∀ S ∈ F, T.IsPreconnected S) : T.IsPreconnected (⋃₀ F) := by
    intro U V hU hV hno hcov
    have key : ∀ S ∈ F, S ⊆ U ∨ S ⊆ V := fun S hSF => h S hSF U V hU hV
      (fun x hx => hno x ⟨S, hSF, hx⟩) (fun x hx => hcov ⟨S, hSF, hx⟩)
    by_cases hpU : p ∈ U
    · left
      rintro x ⟨S, hSF, hxS⟩
      rcases key S hSF with hs | hs
      · exact hs hxS
      · exact (hno p ⟨S, hSF, hp S hSF⟩ hpU (hs (hp S hSF))).elim
    · right
      rintro x ⟨S, hSF, hxS⟩
      rcases key S hSF with hs | hs
      · exact absurd (hs (hp S hSF)) hpU
      · exact hs hxS

  def TopologicalSpace.connectedComponent {X : Type u} (T : TopologicalSpace X) (x : X) : Set X :=
    ⋃₀ {S | T.IsPreconnected S ∧ x ∈ S}

  theorem TopologicalSpace.mem_component {X : Type u} (T : TopologicalSpace X) (x : X)
      : x ∈ T.connectedComponent x :=
    ⟨{x}, ⟨TopologicalSpace.isPreconnected_singleton T x, rfl⟩, rfl⟩

  end GeneralTopology
  open GeneralTopology
description: Prove `TopologicalSpace.isPreconnected_component`, `TopologicalSpace.subset_component` and `TopologicalSpace.component_eq_of_mem`. The first two are the union lemma and the definition read back; the third is `Set.Subset.antisymm` on the two containments the second supplies.
