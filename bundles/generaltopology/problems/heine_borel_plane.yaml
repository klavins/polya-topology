slug: heine_borel_plane
kind: theorem
title: The Heine-Borel Theorem in the Plane
statement: |-
  The plane goes the way the line went, with a box in place of an interval. A compact set is closed and bounded because the plane is a metric space; a closed and bounded set lies inside a closed box, a box is compact, and a closed subset of a compact set is compact.

  The plane measured by the taxicab length gives the same answer, being the same space. The plane measured by the Euclidean length is not settled here, since its norm needs a square root and this subject has none.
concepts:
- heine_borel
stub: |-
  theorem supNorm_isCompact_iff {S : Set (ℝ × ℝ)} :
      supNorm.toMetricSpace.toTopologicalSpace.IsCompact S ↔
        supNorm.toMetricSpace.toTopologicalSpace.IsClosed S ∧ supNorm.toMetricSpace.IsBounded S := sorry
reference: |-
  theorem supNorm_isCompact_iff {S : Set (ℝ × ℝ)} :
      supNorm.toMetricSpace.toTopologicalSpace.IsCompact S ↔
        supNorm.toMetricSpace.toTopologicalSpace.IsClosed S ∧ supNorm.toMetricSpace.IsBounded S := by
    refine ⟨fun hS => ⟨MetricSpace.isClosed_of_isCompact supNorm.toMetricSpace hS, ?_⟩, ?_⟩
    · rcases Set.eq_empty_or_nonempty S with rfl | hne
      · exact ⟨(0, 0), 0, Set.empty_subset _⟩
      · exact MetricSpace.isBounded_of_isCompact supNorm.toMetricSpace hS hne
    · rintro ⟨hC, hB⟩
      rcases Set.eq_empty_or_nonempty S with rfl | ⟨q, hq⟩
      · exact TopologicalSpace.isCompact_empty supNorm.toMetricSpace.toTopologicalSpace
      obtain ⟨p, ε, hsub⟩ := hB
      have hq' : max |p.1 - q.1| |p.2 - q.2| < ε := hsub hq
      have hε : (0 : ℝ) ≤ ε :=
        le_of_lt (lt_of_le_of_lt (le_trans (abs_nonneg _) (le_max_left _ _)) hq')
      exact TopologicalSpace.isCompact_closed_subset supNorm.toMetricSpace.toTopologicalSpace
        (supNorm_isCompact_box p hε) hC (fun z hz => supNorm_ball_subset_box p ε (hsub hz))
spec: |-
  example : ∀ {S : Set (ℝ × ℝ)}, supNorm.toMetricSpace.toTopologicalSpace.IsCompact S ↔
        supNorm.toMetricSpace.toTopologicalSpace.IsClosed S ∧ supNorm.toMetricSpace.IsBounded S := _root_.GeneralTopology.supNorm_isCompact_iff
preamble: |
  universe u v w
  namespace GeneralTopology
  structure MetricSpace (X : Type u) where
    dist : X → X → ℝ
    dist_comm : ∀ {x y}, dist x y = dist y x
    dist_triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    dist_eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  theorem MetricSpace.dist_self {X : Type u} (M : MetricSpace X) {x : X} : M.dist x x = 0 :=
    M.dist_eq_zero.mpr rfl

  theorem MetricSpace.nonneg {X : Type u} (M : MetricSpace X) (x y : X) : 0 ≤ M.dist x y := by
    have h := M.dist_triangle x y x
    rw [M.dist_self] at h
    have e : M.dist y x = M.dist x y := M.dist_comm
    rw [e] at h
    linarith

  def line : MetricSpace ℝ where
    dist x y := |x - y|
    dist_comm {x y} := abs_sub_comm x y
    dist_triangle x y z := abs_sub_le x y z
    dist_eq_zero {x y} := by rw [abs_eq_zero, sub_eq_zero]

  def MetricSpace.ball {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) : Set X :=
    {y | M.dist x y < ε}

  theorem MetricSpace.mem_ball {X : Type u} (M : MetricSpace X) {x y : X} {ε : ℝ} :
      y ∈ M.ball x ε ↔ M.dist x y < ε := Iff.rfl

  theorem MetricSpace.mem_ball_self {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) (h : 0 < ε) :
      x ∈ M.ball x ε := by
    rw [M.mem_ball, M.dist_self]
    exact h

  theorem MetricSpace.ball_mono {X : Type u} (M : MetricSpace X) {x : X} {ε δ : ℝ} (h : ε ≤ δ) :
      M.ball x ε ⊆ M.ball x δ :=
    fun _ hy => lt_of_lt_of_le hy h

  theorem MetricSpace.ball_subset_ball {X : Type u} (M : MetricSpace X) (x y : X) (ε : ℝ) :
      M.ball y ε ⊆ M.ball x (M.dist x y + ε) := by
    intro z hz
    rw [M.mem_ball] at hz ⊢
    have h := M.dist_triangle x y z
    linarith

  def MetricSpace.IsBounded {X : Type u} (M : MetricSpace X) (S : Set X) : Prop :=
    ∃ (x : X) (ε : ℝ), S ⊆ M.ball x ε

  theorem MetricSpace.isBounded_ball {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) :
      M.IsBounded (M.ball x ε) :=
    ⟨x, ε, subset_rfl⟩

  theorem MetricSpace.isBounded_subset {X : Type u} (M : MetricSpace X) (S T : Set X)
      (h : M.IsBounded S) (hTS : T ⊆ S) : M.IsBounded T := by
    obtain ⟨x, ε, hx⟩ := h
    exact ⟨x, ε, fun y hy => hx (hTS hy)⟩

  theorem MetricSpace.isBounded_union {X : Type u} (M : MetricSpace X) (S T : Set X)
      (hS : M.IsBounded S) (hT : M.IsBounded T) : M.IsBounded (S ∪ T) := by
    obtain ⟨x, ε, hx⟩ := hS
    obtain ⟨y, δ, hy⟩ := hT
    refine ⟨x, max ε (M.dist x y + δ), ?_⟩
    rintro z (hz | hz)
    · exact M.ball_mono (le_max_left _ _) (hx hz)
    · exact M.ball_mono (le_max_right _ _) (M.ball_subset_ball x y δ (hy hz))

  structure Norm (V : Type u) [AddCommGroup V] [Module ℝ V] where
    norm : V → ℝ
    norm_eq_zero : ∀ {v}, norm v = 0 ↔ v = 0
    norm_smul : ∀ (c : ℝ) (v : V), norm (c • v) = |c| * norm v
    norm_add_le : ∀ v w, norm (v + w) ≤ norm v + norm w

  theorem Norm.neg {V : Type u} [AddCommGroup V] [Module ℝ V] (N : Norm V) (v : V) :
      N.norm (-v) = N.norm v := by
    have h := N.norm_smul (-1) v
    rw [neg_one_smul] at h
    rw [h, abs_neg, abs_one, one_mul]

  theorem Norm.sub_comm {V : Type u} [AddCommGroup V] [Module ℝ V] (N : Norm V) (v w : V) :
      N.norm (v - w) = N.norm (w - v) := by
    rw [← N.neg (v - w), neg_sub]

  def Norm.toMetricSpace {V : Type u} [AddCommGroup V] [Module ℝ V] (N : Norm V) : MetricSpace V where
    dist v w := N.norm (v - w)
    dist_comm {v w} := N.sub_comm v w
    dist_triangle u v w := by
      have h := N.norm_add_le (u - v) (v - w)
      rw [sub_add_sub_cancel] at h
      exact h
    dist_eq_zero {v w} := by rw [N.norm_eq_zero, sub_eq_zero]

  theorem eq_zero_of_abs_le_zero {a : ℝ} (h : |a| ≤ 0) : a = 0 := by
    rw [← abs_eq_zero]
    have h0 := abs_nonneg a
    linarith

  theorem prod_eq_zero {v : ℝ × ℝ} : v = 0 ↔ v.1 = 0 ∧ v.2 = 0 := by
    constructor
    · intro h
      rw [h]
      exact ⟨rfl, rfl⟩
    · rintro ⟨h1, h2⟩
      exact Prod.ext h1 h2

  theorem max_abs_eq_zero {a b : ℝ} : max |a| |b| = 0 ↔ a = 0 ∧ b = 0 := by
    constructor
    · intro h
      have ha := le_max_left |a| |b|
      have hb := le_max_right |a| |b|
      rw [h] at ha hb
      exact ⟨eq_zero_of_abs_le_zero ha, eq_zero_of_abs_le_zero hb⟩
    · rintro ⟨ha, hb⟩
      rw [ha, hb, abs_zero, max_self]

  theorem max_add_max (a b c d : ℝ) : max (a + c) (b + d) ≤ max a b + max c d := by
    rw [max_le_iff]
    have a1 := le_max_left a b
    have a2 := le_max_right a b
    have b1 := le_max_left c d
    have b2 := le_max_right c d
    constructor <;> linarith

  def supNorm : Norm (ℝ × ℝ) where
    norm v := max |v.1| |v.2|
    norm_eq_zero {v} := by rw [max_abs_eq_zero, prod_eq_zero]
    norm_smul c v := by
      show max |c * v.1| |c * v.2| = |c| * max |v.1| |v.2|
      rw [abs_mul, abs_mul, mul_max_of_nonneg _ _ (abs_nonneg c)]
    norm_add_le v w := by
      show max |v.1 + w.1| |v.2 + w.2| ≤ max |v.1| |v.2| + max |w.1| |w.2|
      have h1 := max_le_max (abs_add_le v.1 w.1) (abs_add_le v.2 w.2)
      have h2 := max_add_max |v.1| |v.2| |w.1| |w.2|
      linarith

  def MetricSpace.IsOpenSet {X : Type u} (M : MetricSpace X) (U : Set X) : Prop :=
    ∀ x ∈ U, ∃ ε > 0, M.ball x ε ⊆ U

  theorem MetricSpace.isOpenSet_ball {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) :
      M.IsOpenSet (M.ball x ε) := by
    intro y hy
    rw [M.mem_ball] at hy
    refine ⟨ε - M.dist x y, by linarith, ?_⟩
    intro z hz
    rw [M.mem_ball] at hz ⊢
    have h := M.dist_triangle x y z
    linarith

  theorem MetricSpace.isOpenSet_univ {X : Type u} (M : MetricSpace X) : M.IsOpenSet (Set.univ : Set X)
      :=
    fun _ _ => ⟨1, one_pos, fun _ _ => trivial⟩

  theorem MetricSpace.isOpenSet_inter {X : Type u} (M : MetricSpace X) {U V : Set X}
      (hU : M.IsOpenSet U) (hV : M.IsOpenSet V) : M.IsOpenSet (U ∩ V) := by
    intro x hx
    obtain ⟨a, ha, hau⟩ := hU x hx.1
    obtain ⟨b, hb, hbv⟩ := hV x hx.2
    refine ⟨min a b, lt_min ha hb, ?_⟩
    intro y hy
    rw [M.mem_ball] at hy
    exact ⟨hau (lt_of_lt_of_le hy (min_le_left a b)), hbv (lt_of_lt_of_le hy (min_le_right a b))⟩

  theorem MetricSpace.isOpenSet_sUnion {X : Type u} (M : MetricSpace X) {F : Set (Set X)}
      (h : ∀ U ∈ F, M.IsOpenSet U) : M.IsOpenSet (⋃₀ F) := by
    intro x hx
    obtain ⟨U, hUF, hxU⟩ := hx
    obtain ⟨ε, hε, hsub⟩ := h U hUF x hxU
    exact ⟨ε, hε, fun y hy => ⟨U, hUF, hsub hy⟩⟩

  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  theorem TopologicalSpace.empty {X : Type u} (T : TopologicalSpace X) : T.IsOpen (∅ : Set X) := by
    have h : T.IsOpen (⋃₀ (∅ : Set (Set X))) := T.isOpen_sUnion (fun _ hU => hU.elim)
    rwa [Set.sUnion_empty] at h

  def MetricSpace.toTopologicalSpace {X : Type u} (M : MetricSpace X) : TopologicalSpace X where
    IsOpen := M.IsOpenSet
    isOpen_univ := M.isOpenSet_univ
    isOpen_inter := M.isOpenSet_inter
    isOpen_sUnion := M.isOpenSet_sUnion

  def TopologicalSpace.IsClosed {X : Type u} (T : TopologicalSpace X) (C : Set X) : Prop
      := T.IsOpen Cᶜ

  def TopologicalSpace.IsNbhd {X : Type u} (T : TopologicalSpace X) (x : X) (N : Set X) : Prop :=
    ∃ U, T.IsOpen U ∧ x ∈ U ∧ U ⊆ N

  theorem TopologicalSpace.nbhd_of_isOpen {X : Type u} (T : TopologicalSpace X) {U : Set X}
      (hU : T.IsOpen U) {x : X} (hx : x ∈ U) : T.IsNbhd x U :=
    ⟨U, hU, hx, subset_rfl⟩

  theorem TopologicalSpace.union_of_opens_inside {X : Type u} (T : TopologicalSpace X) (U : Set X)
      (h : ∀ x ∈ U, T.IsNbhd x U) : U = ⋃₀ {V | T.IsOpen V ∧ V ⊆ U} := by
    apply Set.Subset.antisymm
    · intro x hx
      obtain ⟨V, hV, hxV, hVU⟩ := h x hx
      exact ⟨V, ⟨hV, hVU⟩, hxV⟩
    · rintro x ⟨V, ⟨_, hVU⟩, hxV⟩
      exact hVU hxV

  theorem TopologicalSpace.isOpen_iff_nbhd {X : Type u} (T : TopologicalSpace X) (U : Set X) :
      T.IsOpen U ↔ ∀ x ∈ U, T.IsNbhd x U := by
    constructor
    · intro hU x hx
      exact T.nbhd_of_isOpen hU hx
    · intro h
      rw [T.union_of_opens_inside U h]
      exact T.isOpen_sUnion (fun V hV => hV.1)

  def MetricSpace.ContinuousAt {X : Type u} {Y : Type v} (M : MetricSpace X) (N : MetricSpace Y)
      (f : X → Y)
      (x : X) : Prop :=
    ∀ ε > 0, ∃ δ > 0, ∀ x', M.dist x x' < δ → N.dist (f x) (f x') < ε

  def MetricSpace.Continuous {X : Type u} {Y : Type v} (M : MetricSpace X) (N : MetricSpace Y)
      (f : X → Y) : Prop :=
    ∀ x, M.ContinuousAt N f x

  theorem line_continuous_affine (a b : ℝ) (ha : a ≠ 0) :
      line.Continuous line (fun t => a * t + b) := by
    intro x ε hε
    have hpos : 0 < |a| := abs_pos.mpr ha
    refine ⟨ε / |a|, div_pos hε hpos, ?_⟩
    intro x' h
    have hx : |x - x'| < ε / |a| := h
    show |(a * x + b) - (a * x' + b)| < ε
    have e : (a * x + b) - (a * x' + b) = a * (x - x') := by ring
    rw [e, abs_mul]
    calc |a| * |x - x'| < |a| * (ε / |a|) := mul_lt_mul_of_pos_left hx hpos
      _ = ε := mul_div_cancel₀ ε (ne_of_gt hpos)

  def TopologicalSpace.Continuous {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      (f : X → Y) : Prop :=
    ∀ U, T'.IsOpen U → T.IsOpen (f ⁻¹' U)

  theorem TopologicalSpace.continuous_id {X : Type u} (T : TopologicalSpace X) : T.Continuous T id
      := by
    intro U hU
    rw [Set.preimage_id]
    exact hU

  theorem TopologicalSpace.continuous_const {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y) (y : Y) : T.Continuous T' (fun _ => y) := by
    intro U _
    by_cases hy : y ∈ U
    · rw [show (fun _ => y) ⁻¹' U = (Set.univ : Set X) from Set.eq_univ_of_forall (fun _ => hy)]
      exact T.isOpen_univ
    · rw [show (fun _ => y) ⁻¹' U = (∅ : Set X) from Set.eq_empty_of_forall_notMem (fun _ => hy)]
      exact T.empty

  theorem MetricSpace.continuous_iff {X : Type u} {Y : Type v} (M : MetricSpace X) (N : MetricSpace Y)
      (f : X → Y) :
      M.Continuous N f ↔ M.toTopologicalSpace.Continuous N.toTopologicalSpace f := by
    constructor
    · intro hf U hU x hx
      obtain ⟨ε, hε, hball⟩ := hU (f x) hx
      obtain ⟨δ, hδ, hδ'⟩ := hf x ε hε
      exact ⟨δ, hδ, fun y hy => hball (hδ' y hy)⟩
    · intro hf x ε hε
      have hopen := hf (N.ball (f x) ε) (N.isOpenSet_ball (f x) ε)
      obtain ⟨δ, hδ, hsub⟩ := hopen x (N.mem_ball_self (f x) ε hε)
      exact ⟨δ, hδ, fun y hy => hsub hy⟩

  theorem line_continuous_affine_top (a b : ℝ) (ha : a ≠ 0) :
      line.toTopologicalSpace.Continuous line.toTopologicalSpace (fun t => a * t + b) :=
    (line.continuous_iff line _).mp (line_continuous_affine a b ha)

  theorem TopologicalSpace.eq_of_isOpen_iff {X : Type u} {T T' : TopologicalSpace X}
      (h : ∀ U, T.IsOpen U ↔ T'.IsOpen U) : T = T' := by
    obtain ⟨o, hu, hi, hs⟩ := T
    obtain ⟨o', hu', hi', hs'⟩ := T'
    have e : o = o' := funext (fun U => propext (h U))
    subst e
    rfl

  def TopologicalSpace.prod {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y) :
      TopologicalSpace (X × Y) where
    IsOpen := fun W => ∀ p ∈ W, ∃ U V, T.IsOpen U ∧ T'.IsOpen V ∧ p ∈ U ×ˢ V ∧ U ×ˢ V ⊆ W
    isOpen_univ := fun _ _ =>
      ⟨Set.univ, Set.univ, T.isOpen_univ, T'.isOpen_univ, ⟨trivial, trivial⟩, fun _ _ => trivial⟩
    isOpen_inter := by
      rintro W W' hW hW' p hp
      obtain ⟨U, V, hU, hV, hpUV, hsub⟩ := hW p hp.1
      obtain ⟨U', V', hU', hV', hpUV', hsub'⟩ := hW' p hp.2
      refine ⟨U ∩ U', V ∩ V', T.isOpen_inter hU hU', T'.isOpen_inter hV hV',
        ⟨⟨hpUV.1, hpUV'.1⟩, ⟨hpUV.2, hpUV'.2⟩⟩, ?_⟩
      rintro q ⟨hq1, hq2⟩
      exact ⟨hsub ⟨hq1.1, hq2.1⟩, hsub' ⟨hq1.2, hq2.2⟩⟩
    isOpen_sUnion := by
      rintro F h p ⟨W, hWF, hpW⟩
      obtain ⟨U, V, hU, hV, hpUV, hsub⟩ := h W hWF p hpW
      exact ⟨U, V, hU, hV, hpUV, fun q hq => ⟨W, hWF, hsub hq⟩⟩

  theorem TopologicalSpace.continuous_prod_mk {X : Type u} {Y : Type v} {Z : Type w}
      {T : TopologicalSpace X}
      {T' : TopologicalSpace Y} (S : TopologicalSpace Z) {f : Z → X} {g : Z → Y}
      (hf : S.Continuous T f)
      (hg : S.Continuous T' g) : S.Continuous (T.prod T') (fun z => (f z, g z)) := by
    intro W hW
    rw [TopologicalSpace.isOpen_iff_nbhd]
    intro z hz
    obtain ⟨U, V, hU, hV, hzUV, hsub⟩ := hW (f z, g z) hz
    refine ⟨f ⁻¹' U ∩ g ⁻¹' V, S.isOpen_inter (hf U hU) (hg V hV), ⟨hzUV.1, hzUV.2⟩, ?_⟩
    intro w hw
    exact hsub ⟨hw.1, hw.2⟩

  theorem TopologicalSpace.continuous_mk_right {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      (x : X) : T'.Continuous (T.prod T') (fun y => (x, y)) :=
    TopologicalSpace.continuous_prod_mk T' (TopologicalSpace.continuous_const T' T x)
      (TopologicalSpace.continuous_id T')

  theorem ball_supNorm_eq_box (x : ℝ × ℝ) (ε : ℝ) :
      supNorm.toMetricSpace.ball x ε = line.ball x.1 ε ×ˢ line.ball x.2 ε := by
    ext y
    show max |x.1 - y.1| |x.2 - y.2| < ε ↔ |x.1 - y.1| < ε ∧ |x.2 - y.2| < ε
    exact max_lt_iff

  theorem isOpen_prod_of_isOpenSet_supNorm {W : Set (ℝ × ℝ)} (h : supNorm.toMetricSpace.IsOpenSet W) :
      (line.toTopologicalSpace.prod line.toTopologicalSpace).IsOpen W := by
    intro p hp
    obtain ⟨ε, hε, hsub⟩ := h p hp
    refine ⟨line.ball p.1 ε, line.ball p.2 ε, MetricSpace.isOpenSet_ball line p.1 ε,
      MetricSpace.isOpenSet_ball line p.2 ε,
      ⟨MetricSpace.mem_ball_self line p.1 ε hε, MetricSpace.mem_ball_self line p.2 ε hε⟩, ?_⟩
    rw [← ball_supNorm_eq_box]
    exact hsub

  theorem isOpenSet_supNorm_of_isOpen_prod {W : Set (ℝ × ℝ)}
      (h : (line.toTopologicalSpace.prod line.toTopologicalSpace).IsOpen W) :
      supNorm.toMetricSpace.IsOpenSet W := by
    intro p hp
    obtain ⟨U, V, hU, hV, hpUV, hsub⟩ := h p hp
    obtain ⟨a, ha, hau⟩ := hU p.1 hpUV.1
    obtain ⟨b, hb, hbv⟩ := hV p.2 hpUV.2
    refine ⟨min a b, lt_min ha hb, ?_⟩
    rw [ball_supNorm_eq_box]
    rintro q ⟨hq1, hq2⟩
    exact hsub ⟨hau (MetricSpace.ball_mono line (min_le_left a b) hq1),
      hbv (MetricSpace.ball_mono line (min_le_right a b) hq2)⟩

  def unitInterval : Set ℝ := {x | 0 ≤ x ∧ x ≤ 1}

  theorem MetricSpace.dist_pos {X : Type u} (M : MetricSpace X) {x y : X} (h : x ≠ y) : 0 < M.dist x y
      := by
    rcases lt_or_eq_of_le (MetricSpace.nonneg M x y) with hlt | heq
    · exact hlt
    · exact absurd (M.dist_eq_zero.mp heq.symm) h

  def TopologicalSpace.IsCompact {X : Type u} (T : TopologicalSpace X) (S : Set X) : Prop :=
    ∀ F : Set (Set X), (∀ U ∈ F, T.IsOpen U) → S ⊆ ⋃₀ F →
      ∃ G ⊆ F, G.Finite ∧ S ⊆ ⋃₀ G

  theorem TopologicalSpace.isCompact_empty {X : Type u} (T : TopologicalSpace X) :
      T.IsCompact (∅ : Set X) :=
    fun _ _ _ => ⟨∅, Set.empty_subset _, Set.finite_empty, Set.empty_subset _⟩

  theorem TopologicalSpace.isCompact_singleton {X : Type u} (T : TopologicalSpace X) (x : X) :
      T.IsCompact {x} := by
    intro F _ hcov
    obtain ⟨U, hUF, hxU⟩ := hcov rfl
    refine ⟨{U}, Set.singleton_subset_iff.mpr hUF, Set.finite_singleton U, ?_⟩
    intro y hy
    have e : y = x := hy
    exact ⟨U, rfl, e ▸ hxU⟩

  theorem MetricSpace.isBounded_sUnion {X : Type u} (M : MetricSpace X) (x₀ : X) {G : Set (Set X)}
      (hfin : G.Finite) (h : ∀ U ∈ G, M.IsBounded U) : M.IsBounded (⋃₀ G) := by
    induction G, hfin using Set.Finite.induction_on with
    | empty => exact ⟨x₀, 0, by rintro z ⟨U, hU, -⟩; exact hU.elim⟩
    | insert _ _ ih =>
      rw [Set.sUnion_insert]
      exact MetricSpace.isBounded_union M _ _ (h _ (Set.mem_insert _ _))
        (ih (fun U hU => h U (Set.mem_insert_of_mem _ hU)))

  theorem MetricSpace.isBounded_of_isCompact {X : Type u} (M : MetricSpace X) {K : Set X}
      (hK : M.toTopologicalSpace.IsCompact K) (hne : K.Nonempty) : M.IsBounded K := by
    obtain ⟨x₀, hx₀⟩ := hne
    obtain ⟨G, hGF, hGfin, hGcov⟩ := hK {U | ∃ y : X, U = MetricSpace.ball M y 1}
      (by rintro U ⟨y, rfl⟩; exact MetricSpace.isOpenSet_ball M y 1)
      (fun y _ => ⟨MetricSpace.ball M y 1, ⟨y, rfl⟩, MetricSpace.mem_ball_self M y 1 one_pos⟩)
    refine MetricSpace.isBounded_subset M _ _ (MetricSpace.isBounded_sUnion M x₀ hGfin ?_) hGcov
    rintro U hU
    obtain ⟨y, rfl⟩ := hGF hU
    exact MetricSpace.isBounded_ball M y 1

  theorem MetricSpace.half_dist_pos {X : Type u} (M : MetricSpace X) {x y : X} (h : x ≠ y) :
      0 < M.dist x y / 2 := by
    have := MetricSpace.dist_pos M h
    linarith

  theorem MetricSpace.le_dist_of_mem_ball_half {X : Type u} (M : MetricSpace X) {x y z : X}
      (h : z ∈ M.ball y (M.dist x y / 2)) : M.dist x y / 2 ≤ M.dist x z := by
    have h1 : M.dist y z < M.dist x y / 2 := h
    have h2 := M.dist_triangle x z y
    have h3 : M.dist z y = M.dist y z := M.dist_comm
    linarith

  theorem MetricSpace.exists_dist_ge_sUnion {X : Type u} (M : MetricSpace X) {x : X} {G : Set (Set X)}
      (hfin : G.Finite) (h : ∀ U ∈ G, ∃ r > 0, ∀ z ∈ U, r ≤ M.dist x z) :
      ∃ r > 0, ∀ z ∈ ⋃₀ G, r ≤ M.dist x z := by
    induction G, hfin using Set.Finite.induction_on with
    | empty => exact ⟨1, one_pos, by rintro z ⟨U, hU, -⟩; exact hU.elim⟩
    | insert _ _ ih =>
      obtain ⟨r, hr, hrU⟩ := h _ (Set.mem_insert _ _)
      obtain ⟨s, hs, hsG⟩ := ih (fun U hU => h U (Set.mem_insert_of_mem _ hU))
      refine ⟨min r s, lt_min hr hs, ?_⟩
      rintro z ⟨U, (rfl | hU), hzU⟩
      · exact le_trans (min_le_left _ _) (hrU z hzU)
      · exact le_trans (min_le_right _ _) (hsG z ⟨U, hU, hzU⟩)

  theorem MetricSpace.isClosed_of_isCompact {X : Type u} (M : MetricSpace X) {K : Set X}
      (hK : M.toTopologicalSpace.IsCompact K) : M.toTopologicalSpace.IsClosed K := by
    intro x hx
    have hpos : ∀ y ∈ K, 0 < M.dist x y / 2 := fun y hy =>
      MetricSpace.half_dist_pos M (by rintro rfl; exact hx hy)
    obtain ⟨G, hGF, hGfin, hGcov⟩ := hK {U | ∃ y ∈ K, U = MetricSpace.ball M y (M.dist x y / 2)}
      (by rintro U ⟨y, -, rfl⟩; exact MetricSpace.isOpenSet_ball M y _)
      (fun y hy => ⟨_, ⟨y, hy, rfl⟩, by
        rw [MetricSpace.mem_ball M, MetricSpace.dist_self M]; exact hpos y hy⟩)
    obtain ⟨r, hr, hrG⟩ := MetricSpace.exists_dist_ge_sUnion M hGfin (by
      rintro U hU
      obtain ⟨y, hy, rfl⟩ := hGF hU
      exact ⟨_, hpos y hy, fun z hz => MetricSpace.le_dist_of_mem_ball_half M hz⟩)
    refine ⟨r, hr, fun z hz hzK => ?_⟩
    have h1 : M.dist x z < r := hz
    linarith [hrG z (hGcov hzK)]

  theorem TopologicalSpace.isCompact_image {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      {T' : TopologicalSpace Y}
      {f : X → Y} (hf : T.Continuous T' f) {S : Set X} (hS : T.IsCompact S) :
      T'.IsCompact (f '' S) := by
    intro F hFo hcov
    have hpre : S ⊆ ⋃₀ {V | ∃ U ∈ F, V = f ⁻¹' U} := by
      intro x hxS
      obtain ⟨U, hUF, hxU⟩ := hcov ⟨x, hxS, rfl⟩
      exact ⟨f ⁻¹' U, ⟨U, hUF, rfl⟩, hxU⟩
    obtain ⟨G, hGF, hGfin, hGcov⟩ := hS {V | ∃ U ∈ F, V = f ⁻¹' U}
      (by rintro V ⟨U, hUF, rfl⟩; exact hf U (hFo U hUF)) hpre
    refine ⟨{U | ∃ V, ∃ hV : V ∈ G, (hGF hV).choose = U}, ?_, hGfin.dependent_image _, ?_⟩
    · rintro U ⟨V, hV, rfl⟩
      exact (hGF hV).choose_spec.1
    · rintro y ⟨x, hxS, rfl⟩
      obtain ⟨V, hVG, hxV⟩ := hGcov hxS
      rw [(hGF hVG).choose_spec.2] at hxV
      exact ⟨(hGF hVG).choose, ⟨V, hVG, rfl⟩, hxV⟩

  def CoveredUpTo (F : Set (Set ℝ)) (x : ℝ) : Prop :=
    ∃ G ⊆ F, G.Finite ∧ {y | 0 ≤ y ∧ y ≤ x} ⊆ ⋃₀ G

  theorem coveredUpTo_zero {F : Set (Set ℝ)} (hcov : unitInterval ⊆ ⋃₀ F) : CoveredUpTo F 0 := by
    obtain ⟨U, hUF, hU⟩ := hcov ⟨le_refl 0, zero_le_one⟩
    refine ⟨{U}, Set.singleton_subset_iff.mpr hUF, Set.finite_singleton U, ?_⟩
    rintro y ⟨hy0, hy1⟩
    rw [le_antisymm hy1 hy0]
    exact ⟨U, rfl, hU⟩

  theorem coveredUpTo_insert {F : Set (Set ℝ)} {U : Set ℝ} (hUF : U ∈ F) {x z : ℝ}
      (h : CoveredUpTo F x) (hU : ∀ y, x < y → y ≤ z → y ∈ U) : CoveredUpTo F z := by
    obtain ⟨G, hGF, hGfin, hGcov⟩ := h
    refine ⟨insert U G, Set.insert_subset hUF hGF, hGfin.insert U, ?_⟩
    rintro y ⟨hy0, hyz⟩
    by_cases hyx : y ≤ x
    · exact Set.sUnion_mono (Set.subset_insert U G) (hGcov ⟨hy0, hyx⟩)
    · exact ⟨U, Set.mem_insert U G, hU y (not_le.mp hyx) hyz⟩

  theorem exists_coveredUpTo_of_isLUB {F : Set (Set ℝ)}
      (hFo : ∀ U ∈ F, line.toTopologicalSpace.IsOpen U) (hFcov : unitInterval ⊆ ⋃₀ F) {c : ℝ}
      (hc0 : 0 ≤ c) (hc1 : c ≤ 1) (hlub : IsLUB {x | 0 ≤ x ∧ x ≤ 1 ∧ CoveredUpTo F x} c) :
      ∃ δ > 0, ∀ z, 0 ≤ z → z < c + δ → CoveredUpTo F z := by
    obtain ⟨U, hUF, hcU⟩ := hFcov ⟨hc0, hc1⟩
    obtain ⟨ε, hε, hball⟩ := hFo U hUF c hcU
    obtain ⟨x, hxA, hxgt, hxle⟩ := hlub.exists_between (show c - ε < c by linarith)
    refine ⟨ε, hε, fun z hz0 hzc => coveredUpTo_insert hUF hxA.2.2 (fun y hy1 hy2 => hball ?_)⟩
    show |c - y| < ε
    rw [abs_lt]
    constructor <;> linarith

  theorem unitInterval_isCompact : line.toTopologicalSpace.IsCompact unitInterval := by
    intro F hFo hFcov
    obtain ⟨c, hlub⟩ := Real.exists_isLUB (s := {x | 0 ≤ x ∧ x ≤ 1 ∧ CoveredUpTo F x})
      ⟨0, le_refl 0, zero_le_one, coveredUpTo_zero hFcov⟩ ⟨1, fun x hx => hx.2.1⟩
    have hc0 : 0 ≤ c := hlub.1 ⟨le_refl 0, zero_le_one, coveredUpTo_zero hFcov⟩
    have hc1 : c ≤ 1 := hlub.2 (fun x hx => hx.2.1)
    obtain ⟨δ, hδ, key⟩ := exists_coveredUpTo_of_isLUB hFo hFcov hc0 hc1 hlub
    have hc : (1 : ℝ) ≤ c := by
      by_contra hne
      have hlt : c < 1 := not_le.mp hne
      have hz0 : (0 : ℝ) ≤ min 1 (c + δ / 2) := le_min zero_le_one (by linarith)
      have hzlt : min 1 (c + δ / 2) < c + δ := lt_of_le_of_lt (min_le_right _ _) (by linarith)
      exact absurd (hlub.1 ⟨hz0, min_le_left _ _, key _ hz0 hzlt⟩)
        (not_le.mpr (lt_min hlt (by linarith)))
    exact key 1 zero_le_one (by linarith)

  theorem TopologicalSpace.exists_box_sUnion {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      {x : X}
      {W : Set (X × Y)} {G : Set (Set Y)} (hfin : G.Finite)
      (h : ∀ V ∈ G, ∃ U, T.IsOpen U ∧ x ∈ U ∧ U ×ˢ V ⊆ W) :
      ∃ U, T.IsOpen U ∧ x ∈ U ∧ U ×ˢ ⋃₀ G ⊆ W := by
    induction G, hfin using Set.Finite.induction_on with
    | empty =>
      refine ⟨Set.univ, T.isOpen_univ, trivial, ?_⟩
      rw [Set.sUnion_empty, Set.prod_empty]
      exact Set.empty_subset W
    | insert _ _ ih =>
      obtain ⟨U, hUo, hxU, hUV⟩ := h _ (Set.mem_insert _ _)
      obtain ⟨U', hU'o, hxU', hU'G⟩ := ih (fun V hV => h V (Set.mem_insert_of_mem _ hV))
      refine ⟨U ∩ U', T.isOpen_inter hUo hU'o, ⟨hxU, hxU'⟩, ?_⟩
      rw [Set.sUnion_insert]
      rintro p ⟨hp1, hp2 | hp2⟩
      · exact hUV ⟨hp1.1, hp2⟩
      · exact hU'G ⟨hp1.2, hp2⟩

  theorem TopologicalSpace.tube_lemma {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      {B : Set Y} (hB : T'.IsCompact B) {x : X} {W : Set (X × Y)}
      (hW : (T.prod T').IsOpen W) (hxW : {x} ×ˢ B ⊆ W) :
      ∃ U, T.IsOpen U ∧ x ∈ U ∧ U ×ˢ B ⊆ W := by
    obtain ⟨G, hGF, hGfin, hGcov⟩ := hB {V | T'.IsOpen V ∧ ∃ U, T.IsOpen U ∧ x ∈ U ∧ U ×ˢ V ⊆ W}
      (fun V hV => hV.1) (fun y hy => by
        obtain ⟨U, V, hU, hV, hpUV, hsub⟩ := hW (x, y) (hxW ⟨rfl, hy⟩)
        exact ⟨V, ⟨hV, U, hU, hpUV.1, hsub⟩, hpUV.2⟩)
    obtain ⟨U, hUo, hxU, hsub⟩ := TopologicalSpace.exists_box_sUnion T hGfin (fun V hV => (hGF hV).2)
    exact ⟨U, hUo, hxU, fun p hp => hsub ⟨hp.1, hGcov hp.2⟩⟩

  theorem TopologicalSpace.isCompact_slice {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      {B : Set Y} (hB : T'.IsCompact B) (x : X) : (T.prod T').IsCompact ({x} ×ˢ B) := by
    have hc := TopologicalSpace.isCompact_image T' (TopologicalSpace.continuous_mk_right T T' x) hB
    have he : (fun y => (x, y)) '' B = {x} ×ˢ B := by
      apply Set.ext
      intro p
      constructor
      · rintro ⟨y, hy, rfl⟩
        exact ⟨rfl, hy⟩
      · rintro ⟨h1, h2⟩
        have e : p.1 = x := h1
        exact ⟨p.2, h2, by rw [← e]⟩
    rwa [he] at hc

  theorem TopologicalSpace.exists_finite_subcover {X : Type u} {Y : Type v} {F : Set (Set (X × Y))}
      {B : Set Y} {G : Set (Set X)} (hfin : G.Finite)
      (h : ∀ U ∈ G, ∃ H ⊆ F, H.Finite ∧ U ×ˢ B ⊆ ⋃₀ H) :
      ∃ H ⊆ F, H.Finite ∧ (⋃₀ G) ×ˢ B ⊆ ⋃₀ H := by
    induction G, hfin using Set.Finite.induction_on with
    | empty =>
      refine ⟨∅, Set.empty_subset F, Set.finite_empty, ?_⟩
      rw [Set.sUnion_empty, Set.empty_prod]
      exact Set.empty_subset _
    | insert _ _ ih =>
      obtain ⟨H, hHF, hHfin, hHsub⟩ := h _ (Set.mem_insert _ _)
      obtain ⟨H', hH'F, hH'fin, hH'sub⟩ := ih (fun U hU => h U (Set.mem_insert_of_mem _ hU))
      refine ⟨H ∪ H', Set.union_subset hHF hH'F, hHfin.union hH'fin, ?_⟩
      rw [Set.sUnion_insert]
      rintro p ⟨hp1 | hp1, hp2⟩
      · exact Set.sUnion_mono Set.subset_union_left (hHsub ⟨hp1, hp2⟩)
      · exact Set.sUnion_mono Set.subset_union_right (hH'sub ⟨hp1, hp2⟩)

  theorem TopologicalSpace.isCompact_prod {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      {A : Set X} {B : Set Y} (hA : T.IsCompact A) (hB : T'.IsCompact B) :
      (T.prod T').IsCompact (A ×ˢ B) := by
    intro F hFo hFcov
    obtain ⟨G, hGF, hGfin, hGcov⟩ :=
      hA {U | T.IsOpen U ∧ ∃ H ⊆ F, H.Finite ∧ U ×ˢ B ⊆ ⋃₀ H} (fun U hU => hU.1) (fun x hx => by
        obtain ⟨H, hHF, hHfin, hHcov⟩ := TopologicalSpace.isCompact_slice T T' hB x F hFo
          (fun p hp => hFcov ⟨by rw [show p.1 = x from hp.1]; exact hx, hp.2⟩)
        obtain ⟨U, hUo, hxU, hUsub⟩ := TopologicalSpace.tube_lemma T T' hB
          ((T.prod T').isOpen_sUnion (fun V hV => hFo V (hHF hV))) hHcov
        exact ⟨U, ⟨hUo, H, hHF, hHfin, hUsub⟩, hxU⟩)
    obtain ⟨H, hHF, hHfin, hHsub⟩ :=
      TopologicalSpace.exists_finite_subcover hGfin (fun U hU => (hGF hU).2)
    exact ⟨H, hHF, hHfin, fun p hp => hHsub ⟨hGcov hp.1, hp.2⟩⟩

  theorem TopologicalSpace.isCompact_closed_subset {X : Type u} (T : TopologicalSpace X) {K : Set X}
      (hK : T.IsCompact K) {C : Set X} (hC : T.IsClosed C) (hCK : C ⊆ K) :
      T.IsCompact C := by
    intro F hFo hcov
    have hopen : ∀ U ∈ insert Cᶜ F, T.IsOpen U := by
      rintro U (rfl | hU)
      exacts [hC, hFo U hU]
    have hKcov : K ⊆ ⋃₀ insert Cᶜ F := by
      intro x _
      by_cases hxC : x ∈ C
      · obtain ⟨U, hUF, hxU⟩ := hcov hxC
        exact ⟨U, Set.mem_insert_of_mem _ hUF, hxU⟩
      · exact ⟨Cᶜ, Set.mem_insert _ _, hxC⟩
    obtain ⟨G, hGF, hGfin, hGcov⟩ := hK _ hopen hKcov
    refine ⟨G ∩ F, Set.inter_subset_right, hGfin.subset Set.inter_subset_left, fun x hx => ?_⟩
    obtain ⟨U, hUG, hxU⟩ := hGcov (hCK hx)
    exact ⟨U, ⟨hUG, (hGF hUG).resolve_left (fun e => (e ▸ hxU) hx)⟩, hxU⟩

  theorem line_image_unitInterval {a b : ℝ} (hlt : a < b) :
      (fun t => (b - a) * t + a) '' unitInterval = {x | a ≤ x ∧ x ≤ b} := by
    have hne : b - a ≠ 0 := by linarith
    apply Set.ext
    rintro x
    refine ⟨?_, fun hx => ⟨(x - a) / (b - a), ⟨?_, ?_⟩, ?_⟩⟩
    · rintro ⟨t, ⟨ht0, ht1⟩, rfl⟩
      exact ⟨by nlinarith, by nlinarith⟩
    · exact div_nonneg (by linarith [hx.1]) (by linarith)
    · rw [div_le_one (by linarith)]; linarith [hx.2]
    · field_simp
      ring

  theorem line_isCompact_segment {a b : ℝ} (hab : a ≤ b) :
      line.toTopologicalSpace.IsCompact {x | a ≤ x ∧ x ≤ b} := by
    rcases eq_or_lt_of_le hab with rfl | hlt
    · have e : {x : ℝ | a ≤ x ∧ x ≤ a} = {a} :=
        Set.ext (fun x => ⟨fun h => le_antisymm h.2 h.1, fun h => ⟨le_of_eq h.symm, le_of_eq h⟩⟩)
      rw [e]
      exact TopologicalSpace.isCompact_singleton line.toTopologicalSpace a
    · rw [← line_image_unitInterval hlt]
      exact TopologicalSpace.isCompact_image line.toTopologicalSpace
        (line_continuous_affine_top (b - a) a (by linarith)) unitInterval_isCompact

  theorem supNorm_toTopologicalSpace_eq_prod :
      supNorm.toMetricSpace.toTopologicalSpace = line.toTopologicalSpace.prod line.toTopologicalSpace
        :=
    TopologicalSpace.eq_of_isOpen_iff
      (fun _ => ⟨isOpen_prod_of_isOpenSet_supNorm, isOpenSet_supNorm_of_isOpen_prod⟩)

  theorem supNorm_ball_subset_box (p : ℝ × ℝ) (ε : ℝ) :
      supNorm.toMetricSpace.ball p ε ⊆
        {x | p.1 - ε ≤ x ∧ x ≤ p.1 + ε} ×ˢ {y | p.2 - ε ≤ y ∧ y ≤ p.2 + ε} := by
    intro z hz
    have hz' : max |p.1 - z.1| |p.2 - z.2| < ε := hz
    rw [max_lt_iff, abs_lt, abs_lt] at hz'
    exact ⟨⟨by linarith [hz'.1.2], by linarith [hz'.1.1]⟩,
      ⟨by linarith [hz'.2.2], by linarith [hz'.2.1]⟩⟩

  theorem supNorm_isCompact_box (p : ℝ × ℝ) {ε : ℝ} (hε : 0 ≤ ε) :
      supNorm.toMetricSpace.toTopologicalSpace.IsCompact
        ({x | p.1 - ε ≤ x ∧ x ≤ p.1 + ε} ×ˢ {y | p.2 - ε ≤ y ∧ y ≤ p.2 + ε}) := by
    rw [supNorm_toTopologicalSpace_eq_prod]
    exact TopologicalSpace.isCompact_prod line.toTopologicalSpace line.toTopologicalSpace
      (line_isCompact_segment (by linarith)) (line_isCompact_segment (by linarith))

  end GeneralTopology
  open GeneralTopology
description: Prove `supNorm_isCompact_iff`. The two directions are those of `line_isCompact_iff`, with `supNorm_isCompact_box` in place of the interval and `supNorm_ball_subset_box` for the containment; the radius is non-negative because a point of the set is nearer to the centre than it.
