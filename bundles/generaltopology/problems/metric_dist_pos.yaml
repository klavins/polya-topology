slug: metric_dist_pos
kind: theorem
title: Distinct Points Lie a Positive Distance Apart
statement: |-
  The axioms give `M.dist x y = 0` exactly when `x = y`, and the distance is never negative. Between distinct points it is therefore strictly positive.

  That is the fact every separation argument in a metric space begins with, since the radius it works with is read off from it. A real number that is at least `0` is either greater than `0` or equal to it, which is what `lt_or_eq_of_le` says of `Metric.nonneg M x y`.
concepts:
- separation_examples
stub: 'theorem Metric.dist_pos {X : Type u} (M : Metric X) {x y : X} (h : x ≠ y) : 0 < M.dist x y := sorry'
reference: |-
  theorem Metric.dist_pos {X : Type u} (M : Metric X) {x y : X} (h : x ≠ y) : 0 < M.dist x y := by
    rcases lt_or_eq_of_le (Metric.nonneg M x y) with hlt | heq
    · exact hlt
    · exact absurd (M.eq_zero.mp heq.symm) h
spec: 'example : ∀ {X : Type u} (M : Metric X) {x y : X} (h : x ≠ y), 0 < M.dist x y := _root_.GeneralTopology.Metric.dist_pos'
preamble: |
  universe u v
  namespace GeneralTopology
  structure Metric (X : Type u) where
    dist : X → X → ℝ
    symm : ∀ {x y}, dist x y = dist y x
    triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  theorem Metric.dist_self {X : Type u} (M : Metric X) {x : X} : M.dist x x = 0 :=
    M.eq_zero.mpr rfl

  theorem Metric.nonneg {X : Type u} (M : Metric X) (x y : X) : 0 ≤ M.dist x y := by
    have h := M.triangle x y x
    rw [M.dist_self] at h
    have e : M.dist y x = M.dist x y := M.symm
    rw [e] at h
    linarith

  end GeneralTopology
  open GeneralTopology
description: Show that `0 < M.dist x y` when `x ≠ y`. Split the non-negativity with `lt_or_eq_of_le`; in the second case `M.eq_zero` turns the equation into `x = y`, which the hypothesis refutes.
