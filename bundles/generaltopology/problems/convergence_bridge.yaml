reference: |-
  theorem Metric.convergesTo_iff {X : Type u} (M : Metric X) (x : ℕ → X) (a : X) :
      M.ConvergesTo x a ↔ M.toTopology.ConvergesTo x a := by
    constructor
    · rintro h N ⟨U, hU, haU, hUN⟩
      obtain ⟨ε, hε, hball⟩ := hU a haU
      obtain ⟨k, hk⟩ := h ε hε
      exact ⟨k, fun n hn => hUN (hball (hk n hn))⟩
    · intro h ε hε
      obtain ⟨k, hk⟩ := h (Metric.ball M a ε)
        (Topology.nbhd_of_isOpen (Metric.toTopology M) (Metric.isOpenSet_ball M a ε)
          (Metric.mem_ball_self M a ε hε))
      exact ⟨k, fun n hn => hk n hn⟩
spec: 'example : ∀ {X : Type u} (M : Metric X) (x : ℕ → X) (a : X), M.ConvergesTo x a ↔ M.toTopology.ConvergesTo x a := _root_.GeneralTopology.Metric.convergesTo_iff'
preamble: |
  universe u v
  namespace GeneralTopology
  structure Metric (X : Type u) where
    dist : X → X → ℝ
    symm : ∀ {x y}, dist x y = dist y x
    triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  theorem Metric.dist_self {X : Type u} (M : Metric X) {x : X} : M.dist x x = 0 :=
    M.eq_zero.mpr rfl

  def Metric.ball {X : Type u} (M : Metric X) (x : X) (ε : ℝ) : Set X :=
    {y | M.dist x y < ε}

  theorem Metric.mem_ball {X : Type u} (M : Metric X) {x y : X} {ε : ℝ} :
      y ∈ M.ball x ε ↔ M.dist x y < ε := Iff.rfl

  theorem Metric.mem_ball_self {X : Type u} (M : Metric X) (x : X) (ε : ℝ) (h : 0 < ε) :
      x ∈ M.ball x ε := by
    rw [M.mem_ball, M.dist_self]
    exact h

  def Metric.IsOpenSet {X : Type u} (M : Metric X) (U : Set X) : Prop :=
    ∀ x ∈ U, ∃ ε > 0, M.ball x ε ⊆ U

  theorem Metric.isOpenSet_ball {X : Type u} (M : Metric X) (x : X) (ε : ℝ) :
      M.IsOpenSet (M.ball x ε) := by
    intro y hy
    rw [M.mem_ball] at hy
    refine ⟨ε - M.dist x y, by linarith, ?_⟩
    intro z hz
    rw [M.mem_ball] at hz ⊢
    have h := M.triangle x y z
    linarith

  theorem Metric.isOpenSet_univ {X : Type u} (M : Metric X) : M.IsOpenSet (Set.univ : Set X) :=
    fun _ _ => ⟨1, one_pos, fun _ _ => trivial⟩

  theorem Metric.isOpenSet_inter {X : Type u} (M : Metric X) {U V : Set X}
      (hU : M.IsOpenSet U) (hV : M.IsOpenSet V) : M.IsOpenSet (U ∩ V) := by
    intro x hx
    obtain ⟨a, ha, hau⟩ := hU x hx.1
    obtain ⟨b, hb, hbv⟩ := hV x hx.2
    refine ⟨min a b, lt_min ha hb, ?_⟩
    intro y hy
    rw [M.mem_ball] at hy
    exact ⟨hau (lt_of_lt_of_le hy (min_le_left a b)), hbv (lt_of_lt_of_le hy (min_le_right a b))⟩

  theorem Metric.isOpenSet_sUnion {X : Type u} (M : Metric X) {F : Set (Set X)}
      (h : ∀ U ∈ F, M.IsOpenSet U) : M.IsOpenSet (⋃₀ F) := by
    intro x hx
    obtain ⟨U, hUF, hxU⟩ := hx
    obtain ⟨ε, hε, hsub⟩ := h U hUF x hxU
    exact ⟨ε, hε, fun y hy => ⟨U, hUF, hsub hy⟩⟩

  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def Metric.toTopology {X : Type u} (M : Metric X) : Topology X where
    IsOpen := M.IsOpenSet
    univ := M.isOpenSet_univ
    inter := M.isOpenSet_inter
    sUnion := M.isOpenSet_sUnion

  def Topology.IsNbhd {X : Type u} (T : Topology X) (x : X) (N : Set X) : Prop :=
    ∃ U, T.IsOpen U ∧ x ∈ U ∧ U ⊆ N

  theorem Topology.nbhd_of_isOpen {X : Type u} (T : Topology X) {U : Set X}
      (hU : T.IsOpen U) {x : X} (hx : x ∈ U) : T.IsNbhd x U :=
    ⟨U, hU, hx, subset_rfl⟩

  def Metric.ConvergesTo {X : Type u} (M : Metric X) (x : ℕ → X) (a : X) : Prop :=
    ∀ ε > 0, ∃ k : ℕ, ∀ n ≥ k, M.dist a (x n) < ε

  def Topology.ConvergesTo {X : Type u} (T : Topology X) (x : ℕ → X) (a : X) : Prop :=
    ∀ N, T.IsNbhd a N → ∃ k : ℕ, ∀ n ≥ k, x n ∈ N

  end GeneralTopology
  open GeneralTopology
description: 'Prove `Metric.convergesTo_iff`: `M.ConvergesTo x a` exactly when `M.toTopology.ConvergesTo x a`. Nothing needs rewriting in either direction, since a membership in a ball is the distance inequality it abbreviates. `Topology.nbhd_of_isOpen`, with `Metric.isOpenSet_ball` and `Metric.mem_ball_self`, makes a ball into a neighbourhood of its centre.'
