slug: define_boundary
kind: definition
title: The Definition of the Boundary
statement: |-
  The interior of `S` is inside `S`, and `S` is inside its closure, so the three sit in a line. What the closure has and the interior has not is the *boundary* of `S`, written `T.boundary S`: the points approached by `S` and by its complement alike, with room around them in neither.

  On the line, the boundary of an interval is its two endpoints, whether or not the interval contains them.
concepts:
- interior_boundary
stub: 'def Topology.boundary {X : Type u} (T : Topology X) (S : Set X) : Set X := sorry'
reference: |-
  def Topology.boundary {X : Type u} (T : Topology X) (S : Set X) : Set X :=
    T.closure S \ T.interior S
spec: |-
  example {X : Type u} (T : Topology X) (S : Set X) : _root_.GeneralTopology.Topology.boundary T S = (T.closure S \ T.interior S : Set X) := rfl
  example (X : Type) (T : Topology X) (S : Set X) (x : X) :
      x ∈ T.boundary S ↔ (x ∈ T.closure S ∧ x ∉ T.interior S) := Iff.rfl
preamble: |
  universe u
  namespace GeneralTopology
  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def Topology.IsClosed {X : Type u} (T : Topology X) (C : Set X) : Prop := T.IsOpen Cᶜ

  def Topology.closure {X : Type u} (T : Topology X) (S : Set X) : Set X :=
    ⋂₀ {C | T.IsClosed C ∧ S ⊆ C}

  def Topology.interior {X : Type u} (T : Topology X) (S : Set X) : Set X :=
    ⋃₀ {U | T.IsOpen U ∧ U ⊆ S}

  end GeneralTopology
  open GeneralTopology
description: 'Define `Topology.boundary` as the closure of `S` with the interior taken away. Lean writes the difference of two sets with a backslash, `A \ B`, and a membership in it is a pair: in `A`, and not in `B`.'
