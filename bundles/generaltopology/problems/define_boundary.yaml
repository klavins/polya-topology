slug: define_boundary
kind: definition
title: The Definition of the Boundary
statement: |-
  The interior of `S` is inside `S`, and `S` is inside its closure, so the three sit in a line. What the closure has and the interior has not is the *boundary* of `S`, written `T.frontier S`: the points approached by `S` and by its complement alike, with room around them in neither.

  On the line, the boundary of an interval is its two endpoints, whether or not the interval contains them.

  The name in Lean is `frontier`, not `boundary`, because Mathlib reserves the second word for the boundary of a manifold; we follow it.
concepts:
- interior_boundary
stub: 'def TopologicalSpace.frontier {X : Type u} (T : TopologicalSpace X) (S : Set X) : Set X := sorry'
reference: |-
  def TopologicalSpace.frontier {X : Type u} (T : TopologicalSpace X) (S : Set X) : Set X :=
    T.closure S \ T.interior S
spec: |-
  example {X : Type u} (T : TopologicalSpace X) (S : Set X) : _root_.GeneralTopology.TopologicalSpace.frontier T S = (T.closure S \ T.interior S : Set X) := rfl
  example (X : Type) (T : TopologicalSpace X) (S : Set X) (x : X) :
      x ∈ T.frontier S ↔ (x ∈ T.closure S ∧ x ∉ T.interior S) := Iff.rfl
preamble: |
  universe u
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.IsClosed {X : Type u} (T : TopologicalSpace X) (C : Set X) : Prop
      := T.IsOpen Cᶜ

  def TopologicalSpace.closure {X : Type u} (T : TopologicalSpace X) (S : Set X) : Set X :=
    ⋂₀ {C | T.IsClosed C ∧ S ⊆ C}

  def TopologicalSpace.interior {X : Type u} (T : TopologicalSpace X) (S : Set X) : Set X :=
    ⋃₀ {U | T.IsOpen U ∧ U ⊆ S}

  end GeneralTopology
  open GeneralTopology
description: 'Define `TopologicalSpace.frontier` as the closure of `S` with the interior taken away. Lean writes the difference of two sets with a backslash, `A \ B`, and a membership in it is a pair: in `A`, and not in `B`.'
