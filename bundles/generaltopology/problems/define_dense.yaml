preamble: |
  universe u
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.IsClosed {X : Type u} (T : TopologicalSpace X) (C : Set X) : Prop
      := T.IsOpen Cᶜ

  def TopologicalSpace.closure {X : Type u} (T : TopologicalSpace X) (S : Set X) : Set X :=
    ⋂₀ {C | T.IsClosed C ∧ S ⊆ C}

  end GeneralTopology
  open GeneralTopology
description: Define `TopologicalSpace.Dense`, which says of a topology `T` and a set `S` that the closure of `S` is `Set.univ`. It returns a `Prop`, since it is a property of `S` and not a set.
