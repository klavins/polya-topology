  example {X : Type u} (T : Topology X) (S : Set X) : _root_.GeneralTopology.Topology.Dense T S ↔ (T.closure S = Set.univ) := by unfold _root_.GeneralTopology.Topology.Dense; first | exact Iff.rfl | grind
  example (X : Type) (T : Topology X) (S : Set X) : T.Dense S ↔ T.closure S = Set.univ := Iff.rfl
preamble: |
  universe u
  namespace GeneralTopology
  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def Topology.IsClosed {X : Type u} (T : Topology X) (C : Set X) : Prop := T.IsOpen Cᶜ

  def Topology.closure {X : Type u} (T : Topology X) (S : Set X) : Set X :=
    ⋂₀ {C | T.IsClosed C ∧ S ⊆ C}

  end GeneralTopology
  open GeneralTopology
description: Define `Topology.Dense`, which says of a topology `T` and a set `S` that the closure of `S` is `Set.univ`. It returns a `Prop`, since it is a property of `S` and not a set.
