reference: |-
  theorem TopologicalSpace.isPreconnected_singleton {X : Type u} (T : TopologicalSpace X) (x : X) :
      T.IsPreconnected {x} := by
    intro U V _ _ _ hcov
    have hx : x ∈ ({x} : Set X) := rfl
    rcases hcov hx with h | h
    · refine Or.inl fun y hy => ?_
      have e : y = x := hy
      rw [e]
      exact h
    · refine Or.inr fun y hy => ?_
      have e : y = x := hy
      rw [e]
      exact h

  theorem TopologicalSpace.isPreconnected_sUnion {X : Type u} (T : TopologicalSpace X)
      {F : Set (Set X)} {p : X}
      (hp : ∀ S ∈ F, p ∈ S) (h : ∀ S ∈ F, T.IsPreconnected S) : T.IsPreconnected (⋃₀ F) := by
    intro U V hU hV hno hcov
    have key : ∀ S ∈ F, S ⊆ U ∨ S ⊆ V := fun S hSF => h S hSF U V hU hV
      (fun x hx => hno x ⟨S, hSF, hx⟩) (fun x hx => hcov ⟨S, hSF, hx⟩)
    by_cases hpU : p ∈ U
    · left
      rintro x ⟨S, hSF, hxS⟩
      rcases key S hSF with hs | hs
      · exact hs hxS
      · exact (hno p ⟨S, hSF, hp S hSF⟩ hpU (hs (hp S hSF))).elim
    · right
      rintro x ⟨S, hSF, hxS⟩
      rcases key S hSF with hs | hs
      · exact absurd (hs (hp S hSF)) hpU
      · exact hs hxS
spec: |-
  example : ∀ {X : Type u} (T : TopologicalSpace X) (x : X), T.IsPreconnected {x} := _root_.GeneralTopology.TopologicalSpace.isPreconnected_singleton
  example : ∀ {X : Type u} (T : TopologicalSpace X)
      {F : Set (Set X)} {p : X}
      (hp : ∀ S ∈ F, p ∈ S) (h : ∀ S ∈ F, T.IsPreconnected S), T.IsPreconnected (⋃₀ F) := _root_.GeneralTopology.TopologicalSpace.isPreconnected_sUnion
preamble: |
  universe u v
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.IsPreconnected {X : Type u} (T : TopologicalSpace X) (S : Set X) : Prop :=
    ∀ U V, T.IsOpen U → T.IsOpen V → (∀ x ∈ S, x ∈ U → x ∉ V) → S ⊆ U ∪ V → S ⊆ U ∨ S ⊆ V

  end GeneralTopology
  open GeneralTopology
description: 'Prove `TopologicalSpace.isPreconnected_singleton` and `TopologicalSpace.isPreconnected_sUnion`, the second for a family `F` all of whose members contain `p`. A membership `y ∈ {x}` is the equation `y = x` and must be restated as one before rewriting; `by_cases hpU : p ∈ U` chooses the side, and `rintro x ⟨S, hSF, hxS⟩` opens a point of `⋃₀ F`.'
