reference: |-
  theorem TopologicalSpace.induced_induced {X : Type u} {Y : Type v} {Z : Type w}
      (T : TopologicalSpace Z)
      (f : Y → Z) (g : X → Y) : (T.induced f).induced g = T.induced (f ∘ g) := by
    apply TopologicalSpace.eq_of_isOpen_iff
    intro V
    constructor
    · rintro ⟨W, ⟨U, hU, rfl⟩, rfl⟩
      exact ⟨U, hU, Set.preimage_comp.symm⟩
    · rintro ⟨U, hU, rfl⟩
      exact ⟨f ⁻¹' U, ⟨U, hU, rfl⟩, Set.preimage_comp⟩
spec: |-
  example : ∀ {X : Type u} {Y : Type v} {Z : Type w}
      (T : TopologicalSpace Z)
      (f : Y → Z) (g : X → Y), (T.induced f).induced g = T.induced (f ∘ g) := _root_.GeneralTopology.TopologicalSpace.induced_induced
preamble: |
  universe u v w
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.induced {X : Type u} {Y : Type v} (T : TopologicalSpace Y) (f : X → Y)
      : TopologicalSpace X where
    IsOpen := fun V => ∃ U, T.IsOpen U ∧ V = f ⁻¹' U
    isOpen_univ := ⟨Set.univ, T.isOpen_univ, rfl⟩
    isOpen_inter := by
      rintro V W ⟨U, hU, rfl⟩ ⟨U', hU', rfl⟩
      exact ⟨U ∩ U', T.isOpen_inter hU hU', rfl⟩
    isOpen_sUnion := by
      intro F h
      refine ⟨⋃₀ {U | T.IsOpen U ∧ (f ⁻¹' U : Set X) ∈ F}, T.isOpen_sUnion (fun U hU => hU.1), ?_⟩
      apply Set.Subset.antisymm
      · rintro x ⟨V, hVF, hxV⟩
        obtain ⟨U, hU, rfl⟩ := h V hVF
        exact ⟨U, ⟨hU, hVF⟩, hxV⟩
      · rintro x ⟨U, ⟨hU, hUF⟩, hxU⟩
        exact ⟨_, hUF, hxU⟩

  theorem TopologicalSpace.eq_of_isOpen_iff {X : Type u} {T T' : TopologicalSpace X}
      (h : ∀ U, T.IsOpen U ↔ T'.IsOpen U) : T = T' := by
    obtain ⟨o, hu, hi, hs⟩ := T
    obtain ⟨o', hu', hi', hs'⟩ := T'
    have e : o = o' := funext (fun U => propext (h U))
    subst e
    rfl

  end GeneralTopology
  open GeneralTopology
description: Prove `(T.induced f).induced g = T.induced (f ∘ g)`. The previous problem reduces it to an equivalence at each set; `Set.preimage_comp` closes one direction and its symmetric form the other.
