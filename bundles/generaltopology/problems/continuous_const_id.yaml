preamble: |
  universe u v w
  namespace GeneralTopology
  structure MetricSpace (X : Type u) where
    dist : X → X → ℝ
    dist_comm : ∀ {x y}, dist x y = dist y x
    dist_triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    dist_eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  theorem MetricSpace.dist_self {X : Type u} (M : MetricSpace X) {x : X} : M.dist x x = 0 :=
    M.dist_eq_zero.mpr rfl

  def MetricSpace.ContinuousAt {X : Type u} {Y : Type v} (M : MetricSpace X) (N : MetricSpace Y)
      (f : X → Y)
      (x : X) : Prop :=
    ∀ ε > 0, ∃ δ > 0, ∀ x', M.dist x x' < δ → N.dist (f x) (f x') < ε

  def MetricSpace.Continuous {X : Type u} {Y : Type v} (M : MetricSpace X) (N : MetricSpace Y)
      (f : X → Y) : Prop :=
    ∀ x, M.ContinuousAt N f x

  end GeneralTopology
  open GeneralTopology
description: Show that a constant map and the identity are continuous. For the first, `M.dist_self` rewrites the distance away and the tolerance is positive by hypothesis; for the second, offering `ε` leaves a goal that is the hypothesis already.
