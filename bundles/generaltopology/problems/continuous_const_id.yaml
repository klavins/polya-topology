  theorem MetricSpace.continuous_const {X : Type u} {Y : Type v} (M : MetricSpace X)
      (N : MetricSpace Y) (y : Y) :
      M.Continuous N (fun _ => y) := by
    intro x ε hε
    refine ⟨1, one_pos, ?_⟩
    intro x' _
    rw [N.dist_self]
    exact hε

  theorem MetricSpace.continuous_id {X : Type u} (M : MetricSpace X) : M.Continuous M id := by
    intro x ε hε
    exact ⟨ε, hε, fun _ h => h⟩
