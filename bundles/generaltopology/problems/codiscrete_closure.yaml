description: 'Prove the two. Each is a case analysis: `rcases` a hypothesis of the form `U = ∅ ∨ U = Set.univ` and the substitution does most of the work. For the union, split on `Set.univ ∈ F` with `by_cases`; `Set.subset_sUnion_of_mem` and `Set.subset_univ` sandwich one case and `Set.sUnion_eq_empty` reduces the other.'
