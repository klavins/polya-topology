spec: 'example : ∀ {X : Type u} (M : MetricSpace X), M.IsOpenSet (Set.univ : Set X) := _root_.GeneralTopology.MetricSpace.isOpenSet_univ'
preamble: |
  universe u
  namespace GeneralTopology
  structure MetricSpace (X : Type u) where
    dist : X → X → ℝ
    dist_comm : ∀ {x y}, dist x y = dist y x
    dist_triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    dist_eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  def MetricSpace.ball {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) : Set X :=
    {y | M.dist x y < ε}

  def MetricSpace.IsOpenSet {X : Type u} (M : MetricSpace X) (U : Set X) : Prop :=
    ∀ x ∈ U, ∃ ε > 0, M.ball x ε ⊆ U

  end GeneralTopology
  open GeneralTopology
description: Show that `Set.univ` is open in any metric space. The witness is `⟨1, one_pos, _⟩`, and the containment holds because everything belongs to `Set.univ`, which `trivial` proves.
