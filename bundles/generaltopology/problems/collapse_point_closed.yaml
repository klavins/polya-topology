reference: |-
  theorem collapse_point_isClosed {X : Type u} (T : Topology X) {A : Set X} (hA : T.IsClosed A)
      {a : X} (ha : a ∈ A) :
      (T.quotient (collapse A)).IsClosed {Quotient.mk (collapse A) a} := by
    show T.IsOpen (Quotient.mk (collapse A) ⁻¹' {Quotient.mk (collapse A) a}ᶜ)
    rw [Set.preimage_compl, collapse_preimage_class ha]
    exact hA

  theorem line_collapse_interval :
      (line.toTopology.quotient (collapse unitInterval)).IsClosed
        {Quotient.mk (collapse unitInterval) 0} :=
    collapse_point_isClosed line.toTopology unitInterval_closed ⟨le_refl 0, by norm_num⟩
spec: |-
  example : ∀ {X : Type u} (T : Topology X) {A : Set X} (hA : T.IsClosed A)
      {a : X} (ha : a ∈ A), (T.quotient (collapse A)).IsClosed {Quotient.mk (collapse A) a} := _root_.GeneralTopology.collapse_point_isClosed
  example : (line.toTopology.quotient (collapse unitInterval)).IsClosed
        {Quotient.mk (collapse unitInterval) 0} := _root_.GeneralTopology.line_collapse_interval
preamble: |
  universe u v w
  namespace GeneralTopology
  structure Metric (X : Type u) where
    dist : X → X → ℝ
    symm : ∀ {x y}, dist x y = dist y x
    triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  def line : Metric ℝ where
    dist x y := |x - y|
    symm {x y} := abs_sub_comm x y
    triangle x y z := abs_sub_le x y z
    eq_zero {x y} := by rw [abs_eq_zero, sub_eq_zero]

  def Metric.ball {X : Type u} (M : Metric X) (x : X) (ε : ℝ) : Set X :=
    {y | M.dist x y < ε}

  theorem Metric.mem_ball {X : Type u} (M : Metric X) {x y : X} {ε : ℝ} :
      y ∈ M.ball x ε ↔ M.dist x y < ε := Iff.rfl

  def Metric.IsOpenSet {X : Type u} (M : Metric X) (U : Set X) : Prop :=
    ∀ x ∈ U, ∃ ε > 0, M.ball x ε ⊆ U

  theorem Metric.isOpenSet_univ {X : Type u} (M : Metric X) : M.IsOpenSet (Set.univ : Set X) :=
    fun _ _ => ⟨1, one_pos, fun _ _ => trivial⟩

  theorem Metric.isOpenSet_inter {X : Type u} (M : Metric X) {U V : Set X}
      (hU : M.IsOpenSet U) (hV : M.IsOpenSet V) : M.IsOpenSet (U ∩ V) := by
    intro x hx
    obtain ⟨a, ha, hau⟩ := hU x hx.1
    obtain ⟨b, hb, hbv⟩ := hV x hx.2
    refine ⟨min a b, lt_min ha hb, ?_⟩
    intro y hy
    rw [M.mem_ball] at hy
    exact ⟨hau (lt_of_lt_of_le hy (min_le_left a b)), hbv (lt_of_lt_of_le hy (min_le_right a b))⟩

  theorem Metric.isOpenSet_sUnion {X : Type u} (M : Metric X) {F : Set (Set X)}
      (h : ∀ U ∈ F, M.IsOpenSet U) : M.IsOpenSet (⋃₀ F) := by
    intro x hx
    obtain ⟨U, hUF, hxU⟩ := hx
    obtain ⟨ε, hε, hsub⟩ := h U hUF x hxU
    exact ⟨ε, hε, fun y hy => ⟨U, hUF, hsub hy⟩⟩

  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def Metric.toTopology {X : Type u} (M : Metric X) : Topology X where
    IsOpen := M.IsOpenSet
    univ := M.isOpenSet_univ
    inter := M.isOpenSet_inter
    sUnion := M.isOpenSet_sUnion

  def Topology.IsClosed {X : Type u} (T : Topology X) (C : Set X) : Prop := T.IsOpen Cᶜ

  theorem preimage_sUnion_image {X : Type u} {Y : Type v} (f : X → Y) (F : Set (Set Y)) :
      f ⁻¹' (⋃₀ F) = ⋃₀ (Set.preimage f '' F) := by
    apply Set.Subset.antisymm
    · rintro x ⟨V, hVF, hxV⟩
      exact ⟨f ⁻¹' V, ⟨V, hVF, rfl⟩, hxV⟩
    · rintro x ⟨W, ⟨V, hVF, rfl⟩, hxW⟩
      exact ⟨V, hVF, hxW⟩

  def Topology.coinduced {X : Type u} {Y : Type v} (T : Topology X) (f : X → Y) : Topology Y where
    IsOpen := fun V => T.IsOpen (f ⁻¹' V)
    univ := by
      rw [Set.preimage_univ]
      exact T.univ
    inter := by
      intro V W hV hW
      rw [Set.preimage_inter]
      exact T.inter hV hW
    sUnion := by
      intro F h
      rw [preimage_sUnion_image]
      refine T.sUnion ?_
      rintro W ⟨V, hVF, rfl⟩
      exact h V hVF

  def Topology.quotient {X : Type u} (T : Topology X) (s : Setoid X) : Topology (Quotient s) :=
    T.coinduced (Quotient.mk s)

  def collapse {X : Type u} (A : Set X) : Setoid X where
    r := fun x y => x = y ∨ (x ∈ A ∧ y ∈ A)
    iseqv := ⟨fun _ => Or.inl rfl, by
        rintro x y (rfl | ⟨hx, hy⟩)
        · exact Or.inl rfl
        · exact Or.inr ⟨hy, hx⟩, by
        rintro x y z (rfl | ⟨hx, hy⟩) (rfl | ⟨hy', hz⟩)
        · exact Or.inl rfl
        · exact Or.inr ⟨hy', hz⟩
        · exact Or.inr ⟨hx, hy⟩
        · exact Or.inr ⟨hx, hz⟩⟩

  theorem collapse_preimage_class {X : Type u} {A : Set X} {a : X} (ha : a ∈ A) :
      Quotient.mk (collapse A) ⁻¹' {Quotient.mk (collapse A) a} = A := by
    apply Set.Subset.antisymm
    · intro x hx
      rcases Quotient.exact hx with rfl | ⟨hxA, _⟩
      · exact ha
      · exact hxA
    · intro x hx
      exact Quotient.sound (Or.inr ⟨hx, ha⟩)

  def unitInterval : Set ℝ := {x | 0 ≤ x ∧ x ≤ 1}

  theorem unitInterval_closed : line.toTopology.IsClosed unitInterval := by
    show line.IsOpenSet unitIntervalᶜ
    intro x hx
    rcases not_and_or.mp hx with h | h
    · refine ⟨-x, by linarith [not_le.mp h], ?_⟩
      intro y hy
      rw [Metric.mem_ball line, show line.dist x y = |x - y| from rfl, abs_sub_lt_iff] at hy
      exact fun hy' => absurd hy'.1 (by linarith [hy.1])
    · refine ⟨x - 1, by linarith [not_le.mp h], ?_⟩
      intro y hy
      rw [Metric.mem_ball line, show line.dist x y = |x - y| from rfl, abs_sub_lt_iff] at hy
      exact fun hy' => absurd hy'.2 (by linarith [hy.1])

  end GeneralTopology
  open GeneralTopology
description: Prove that the class of a point of a closed `A` is a closed set of `T.quotient (collapse A)`, and read off the case of the line and the unit interval. For the first, restate the goal with `show`, move the complement across the preimage with `Set.preimage_compl`, and rewrite with `collapse_preimage_class`.
