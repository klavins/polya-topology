reference: |-
  theorem TopologicalSpace.isClosed_subspace_iff {X : Type u} (T : TopologicalSpace X) (A : Set X)
      (V : Set A) :
      (T.subspace A).IsClosed V ↔ ∃ C, T.IsClosed C ∧ V = Subtype.val ⁻¹' C := by
    constructor
    · rintro ⟨U, hU, hVU⟩
      refine ⟨Uᶜ, ?_, ?_⟩
      · show T.IsOpen Uᶜᶜ
        rwa [compl_compl]
      · rw [Set.preimage_compl, ← hVU, compl_compl]
    · rintro ⟨C, hC, rfl⟩
      show (T.subspace A).IsOpen _
      refine ⟨Cᶜ, hC, ?_⟩
      rw [Set.preimage_compl]
spec: |-
  example : ∀ {X : Type u} (T : TopologicalSpace X) (A : Set X)
      (V : Set A), (T.subspace A).IsClosed V ↔ ∃ C, T.IsClosed C ∧ V = Subtype.val ⁻¹' C := _root_.GeneralTopology.TopologicalSpace.isClosed_subspace_iff
preamble: |
  universe u v w
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.IsClosed {X : Type u} (T : TopologicalSpace X) (C : Set X) : Prop
      := T.IsOpen Cᶜ

  def TopologicalSpace.subspace {X : Type u} (T : TopologicalSpace X) (A : Set X)
      : TopologicalSpace A where
    IsOpen := fun V => ∃ U, T.IsOpen U ∧ V = Subtype.val ⁻¹' U
    isOpen_univ := ⟨Set.univ, T.isOpen_univ, rfl⟩
    isOpen_inter := by
      rintro V W ⟨U, hU, rfl⟩ ⟨U', hU', rfl⟩
      exact ⟨U ∩ U', T.isOpen_inter hU hU', rfl⟩
    isOpen_sUnion := by
      intro F h
      refine ⟨⋃₀ {U | T.IsOpen U ∧ (Subtype.val ⁻¹' U : Set A) ∈ F},
        T.isOpen_sUnion (fun U hU => hU.1), ?_⟩
      apply Set.Subset.antisymm
      · rintro x ⟨V, hVF, hxV⟩
        obtain ⟨U, hU, rfl⟩ := h V hVF
        exact ⟨U, ⟨hU, hVF⟩, hxV⟩
      · rintro x ⟨U, ⟨hU, hUF⟩, hxU⟩
        exact ⟨_, hUF, hxU⟩

  end GeneralTopology
  open GeneralTopology
description: Prove that `V` is closed in `T.subspace A` exactly when `V = Subtype.val ⁻¹' C` for some closed `C` of `X`. `Set.preimage_compl` moves a complement across a preimage, and `compl_compl` cancels the pair that appears on each side.
