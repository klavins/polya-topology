slug: slice_compact
kind: theorem
title: A Fibre of a Product is Compact
statement: The fibre `{x} ×ˢ B` is the image of `B` under the map pairing a point of the second factor with the fixed `x`, and that map was shown continuous when the product was built. The continuous image of a compact set is compact, so the fibre is compact in the product — and the product topology is never opened up to see it.
