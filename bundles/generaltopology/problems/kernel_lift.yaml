reference: |-
  def kernelLift {X : Type u} {Y : Type v} (f : X → Y) : Quotient (kernelSetoid f) → Y :=
    Quotient.lift f (fun _ _ h => h)

  theorem kernelLift_injective {X : Type u} {Y : Type v} (f : X → Y)
      {p q : Quotient (kernelSetoid f)} (h : kernelLift f p = kernelLift f q) : p = q := by
    induction p using Quotient.inductionOn with
    | _ x =>
      induction q using Quotient.inductionOn with
      | _ y => exact Quotient.sound h
spec: |-
  example : ∀ {X : Type u} {Y : Type v} (f : X → Y)
      {p q : Quotient (kernelSetoid f)} (h : _root_.GeneralTopology.kernelLift f p = _root_.GeneralTopology.kernelLift f q), p = q := _root_.GeneralTopology.kernelLift_injective
  example (X Y : Type) (f : X → Y) (x : X) :
      _root_.GeneralTopology.kernelLift f (Quotient.mk (kernelSetoid f) x) = f x := rfl
preamble: |
  universe u v w
  namespace GeneralTopology
  def kernelSetoid {X : Type u} {Y : Type v} (f : X → Y) : Setoid X where
    r := fun x y => f x = f y
    iseqv := ⟨fun _ => rfl, fun h => h.symm, fun h h' => h.trans h'⟩

  end GeneralTopology
  open GeneralTopology
description: Define `kernelLift f`, the map `Quotient (kernelSetoid f) → Y` that `f` descends to, and show that it is injective. For the second, take both classes apart with `induction … using Quotient.inductionOn` and close with `Quotient.sound` applied to the hypothesis.
