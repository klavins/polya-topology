slug: define_is_open_set
kind: definition
title: Open Sets
statement: |-
  A subset `U` of a metric space is *open* when every point of it has room to spare: for each `x` in `U` there is a radius `ε > 0`, however small, with the whole ball `M.ball x ε` inside `U`. No point of an open set sits on its edge.

  The radius depends on the point, and that is the whole content of the definition. A point deep inside `U` has a generous ball; one near the edge has a small one; what is asked is only that some positive radius works for each.

  `∃ ε > 0, p ε` abbreviates `∃ ε, ε > 0 ∧ p ε`.
concepts:
- open_sets
stub: 'def MetricSpace.IsOpenSet {X : Type u} (M : MetricSpace X) (U : Set X) : Prop := sorry'
reference: |-
  def MetricSpace.IsOpenSet {X : Type u} (M : MetricSpace X) (U : Set X) : Prop :=
    ∀ x ∈ U, ∃ ε > 0, M.ball x ε ⊆ U
spec: |-
  example {X : Type u} (M : MetricSpace X) (U : Set X) : _root_.GeneralTopology.MetricSpace.IsOpenSet M U ↔ (∀ x ∈ U, ∃ ε > 0, M.ball x ε ⊆ U) := by unfold _root_.GeneralTopology.MetricSpace.IsOpenSet; first | exact Iff.rfl | grind
  example (X : Type) (M : MetricSpace X) (U : Set X) :
      M.IsOpenSet U ↔ ∀ x ∈ U, ∃ ε > 0, M.ball x ε ⊆ U := Iff.rfl
preamble: |
  universe u
  namespace GeneralTopology
  structure MetricSpace (X : Type u) where
    dist : X → X → ℝ
    dist_comm : ∀ {x y}, dist x y = dist y x
    dist_triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    dist_eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  def MetricSpace.ball {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) : Set X :=
    {y | M.dist x y < ε}

  end GeneralTopology
  open GeneralTopology
