reference: |-
  theorem TopologicalSpace.prod_eq_sUnion_boxes {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      {W : Set (X × Y)} (hW : (T.prod T').IsOpen W) :
      W = ⋃₀ {B | B ⊆ W ∧ ∃ U V, T.IsOpen U ∧ T'.IsOpen V ∧ B = U ×ˢ V} := by
    apply Set.Subset.antisymm
    · intro p hp
      obtain ⟨U, V, hU, hV, hpUV, hsub⟩ := hW p hp
      exact ⟨U ×ˢ V, ⟨hsub, U, V, hU, hV, rfl⟩, hpUV⟩
    · rintro p ⟨B, ⟨hBW, _⟩, hpB⟩
      exact hBW hpB
spec: |-
  example : ∀ {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      {W : Set (X × Y)} (hW : (T.prod T').IsOpen W), W = ⋃₀ {B | B ⊆ W ∧ ∃ U V, T.IsOpen U ∧ T'.IsOpen V ∧ B = U ×ˢ V} := _root_.GeneralTopology.TopologicalSpace.prod_eq_sUnion_boxes
preamble: |
  universe u v w
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.prod {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y) :
      TopologicalSpace (X × Y) where
    IsOpen := fun W => ∀ p ∈ W, ∃ U V, T.IsOpen U ∧ T'.IsOpen V ∧ p ∈ U ×ˢ V ∧ U ×ˢ V ⊆ W
    isOpen_univ := fun _ _ =>
      ⟨Set.univ, Set.univ, T.isOpen_univ, T'.isOpen_univ, ⟨trivial, trivial⟩, fun _ _ => trivial⟩
    isOpen_inter := by
      rintro W W' hW hW' p hp
      obtain ⟨U, V, hU, hV, hpUV, hsub⟩ := hW p hp.1
      obtain ⟨U', V', hU', hV', hpUV', hsub'⟩ := hW' p hp.2
      refine ⟨U ∩ U', V ∩ V', T.isOpen_inter hU hU', T'.isOpen_inter hV hV',
        ⟨⟨hpUV.1, hpUV'.1⟩, ⟨hpUV.2, hpUV'.2⟩⟩, ?_⟩
      rintro q ⟨hq1, hq2⟩
      exact ⟨hsub ⟨hq1.1, hq2.1⟩, hsub' ⟨hq1.2, hq2.2⟩⟩
    isOpen_sUnion := by
      rintro F h p ⟨W, hWF, hpW⟩
      obtain ⟨U, V, hU, hV, hpUV, hsub⟩ := h W hWF p hpW
      exact ⟨U, V, hU, hV, hpUV, fun q hq => ⟨W, hWF, hsub hq⟩⟩

  end GeneralTopology
  open GeneralTopology
description: Show that an open `W` of `T.prod T'` equals `⋃₀ {B | B ⊆ W ∧ ∃ U V, T.IsOpen U ∧ T'.IsOpen V ∧ B = U ×ˢ V}`. `Set.Subset.antisymm` splits it in two; one direction offers the box the definition supplies at the point, and the other applies the containment the member carries.
