slug: rationals_dense
kind: example
title: The Rationals are Dense in the Line
statement: |-
  Between any two distinct real numbers there is a rational one. That single fact — `exists_rat_btwn`, the Archimedean property of the line in the form we need it — says that the rationals are dense in the real line.

  Let `x` be real and `ε > 0`. Applying it to `x - ε < x + ε` gives a rational `q` strictly between, and `|x - q| < ε` follows, so `q` lies in the ball of radius `ε` about `x`. Every ball about every point holds a rational, which by the metric characterisation of the closure is density.

  The set of rationals inside the reals is `rationals`, the real numbers of the form `(q : ℝ)`.
concepts:
- dense_sets
stub: |-
  def rationals : Set ℝ := {x | ∃ q : ℚ, (q : ℝ) = x}

  theorem rationals_dense : line.toTopology.Dense rationals := sorry
reference: |-
  def rationals : Set ℝ := {x | ∃ q : ℚ, (q : ℝ) = x}

  theorem rationals_dense : line.toTopology.Dense rationals := by
    show line.toTopology.closure rationals = Set.univ
    apply Set.eq_univ_of_forall
    intro x
    apply line.mem_closure_iff.mpr
    intro ε hε
    obtain ⟨q, h1, h2⟩ := exists_rat_btwn (show x - ε < x + ε by linarith)
    refine ⟨(q : ℝ), ?_, ⟨q, rfl⟩⟩
    rw [line.mem_ball]
    show |x - (q : ℝ)| < ε
    rw [abs_sub_lt_iff]
    exact ⟨by linarith, by linarith⟩
spec: |-
  example : _root_.GeneralTopology.rationals = ({x | ∃ q : ℚ, (q : ℝ) = x} : Set ℝ) := rfl
  example : line.toTopology.Dense _root_.GeneralTopology.rationals := _root_.GeneralTopology.rationals_dense
preamble: |
  universe u
  namespace GeneralTopology
  structure Metric (X : Type u) where
    dist : X → X → ℝ
    symm : ∀ {x y}, dist x y = dist y x
    triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  theorem Metric.dist_self {X : Type u} (M : Metric X) {x : X} : M.dist x x = 0 :=
    M.eq_zero.mpr rfl

  def line : Metric ℝ where
    dist x y := |x - y|
    symm {x y} := abs_sub_comm x y
    triangle x y z := abs_sub_le x y z
    eq_zero {x y} := by rw [abs_eq_zero, sub_eq_zero]

  def Metric.ball {X : Type u} (M : Metric X) (x : X) (ε : ℝ) : Set X :=
    {y | M.dist x y < ε}

  theorem Metric.mem_ball {X : Type u} (M : Metric X) {x y : X} {ε : ℝ} :
      y ∈ M.ball x ε ↔ M.dist x y < ε := Iff.rfl

  theorem Metric.mem_ball_self {X : Type u} (M : Metric X) (x : X) (ε : ℝ) (h : 0 < ε) :
      x ∈ M.ball x ε := by
    rw [M.mem_ball, M.dist_self]
    exact h

  def Metric.IsOpenSet {X : Type u} (M : Metric X) (U : Set X) : Prop :=
    ∀ x ∈ U, ∃ ε > 0, M.ball x ε ⊆ U

  theorem Metric.isOpenSet_ball {X : Type u} (M : Metric X) (x : X) (ε : ℝ) :
      M.IsOpenSet (M.ball x ε) := by
    intro y hy
    rw [M.mem_ball] at hy
    refine ⟨ε - M.dist x y, by linarith, ?_⟩
    intro z hz
    rw [M.mem_ball] at hz ⊢
    have h := M.triangle x y z
    linarith

  theorem Metric.isOpenSet_univ {X : Type u} (M : Metric X) : M.IsOpenSet (Set.univ : Set X) :=
    fun _ _ => ⟨1, one_pos, fun _ _ => trivial⟩

  theorem Metric.isOpenSet_inter {X : Type u} (M : Metric X) {U V : Set X}
      (hU : M.IsOpenSet U) (hV : M.IsOpenSet V) : M.IsOpenSet (U ∩ V) := by
    intro x hx
    obtain ⟨a, ha, hau⟩ := hU x hx.1
    obtain ⟨b, hb, hbv⟩ := hV x hx.2
    refine ⟨min a b, lt_min ha hb, ?_⟩
    intro y hy
    rw [M.mem_ball] at hy
    exact ⟨hau (lt_of_lt_of_le hy (min_le_left a b)), hbv (lt_of_lt_of_le hy (min_le_right a b))⟩

  theorem Metric.isOpenSet_sUnion {X : Type u} (M : Metric X) {F : Set (Set X)}
      (h : ∀ U ∈ F, M.IsOpenSet U) : M.IsOpenSet (⋃₀ F) := by
    intro x hx
    obtain ⟨U, hUF, hxU⟩ := hx
    obtain ⟨ε, hε, hsub⟩ := h U hUF x hxU
    exact ⟨ε, hε, fun y hy => ⟨U, hUF, hsub hy⟩⟩

  structure Topology (X : Type u) where
    IsOpen : Set X → Prop
    univ : IsOpen Set.univ
    inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def Metric.toTopology {X : Type u} (M : Metric X) : Topology X where
    IsOpen := M.IsOpenSet
    univ := M.isOpenSet_univ
    inter := M.isOpenSet_inter
    sUnion := M.isOpenSet_sUnion

  def Topology.IsClosed {X : Type u} (T : Topology X) (C : Set X) : Prop := T.IsOpen Cᶜ

  def Topology.IsNbhd {X : Type u} (T : Topology X) (x : X) (N : Set X) : Prop :=
    ∃ U, T.IsOpen U ∧ x ∈ U ∧ U ⊆ N

  theorem Topology.nbhd_of_isOpen {X : Type u} (T : Topology X) {U : Set X}
      (hU : T.IsOpen U) {x : X} (hx : x ∈ U) : T.IsNbhd x U :=
    ⟨U, hU, hx, subset_rfl⟩

  def Topology.closure {X : Type u} (T : Topology X) (S : Set X) : Set X :=
    ⋂₀ {C | T.IsClosed C ∧ S ⊆ C}

  theorem Topology.mem_closure_iff {X : Type u} (T : Topology X) {S : Set X} {x : X} :
      x ∈ T.closure S ↔ ∀ N, T.IsNbhd x N → (N ∩ S).Nonempty := by
    constructor
    · rintro hx N ⟨U, hU, hxU, hUN⟩
      by_contra h
      have hSU : S ⊆ Uᶜ := by
        intro y hy hyU
        exact h ⟨y, hUN hyU, hy⟩
      have hcl : T.IsClosed Uᶜ := by
        show T.IsOpen _
        rwa [compl_compl]
      exact hx Uᶜ ⟨hcl, hSU⟩ hxU
    · intro h C hC
      by_contra hxC
      obtain ⟨y, hyC, hyS⟩ := h Cᶜ ⟨Cᶜ, hC.1, hxC, subset_rfl⟩
      exact hyC (hC.2 hyS)

  theorem Metric.mem_closure_iff {X : Type u} (M : Metric X) {S : Set X} {x : X} :
      x ∈ M.toTopology.closure S ↔ ∀ ε > 0, (M.ball x ε ∩ S).Nonempty := by
    rw [M.toTopology.mem_closure_iff]
    constructor
    · intro h ε hε
      have hN : M.toTopology.IsNbhd x (M.ball x ε) :=
        M.toTopology.nbhd_of_isOpen (M.isOpenSet_ball x ε) (M.mem_ball_self x ε hε)
      exact h (M.ball x ε) hN
    · rintro h N ⟨U, hU, hxU, hUN⟩
      obtain ⟨ε, hε, hball⟩ := hU x hxU
      obtain ⟨y, hy, hyS⟩ := h ε hε
      exact ⟨y, hUN (hball hy), hyS⟩

  def Topology.Dense {X : Type u} (T : Topology X) (S : Set X) : Prop :=
    T.closure S = Set.univ

  end GeneralTopology
  open GeneralTopology
description: Show that `rationals` is dense in `line.toTopology`. Restate the goal with `show`, prove it a point at a time with `Set.eq_univ_of_forall`, and apply `line.mem_closure_iff` to reduce it to the balls. `abs_sub_lt_iff` splits an absolute value into the two inequalities `linarith` wants.
