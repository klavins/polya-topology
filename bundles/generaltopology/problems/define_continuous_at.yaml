reference: |-
  def Metric.ContinuousAt {X : Type u} {Y : Type v} (M : Metric X) (N : Metric Y) (f : X → Y)
      (x : X) : Prop :=
    ∀ ε > 0, ∃ δ > 0, ∀ x', M.dist x x' < δ → N.dist (f x) (f x') < ε

  def Metric.Continuous {X : Type u} {Y : Type v} (M : Metric X) (N : Metric Y) (f : X → Y) : Prop :=
    ∀ x, M.ContinuousAt N f x
spec: |-
  example {X : Type u} {Y : Type v} (M : Metric X) (N : Metric Y) (f : X → Y)
      (x : X) : _root_.GeneralTopology.Metric.ContinuousAt M N f x ↔ (∀ ε > 0, ∃ δ > 0, ∀ x', M.dist x x' < δ → N.dist (f x) (f x') < ε) := by unfold _root_.GeneralTopology.Metric.ContinuousAt; first | exact Iff.rfl | grind
  example {X : Type u} {Y : Type v} (M : Metric X) (N : Metric Y) (f : X → Y) : _root_.GeneralTopology.Metric.Continuous M N f ↔ (∀ x, M.ContinuousAt N f x) := by unfold _root_.GeneralTopology.Metric.Continuous; first | exact Iff.rfl | grind
  example (X Y : Type) (M : Metric X) (N : Metric Y) (f : X → Y) (x : X) :
      (M.ContinuousAt N f x ↔ ∀ ε > 0, ∃ δ > 0, ∀ x', M.dist x x' < δ → N.dist (f x) (f x') < ε)
        ∧ (M.Continuous N f ↔ ∀ x, M.ContinuousAt N f x) :=
    ⟨Iff.rfl, Iff.rfl⟩
preamble: |
  universe u v w
  namespace GeneralTopology
  structure Metric (X : Type u) where
    dist : X → X → ℝ
    symm : ∀ {x y}, dist x y = dist y x
    triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  end GeneralTopology
  open GeneralTopology
description: 'Define `Metric.ContinuousAt`, taking a metric `M` on `X`, a metric `N` on `Y`, a map `f : X → Y` and a point `x`, and then `Metric.Continuous`, which says `f` is continuous at every point. Write the two distances as `M.dist x x''` and `N.dist (f x) (f x'')`. `∀ ε > 0, p ε` abbreviates `∀ ε, ε > 0 → p ε`.'
