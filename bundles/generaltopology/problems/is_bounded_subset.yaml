slug: is_bounded_subset
kind: theorem
title: A Subset of a Bounded Set is Bounded
statement: 'Anything inside something bounded is bounded, and by the same ball: if `T ⊆ S` and `S` lies in a ball, then `T` lies in that ball. The proof is the composition of two containments, and no property of the metric is used at all.'
concepts:
- bounded_set
stub: |-
  theorem MetricSpace.isBounded_subset {X : Type u} (M : MetricSpace X) (S T : Set X)
      (h : M.IsBounded S) (hTS : T ⊆ S) : M.IsBounded T := sorry
reference: |-
  theorem MetricSpace.isBounded_subset {X : Type u} (M : MetricSpace X) (S T : Set X)
      (h : M.IsBounded S) (hTS : T ⊆ S) : M.IsBounded T := by
    obtain ⟨x, ε, hx⟩ := h
    exact ⟨x, ε, fun y hy => hx (hTS hy)⟩
spec: |-
  example : ∀ {X : Type u} (M : MetricSpace X) (S T : Set X)
      (h : M.IsBounded S) (hTS : T ⊆ S), M.IsBounded T := _root_.GeneralTopology.MetricSpace.isBounded_subset
preamble: |
  universe u
  namespace GeneralTopology
  structure MetricSpace (X : Type u) where
    dist : X → X → ℝ
    dist_comm : ∀ {x y}, dist x y = dist y x
    dist_triangle : ∀ x y z, dist x z ≤ dist x y + dist y z
    dist_eq_zero : ∀ {x y}, dist x y = 0 ↔ x = y

  def MetricSpace.ball {X : Type u} (M : MetricSpace X) (x : X) (ε : ℝ) : Set X :=
    {y | M.dist x y < ε}

  def MetricSpace.IsBounded {X : Type u} (M : MetricSpace X) (S : Set X) : Prop :=
    ∃ (x : X) (ε : ℝ), S ⊆ M.ball x ε

  end GeneralTopology
  open GeneralTopology
description: Show that `M.IsBounded T` follows from `M.IsBounded S` and `T ⊆ S`. `obtain ⟨x, ε, hx⟩ := h` takes the hypothesis apart into the centre, the radius and the containment, and the same centre and radius will do.
