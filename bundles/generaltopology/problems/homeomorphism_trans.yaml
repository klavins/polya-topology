reference: |-
  def Homeomorph.trans {X : Type u} {Y : Type v} {Z : Type w} {T : TopologicalSpace X}
      {T' : TopologicalSpace Y} {T'' : TopologicalSpace Z} (h : Homeomorph T T')
        (h' : Homeomorph T' T'') :
      Homeomorph T T'' where
    toFun := h'.toFun ∘ h.toFun
    invFun := h.invFun ∘ h'.invFun
    left_inv := fun x => by
      show h.invFun (h'.invFun (h'.toFun (h.toFun x))) = x
      rw [h'.left_inv, h.left_inv]
    right_inv := fun z => by
      show h'.toFun (h.toFun (h.invFun (h'.invFun z))) = z
      rw [h.right_inv, h'.right_inv]
    continuous_toFun := TopologicalSpace.continuous_comp T h.continuous_toFun h'.continuous_toFun
    continuous_invFun := TopologicalSpace.continuous_comp T'' h'.continuous_invFun h.continuous_invFun
spec: |-
  example (X Y Z : Type) (T : TopologicalSpace X) (T' : TopologicalSpace Y) (T'' : TopologicalSpace Z)
      (h : Homeomorph T T') (h' : Homeomorph T' T'') (x : X) (z : Z) :
      (h.trans h').toFun x = h'.toFun (h.toFun x)
        ∧ (h.trans h').invFun z = h.invFun (h'.invFun z) := ⟨rfl, rfl⟩
preamble: |
  universe u v w
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.Continuous {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y)
      (f : X → Y) : Prop :=
    ∀ U, T'.IsOpen U → T.IsOpen (f ⁻¹' U)

  theorem TopologicalSpace.continuous_comp {X : Type u} {Y : Type v} {Z : Type w}
      (T : TopologicalSpace X)
      {T' : TopologicalSpace Y} {T'' : TopologicalSpace Z} {f : X → Y} {g : Y → Z}
      (hf : T.Continuous T' f) (hg : T'.Continuous T'' g) : T.Continuous T'' (g ∘ f) := by
    intro U hU
    rw [Set.preimage_comp]
    exact hf _ (hg U hU)

  structure Homeomorph {X : Type u} {Y : Type v} (T : TopologicalSpace X)
      (T' : TopologicalSpace Y) where
    toFun : X → Y
    invFun : Y → X
    left_inv : ∀ x, invFun (toFun x) = x
    right_inv : ∀ y, toFun (invFun y) = y
    continuous_toFun : T.Continuous T' toFun
    continuous_invFun : T'.Continuous T invFun

  end GeneralTopology
  open GeneralTopology
description: Define `Homeomorph.trans h h'`, the composite homeomorphism from `T` to `T''`. For the two inverse conditions, `show` restates the goal with the composition unfolded and two rewrites cancel the pairs; for the two continuities, `TopologicalSpace.continuous_comp` takes the topology of the source and then the two continuities in the order they are applied.
