reference: |-
  theorem TopologicalSpace.eq_of_isOpen_iff {X : Type u} {T T' : TopologicalSpace X}
      (h : ∀ U, T.IsOpen U ↔ T'.IsOpen U) : T = T' := by
    obtain ⟨o, hu, hi, hs⟩ := T
    obtain ⟨o', hu', hi', hs'⟩ := T'
    have e : o = o' := funext (fun U => propext (h U))
    subst e
    rfl
spec: |-
  example : ∀ {X : Type u} {T T' : TopologicalSpace X}
      (h : ∀ U, T.IsOpen U ↔ T'.IsOpen U), T = T' := _root_.GeneralTopology.TopologicalSpace.eq_of_isOpen_iff
preamble: |
  universe u v w
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  end GeneralTopology
  open GeneralTopology
description: Prove that `T = T'` whenever `T.IsOpen U ↔ T'.IsOpen U` for every `U`. Take both topologies apart with `obtain ⟨o, hu, hi, hs⟩ := T`, prove the two families equal with `funext` and `propext`, substitute with `subst`, and close with `rfl`.
