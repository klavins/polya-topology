reference: |-
  theorem TopologicalSpace.isClosed_union {X : Type u} (T : TopologicalSpace X) {C D : Set X}
      (hC : T.IsClosed C) (hD : T.IsClosed D) : T.IsClosed (C ∪ D) := by
    show T.IsOpen _
    rw [Set.compl_union]
    exact T.isOpen_inter hC hD
spec: |-
  example : ∀ {X : Type u} (T : TopologicalSpace X) {C D : Set X}
      (hC : T.IsClosed C) (hD : T.IsClosed D), T.IsClosed (C ∪ D) := _root_.GeneralTopology.TopologicalSpace.isClosed_union
preamble: |
  universe u
  namespace GeneralTopology
  structure TopologicalSpace (X : Type u) where
    IsOpen : Set X → Prop
    isOpen_univ : IsOpen Set.univ
    isOpen_inter : ∀ {U V}, IsOpen U → IsOpen V → IsOpen (U ∩ V)
    isOpen_sUnion : ∀ {F : Set (Set X)}, (∀ U ∈ F, IsOpen U) → IsOpen (⋃₀ F)

  def TopologicalSpace.IsClosed {X : Type u} (T : TopologicalSpace X) (C : Set X) : Prop
      := T.IsOpen Cᶜ

  end GeneralTopology
  open GeneralTopology
description: Show that `C ∪ D` is closed when `C` and `D` are. `show T.IsOpen _`, rewrite with `Set.compl_union`, and the intersection condition finishes it.
