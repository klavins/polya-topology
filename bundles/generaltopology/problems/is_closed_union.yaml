slug: is_closed_union
kind: theorem
title: The Union of Two Closed Sets
statement: 'Each condition on the open sets says something about the closed ones, with the roles of union and intersection exchanged, because complementing exchanges them: `(C ∪ D)ᶜ = Cᶜ ∩ Dᶜ`. So the union of two closed sets is closed, matching the intersection of two open ones, and — though it is not proved here — an intersection of any number of closed sets is closed.'
