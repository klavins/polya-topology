- 'Urs Schreiber, Introduction to Topology 1 — Point-set Topology, nLab: https://ncatlab.org/nlab/show/Introduction+to+Topology+--+1 — this subject follows its selection and order of results; the prose, the Lean, and the problems are written here.'
- 'The nLab: https://ncatlab.org'
link_policy: open
environment:
  slug: mathlib-generaltopology
  modules:
  - Mathlib.Data.Real.Basic
  - Mathlib.Data.Set.Basic
  - Mathlib.Algebra.Module.Prod
  - Mathlib.Tactic.Linarith
  - Mathlib.Tactic.Ring
  - Mathlib.Tactic.NormNum
  - Mathlib.Data.Set.Lattice
  - Mathlib.Data.Set.Finite.Basic
  - Mathlib.Algebra.Order.Archimedean.Real.Basic
  - Mathlib.Data.Set.Prod
  project: mathlib
  toolchain: leanprover/lean4:v4.31.0
  mathlib_rev: v4.31.0
concepts:
- slug: metric_space
  description: Distance is the first thing one measures about a pair of points, and much of mathematics is an elaboration of it. A metric space is a set together with a rule giving each pair of its points a distance, subject to a few conditions taken from the way distance behaves on a map. Everything that follows is deduced from those conditions and nothing else.
  kind: definition
  goal: false
  section: Metric Spaces
  section_order: 0
  title: Metric Spaces
  position: 0
- slug: real_line
  description: 'A definition says nothing until something satisfies it. The real line is the instance to hold in mind for the rest of the subject: the simplest metric space there is, and the one against which every later notion can be read.'
  kind: definition
  goal: false
  section: Metric Spaces
  section_order: 0
  title: The Real Line as a Metric Space
  position: 1
- slug: open_ball
  description: 'Around each point of a metric space, and for each radius, lie the points nearer to it than that radius. Balls are how a metric is used: almost everything built on one — bounded, open, convergent, continuous — is stated by saying that some ball lies inside something, and the distances themselves appear only in the definition of the ball.'
  kind: definition
  goal: false
  section: Metric Spaces
  section_order: 0
  title: Open Balls, Closed Balls and Spheres
  position: 2
- slug: bounded_set
  description: 'A subset of a metric space is bounded when it does not run away to infinity: when one ball, of some finite radius, already holds the whole of it. The notion belongs to the metric rather than to the set, so one distance may call a set bounded where another does not.'
  kind: definition
  goal: false
  section: Metric Spaces
  section_order: 0
  title: Bounded Subsets
  position: 3
- slug: normed_space
  description: Most metrics are not given directly; they come from a length. Where vectors can be added and scaled, one measures the size of a single vector, and the distance between two is the size of their difference. A rule that measures a vector's size is a norm, and the conditions it must satisfy are what this concept sets down.
  kind: definition
  goal: false
  section: Metric Spaces
  section_order: 0
  title: Normed Vector Spaces
  position: 4
- slug: norm_metric
  description: A norm measures one vector; the distance between two is the length of their difference. That one step turns every normed vector space into a metric space, and it is where almost all the metrics of analysis come from — which is why a norm is worth defining at all.
  kind: theorem
  goal: false
  section: Metric Spaces
  section_order: 0
  title: The Metric of a Norm
  position: 5
- slug: plane_norms
  description: 'On the line there is one reasonable length. On the plane there are many, and which to measure with is a real choice. Setting two of them side by side asks what a metric space keeps and what it throws away: two lengths can disagree everywhere and still call the same sets near, and that is the observation topology is built on.'
  kind: definition
  goal: false
  section: Metric Spaces
  section_order: 0
  title: Two Norms on the Plane
  position: 6
- slug: open_sets
  description: 'A metric answers how far apart two points are, but most of what is built on it asks only a coarser question: is there room around this point? A set with room around each of its points is called open. Which sets are open turns out to be all that the later notions use, and it is the bridge from measuring to the subject proper.'
  kind: definition
  goal: false
  section: Topological Spaces
  section_order: 1
  title: The Open Sets of a Metric Space
  position: 7
- slug: topological_space
  description: 'The three facts just proved are all that most of the subject uses about a metric. So take them as the definition: a topology on a set is a choice of which subsets are open, asked only to contain the whole set and to be closed under intersecting two and uniting any number. What is gained is everything that has open sets but no distance.'
  kind: definition
  goal: false
  section: Topological Spaces
  section_order: 1
  title: Topological Spaces
  position: 8
- slug: metric_topology
  description: 'Every metric space is a topological space, by taking the open sets to be the ones the metric already calls open. This is the reason the axioms were chosen as they were, and it is the source of most of the examples: whenever a set carries a distance it carries a topology, and different distances may well give the same one.'
  kind: theorem
  goal: false
  section: Topological Spaces
  section_order: 1
  title: The Topology of a Metric
  position: 9
- slug: closed_sets
  description: 'A set is closed when its complement is open. Closed is not the opposite of open and not its negation: a set may be both, as the whole space is, or neither. The two notions carry the same information — each determines the other — and which is more convenient depends on what is being said.'
  kind: definition
  goal: false
  section: Topological Spaces
  section_order: 1
  title: Closed Sets
  position: 10
- slug: neighbourhoods
  description: 'A neighbourhood of a point is any set with an open set around that point inside it. The notion localises openness: a set is open exactly when it is a neighbourhood of each of its own points. That equivalence is how a global condition on a set is traded for a condition at each point, which is the form nearly every later argument takes.'
  kind: definition
  goal: false
  section: Topological Spaces
  section_order: 1
  title: Neighbourhoods
  position: 11
- slug: extreme_topologies
  description: 'Every set carries at least two topologies, and they are the ends of the range: one calls every subset open, the other only the two it must. Neither is interesting on its own; both are useful as bounds, as sources of counterexamples, and as a check that the axioms are weak enough to admit the trivial cases and strong enough to exclude nothing else.'
  kind: definition
  goal: false
  section: Basic Examples
  section_order: 2
  title: The Two Extreme Topologies
  position: 12
- slug: sierpinski_space
  description: 'The smallest space that is neither discrete nor codiscrete has two points, one of which is open and the other not. It is the standard source of the phenomena that vanish when a space is nice: two distinct points that no open set separates, and a point whose only neighbourhood is everything.'
  kind: definition
  goal: false
  section: Basic Examples
  section_order: 2
  title: The Sierpiński Space
  position: 13
- slug: cofinite_topology
  description: 'On any set, calling a subset open when it leaves out only finitely many points gives a topology. It is the first example whose conditions really have to be checked, and the first where the asymmetry between two and any number does visible work: complements of finitely many open sets stay finite because a finite union of finite sets is finite.'
  kind: definition
  goal: false
  section: Basic Examples
  section_order: 2
  title: The Cofinite Topology
  position: 14
- slug: subspace_topology
  description: A subset of a topological space is a topological space in its own right, with the sets cut out of the ambient open sets by intersection. This is how every space met in practice arises — a curve, a surface, a solid is a subset of a Euclidean space — and it is the first construction that makes new spaces out of old, which is what the rest of the subject does.
  kind: definition
  goal: false
  section: Basic Examples
  section_order: 2
  title: The Subspace Topology
  position: 15
- slug: closed_families
  description: Every condition on the open sets has a mirror image about the closed ones, with union and intersection exchanged, because complementing exchanges them. The last section took one of those mirrors and left two. Both are needed here, and the first of them is what the next concept is built out of.
  kind: theorem
  goal: false
  section: Closure, Interior and Boundary
  section_order: 3
  title: Families of Closed Sets
  position: 16
- slug: closure
  description: 'An arbitrary set is neither open nor closed, and the topology''s first act on it is to close it: to name the smallest closed set it cannot escape. That set is its closure, and it exists because closed sets are stable under intersecting any number of them. It is what the topology makes of a set it was not given.'
  kind: definition
  goal: false
  section: Closure, Interior and Boundary
  section_order: 3
  title: The Closure of a Set
  position: 17
- slug: closure_points
  description: 'The closure was built from outside, by intersecting the closed sets around a set. It has a description from inside: a point belongs to it exactly when the set is found arbitrarily near. That is the form every later use takes, and in a metric space it becomes a statement about balls, which is how a limit will be defined.'
  kind: theorem
  goal: false
  section: Closure, Interior and Boundary
  section_order: 3
  title: The Points of the Closure
  position: 18
- slug: interior_boundary
  description: 'Dual to the closure, and built the same way from the other end: the largest open set inside a set. The interior holds the points with room around them, the closure the points the set approaches, and what lies between the two is the boundary. A set is open and closed at once exactly when that is empty.'
  kind: definition
  goal: false
  section: Closure, Interior and Boundary
  section_order: 3
  title: Interior and Boundary
  position: 19
- slug: dense_sets
  description: 'A set is dense when its closure is the whole space: every point is approached by it, and no nonempty open set avoids it. Density is how a small set stands in for a large one — the rationals for the line — and it is the first property of a subset that the topology alone can see, the metric having nothing to say about it.'
  kind: definition
  goal: false
  section: Closure, Interior and Boundary
  section_order: 3
  title: Dense Subsets
  position: 20
- slug: epsilon_delta
  description: 'Continuity was defined for functions of a real variable long before topology existed: the image is held inside any tolerance we are given by holding the argument inside a tolerance we choose. Only distances are needed to say it, so it reads in any metric space — and it is the definition the abstract one will have to agree with.'
  kind: definition
  goal: false
  section: Continuous Functions
  section_order: 4
  title: Continuity in a Metric Space
  position: 21
- slug: continuous_maps
  description: 'A topological space has no distances, so continuity must be said without them. There is exactly one way, and it is the fact the last section''s open sets were for: a map is continuous when the preimage of every open set is open. Every statement about maps in the rest of the subject is made in that form.'
  kind: definition
  goal: false
  section: Continuous Functions
  section_order: 4
  title: Continuity Without Distances
  position: 22
- slug: continuity_bridge
  description: 'Two definitions of continuity are now in hand, one that needs distances and one that does not. They agree wherever both can be read: a map between metric spaces satisfies the ε-δ condition exactly when it is continuous for the topologies the metrics induce. This is what licenses the abstract definition, and it is the theorem this section is built around.'
  kind: theorem
  goal: false
  section: Continuous Functions
  section_order: 4
  title: The Two Definitions Agree
  position: 23
- slug: continuity_closed
  description: Open and closed carry the same information, so continuity has a closed-set form, and the two are one statement read through a complement. From it comes the sentence that says what continuity means for the closure operation — a continuous map does not tear a set away from the points it approaches — and the pointwise form that neighbourhoods make available.
  kind: theorem
  goal: false
  section: Continuous Functions
  section_order: 4
  title: Closed Sets, Closures and Points
  position: 24
- slug: continuity_examples
  description: 'The definition is tested against the spaces already built. A discrete space admits every map out of it and a codiscrete space every map into it, so neither constrains anything. The two-point space is the opposite: a map into it is nothing more nor less than an open subset of the space it comes from.'
  kind: theorem
  goal: false
  section: Continuous Functions
  section_order: 4
  title: What the Definition Admits
  position: 25
- slug: homeomorphism
  description: 'Two spaces that differ only in the names of their points ought to count as the same space. A continuous map with a continuous inverse says exactly that: it matches the points of one with the points of the other and the open sets of one with the open sets of the other, so nothing a topology can see tells the two apart. This is the subject''s notion of sameness.'
  kind: definition
  goal: false
  section: Homeomorphisms
  section_order: 5
  title: Homeomorphisms
  position: 26
- slug: open_closed_maps
  description: 'Continuity is a condition on preimages and says nothing about images: a continuous map may well carry an open set to a set that is not open. The maps that do carry open sets to open sets, or closed to closed, deserve a name of their own, and the first thing the name is good for is a test telling which continuous bijections are homeomorphisms.'
  kind: definition
  goal: false
  section: Homeomorphisms
  section_order: 5
  title: Open Maps and Closed Maps
  position: 27
- slug: metric_equivalence
  description: A topology remembers less than a metric does. Two metrics on one set, each of whose balls contain balls of the other about the same point, call exactly the same subsets open, so the identity map is a homeomorphism between the spaces they give. The first section's two lengths on the plane stand in that relation, and this is what those measurements were for.
  kind: theorem
  goal: false
  section: Homeomorphisms
  section_order: 5
  title: Equivalent Metrics
  position: 28
- slug: topological_invariants
  description: To show that two spaces are the same one exhibits a homeomorphism. To show that they are not, one needs a property that homeomorphic spaces must share, and then finds it on one side and not on the other. Two such properties settle the three topologies a two-point set carries, and with them the subject can say that spaces differ, and not only that they agree.
  kind: theorem
  goal: false
  section: Homeomorphisms
  section_order: 5
  title: Telling Two Spaces Apart
  position: 29
- slug: subspace_maps
  description: 'A subset of a space carries the topology cut out of the ambient open sets. What that buys is a test for maps: a map into the subset is continuous exactly when the same map read into the whole space is, so a subspace is never examined directly. Its closed sets are cut out the same way.'
  kind: theorem
  goal: false
  section: Subspaces and Products
  section_order: 6
  title: Maps and a Subspace
  position: 30
- slug: induced_topology
  description: The subspace topology pulls the open sets of a space back along an inclusion. Nothing in that used the map to be an inclusion, and the same construction along an arbitrary map is the coarsest topology making that map continuous. Naming it makes the subspace one case rather than a separate definition, and it is the shape every later construction of a space from a map takes.
  kind: definition
  goal: false
  section: Subspaces and Products
  section_order: 6
  title: The Induced Topology
  position: 31
- slug: product_topology
  description: 'Two spaces have a product set, and it should be a space. A point of it is a pair, and the room around a pair is a pair of rooms: a set is open when each of its points has an open box around it inside. This is the first construction of a space from two others, and what the subject later says about separation, compactness and the plane is said in it.'
  kind: definition
  goal: false
  section: Subspaces and Products
  section_order: 6
  title: The Product Topology
  position: 32
- slug: product_maps
  description: The projections out of a product are continuous, and they are open maps as well, which continuous maps rarely are. In the other direction a map into a product is a pair of maps, one into each factor, and it is continuous exactly when both of them are. With that, the product never has to be examined through its definition again.
  kind: theorem
  goal: false
  section: Subspaces and Products
  section_order: 6
  title: Maps and a Product
  position: 33
- slug: plane_is_product
  description: The plane was built as a set with a distance, the line as a set with a distance, and the two have had no formal relation. The supremum distance is the larger of the two coordinate distances, so a ball of it is a square — a box of two intervals. The plane is therefore the product of two lines, which is where the metric half of the subject meets the topological one.
  kind: theorem
  goal: false
  section: Subspaces and Products
  section_order: 6
  title: The Plane as a Product
  position: 34
- slug: final_topology
  description: 'The induced topology pulls the open sets back along a map into a space. Reverse the arrow: given a map out of a space, call a set open below when its preimage is open above. This is the finest topology making that map continuous, and every space built by gluing — a quotient, a disjoint union — carries it.'
  kind: definition
  goal: false
  section: Quotients and Sums
  section_order: 7
  title: The Final Topology
  position: 35
- slug: lean_quotients
  description: 'An equivalence relation on a set gives the set of its classes. In Lean the relation is bundled with its proof of being one as a `Setoid`, and `Quotient` builds the type of classes out of it. Three things are needed of that type: that every element of it is a class, when two classes are equal, and how a map out of it is given. None of them is topology.'
  kind: definition
  goal: false
  section: Quotients and Sums
  section_order: 7
  title: Quotients in Lean
  position: 36
- slug: quotient_space
  description: Gluing points together is the first construction that makes a space smaller rather than larger. The set of classes carries the final topology along the map sending a point to its class, so a set of classes is open exactly when the points those classes collect form an open set. Every space made by identification is one of these.
  kind: definition
  goal: false
  section: Quotients and Sums
  section_order: 7
  title: The Quotient Space
  position: 37
- slug: sum_space
  description: 'Two spaces laid side by side, touching nowhere. A point is a point of one or a point of the other, and a set is open when the part of it lying in each is open there. This is the construction dual to the product: where a map into a product is a pair of maps, a map out of a sum is a pair of maps.'
  kind: definition
  goal: false
  section: Quotients and Sums
  section_order: 7
  title: The Sum of Two Spaces
  position: 38
- slug: quotient_examples
  description: 'The first identification worth making: take a subset, declare all of its points equal, and leave everything else alone. The space that results has one new point where the subset was. What that point inherits from the subset is the question the construction is for, and the answer for a closed subset is the last thing this subject proves.'
  kind: theorem
  goal: true
  section: Quotients and Sums
  section_order: 7
  title: Collapsing a Subset
  position: 39
